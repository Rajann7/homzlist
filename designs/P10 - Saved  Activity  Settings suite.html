\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--ink3);margin-top:2px\">${s.meta}<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--ink3);margin-top:2px\">${s.signed}<\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"btn btn-outline btn-sm\" data-dialog=\"logoutDevice\" data-arg='{\"id\":\"${s.id}\"}'>Log out<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n      <div class=\"section-hd\">Recent security alerts<\u002Fdiv>\n      ${SEC_ALERTS.map((a,i)=>`<div class=\"row nodiv\" style=\"align-items:flex-start;cursor:default\">\n        <span class=\"r-ic\" style=\"margin-top:14px\">${ICON.shield}<\u002Fspan>\n        <span class=\"r-main\" style=\"border-bottom:1px solid var(--divider);gap:2px\">\n          <span style=\"font-size:13px;color:var(--ink1)\">${a.t}<\u002Fspan>\n          <span style=\"font-size:11px;color:var(--ink3)\">${a.when}<\u002Fspan>\n        <\u002Fspan>\n        ${i===0?`<a href=\"javascript:void(0)\" style=\"font-size:13px;font-weight:600;margin-top:14px\" data-dialog=\"secureAccount\">Not you?<\u002Fa>`:''}\n      <\u002Fdiv>`).join('')}\n      <div style=\"height:16px\"><\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n};\n\n/* ============================================================ S10 · BLOCKED USERS ============================================================ */\nconst BLOCKED=[\n  {id:'nirav',name:'Nirav Shah',role:'Broker',date:'12 Jan'},\n  {id:'kiran',name:'Kiran Patel',role:'Owner',date:'3 Jan'},\n];\nscreens.blocked={\n  render:()=>{\n    const st=document.documentElement.getAttribute('data-state');\n    if(st==='empty')return header('Blocked users')+`<div class=\"empty\"><div class=\"e-ic\">${ICON.shield.replace('width=\"24\" height=\"24\"','width=\"88\" height=\"88\"')}<\u002Fdiv><div class=\"e-t\">No blocked users<\u002Fdiv><div class=\"e-s\">People you block will appear here.<\u002Fdiv><\u002Fdiv>`;\n    return header('Blocked users')+`<div class=\"scroll\">\n      <div class=\"info-strip\">Blocked users can't message you. They can still see your public listings.<\u002Fdiv>\n      ${BLOCKED.map(u=>`<div class=\"row nodiv\" data-blockrow=\"${u.id}\" style=\"cursor:default\">\n        <span class=\"r-ic\" style=\"width:40px;height:40px;flex:0 0 40px\">${avatar(u.name.split(' ').map(w=>w[0]).join(''),40)}<\u002Fspan>\n        <span class=\"r-main\"><span class=\"r-label\" style=\"font-weight:600\">${u.name}<\u002Fspan><span class=\"r-sub\">${u.role} · Blocked on ${u.date}<\u002Fspan><\u002Fspan>\n        <span class=\"r-trail\"><button class=\"btn btn-outline btn-sm\" data-dialog=\"unblock\" data-arg='{\"id\":\"${u.id}\",\"name\":\"${u.name}\"}'>Unblock<\u002Fbutton><\u002Fspan>\n      <\u002Fdiv>`).join('')}\n    <\u002Fdiv>`;\n  }\n};\n\n\n/* ===== sheets.js ===== */\n/* ============================================================ SHEETS ============================================================ */\nfunction sheetHeader(title){return `<div class=\"sheet-hd\"><div class=\"sh-title\">${title}<\u002Fdiv><button class=\"iconbtn\" data-back>${ICON.x}<\u002Fbutton><\u002Fdiv>`;}\n\nsheets.newCollection={render:()=>`${sheetHeader('New collection')}<div class=\"sheet-pad\">\n  <label class=\"field-label\">Collection name<\u002Flabel>\n  <input class=\"field\" id=\"nc-input\" placeholder=\"e.g. Sea-facing flats\" autocomplete=\"off\">\n  <button class=\"btn btn-primary block\" style=\"margin-top:16px\" data-toast=\"Collection created\" data-closesheet=\"1\">Create<\u002Fbutton>\n<\u002Fdiv>`,onMount:(s)=>{setTimeout(()=>s.querySelector('#nc-input')?.focus(),320);}};\n\nsheets.savedMore={render:()=>`${sheetHeader('Saved')}<div style=\"padding-bottom:8px\">\n  <button class=\"action-row\" data-sheet=\"manageCollections\"><span class=\"ar-ic\">${ICON.list}<\u002Fspan>Manage collections<\u002Fbutton>\n  <div class=\"section-hd\" style=\"padding-top:12px\">Sort by<\u002Fdiv>\n  <button class=\"action-row\" data-toast=\"Sorted by recently saved\" data-closesheet=\"1\"><span class=\"ar-ic\">${ICON.clock}<\u002Fspan>Recently saved<\u002Fbutton>\n  <button class=\"action-row\" data-toast=\"Sorted by price\" data-closesheet=\"1\"><span class=\"ar-ic\">${ICON.card}<\u002Fspan>Price<\u002Fbutton>\n<\u002Fdiv>`};\n\nsheets.manageCollections={render:()=>`${sheetHeader('Manage collections')}<div style=\"padding-bottom:8px\">\n  ${COLLECTIONS.filter(c=>c.id!=='all').map(c=>`<div class=\"action-row\" style=\"justify-content:space-between\"><span style=\"display:flex;align-items:center;gap:14px\"><span class=\"ar-ic\">${ICON.bookmark}<\u002Fspan>${c.name}<\u002Fspan><span style=\"font-size:13px;color:var(--ink3)\">${c.count}<\u002Fspan><\u002Fdiv>`).join('')}\n  <button class=\"action-row\" data-sheet=\"newCollection\"><span class=\"ar-ic\">${ICON.plus}<\u002Fspan>New collection<\u002Fbutton>\n<\u002Fdiv>`};\n\nsheets.collectionManage={title:(d)=>d.name||'Collection',render:(d)=>`<div style=\"padding-bottom:8px\">\n  <button class=\"action-row\" data-toast=\"Rename collection\" data-closesheet=\"1\"><span class=\"ar-ic\">${ICON.edit}<\u002Fspan>Rename<\u002Fbutton>\n  <button class=\"action-row destructive\" data-dialog=\"deleteCollection\" data-arg='${JSON.stringify({name:d.name||'this collection'})}'><span class=\"ar-ic\">${ICON.trash}<\u002Fspan>Delete collection<\u002Fbutton>\n<\u002Fdiv>`};\n\nsheets.tileActions={render:()=>`${sheetHeader('Saved property')}<div style=\"padding-bottom:8px\">\n  <button class=\"action-row\" data-sheet=\"moveCollection\"><span class=\"ar-ic\">${ICON.box}<\u002Fspan>Move to collection<\u002Fbutton>\n  <button class=\"action-row destructive\" data-toast=\"Removed from saved\" data-closesheet=\"1\"><span class=\"ar-ic\">${ICON.bookmark}<\u002Fspan>Remove from saved<\u002Fbutton>\n  <button class=\"action-row\" data-sheet=\"shareProfile\"><span class=\"ar-ic\">${ICON.share2}<\u002Fspan>Share<\u002Fbutton>\n<\u002Fdiv>`};\n\nlet moveTarget='invest';\nsheets.moveCollection={render:()=>`${sheetHeader('Move to collection')}<div style=\"padding-bottom:8px\" id=\"move-list\">\n  ${COLLECTIONS.filter(c=>c.id!=='all').map(c=>`<button class=\"radio-row ${c.id===moveTarget?'sel':''}\" data-action=\"pickMove\" data-mid=\"${c.id}\"><span class=\"radiodot\"><\u002Fspan><span class=\"rr-main\"><span class=\"rr-l\">${c.name}<\u002Fspan><\u002Fspan><\u002Fbutton>`).join('')}\n  <button class=\"action-row\" data-sheet=\"newCollection\"><span class=\"ar-ic\">${ICON.plus}<\u002Fspan>New collection<\u002Fbutton>\n  <div class=\"sheet-pad\" style=\"padding-top:12px\"><button class=\"btn btn-primary block\" data-action=\"doMove\">Move<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>`};\nACTIONS.pickMove=(node)=>{moveTarget=node.dataset.mid;$$('#move-list .radio-row').forEach(r=>r.classList.toggle('sel',r.dataset.mid===moveTarget));};\nACTIONS.doMove=()=>{const c=COLLECTIONS.find(x=>x.id===moveTarget);history.back();setTimeout(()=>{history.back();toast('Moved to '+c.name);},60);};\n\nsheets.appearance={render:()=>{\n  const cur=window._appearance||'system';\n  return `${sheetHeader('Appearance')}<div style=\"padding-bottom:8px\">\n  ${[['light','Light'],['dark','Dark'],['system','System']].map(([v,l])=>`<button class=\"radio-row ${cur===v?'sel':''}\" data-action=\"pickAppearance\" data-v=\"${v}\"><span class=\"rr-main\"><span class=\"rr-l\">${l}<\u002Fspan><\u002Fspan><span class=\"rr-check\">${ICON.check}<\u002Fspan><\u002Fbutton>`).join('')}\n  <div class=\"info-strip\">Follows your device setting.<\u002Fdiv>\n<\u002Fdiv>`;}};\nACTIONS.pickAppearance=(node)=>{\n  const v=node.dataset.v;window._appearance=v;\n  document.documentElement.setAttribute('data-theme',v==='dark'?'dark':'light');\n  syncDevSeg();\n  $$('.radio-row[data-action=\"pickAppearance\"]').forEach(r=>r.classList.toggle('sel',r.dataset.v===v));\n};\n\nsheets.report={render:()=>`${sheetHeader('Report a problem')}<div class=\"sheet-pad\">\n  <label class=\"field-label\">Category<\u002Flabel>\n  <select class=\"field\" style=\"appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2220%22 height=%2220%22 fill=%22none%22 stroke=%22%238E8E8E%22 stroke-width=%221.5%22><path d=%22M5 8l5 5 5-5%22/><\u002Fsvg>');background-repeat:no-repeat;background-position:right 12px center\">\n    <option>Something isn't working<\u002Foption><option>A listing looks wrong<\u002Foption><option>Payment or billing issue<\u002Foption><option>Report a user<\u002Foption><option>Feature suggestion<\u002Foption><option>Other<\u002Foption>\n  <\u002Fselect>\n  <label class=\"field-label\" style=\"margin-top:16px\">Describe the problem<\u002Flabel>\n  <textarea class=\"field\" rows=\"4\" placeholder=\"Tell us what happened…\"><\u002Ftextarea>\n  <label class=\"field-label\" style=\"margin-top:16px\">Attach screenshot<\u002Flabel>\n  <button style=\"width:100%;height:88px;border:1px dashed var(--border);border-radius:8px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--s2)\" data-toast=\"Choose a screenshot\">${ICON.image}<span style=\"font-size:13px\">Add screenshot<\u002Fspan><\u002Fbutton>\n  <button class=\"btn btn-primary block\" style=\"margin-top:16px\" data-toast=\"Report sent — thanks!\" data-closesheet=\"1\">Send<\u002Fbutton>\n<\u002Fdiv>`};\n\nsheets.shareProfile={render:()=>{const id=identity();return `${sheetHeader('Share profile')}<div class=\"sheet-pad\">\n  <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;background:var(--s2);border:none\">\n    ${avatar(id.initials,44)}\n    <div><div style=\"font-size:15px;font-weight:600\">${id.name}<\u002Fdiv><div style=\"font-size:12px;color:var(--ink3)\">homzlist.com/${id.slug}<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <button class=\"btn btn-outline block\" style=\"margin-top:12px\" data-toast=\"Link copied\" data-closesheet=\"1\">${ICON.copy} Copy link<\u002Fbutton>\n  <div style=\"display:flex;gap:12px;margin-top:12px\">\n    <button class=\"btn btn-secondary block\" data-toast=\"Opening WhatsApp…\" data-closesheet=\"1\" style=\"gap:8px;color:#25D366\">${ICON.whatsapp} WhatsApp<\u002Fbutton>\n    <button class=\"btn btn-secondary block\" data-toast=\"More options…\" data-closesheet=\"1\">${ICON.share2} More<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>`;}};\n\nsheets.searchMore={render:()=>`${sheetHeader('Saved search')}<div style=\"padding-bottom:8px\">\n  <button class=\"action-row\" data-toast=\"Rename search\" data-closesheet=\"1\"><span class=\"ar-ic\">${ICON.edit}<\u002Fspan>Rename<\u002Fbutton>\n  <button class=\"action-row destructive\" data-toast=\"Search deleted\" data-closesheet=\"1\"><span class=\"ar-ic\">${ICON.trash}<\u002Fspan>Delete<\u002Fbutton>\n<\u002Fdiv>`};\n\nsheets.trashMore={render:()=>`${sheetHeader('Recently deleted')}<div style=\"padding-bottom:8px\">\n  <button class=\"action-row destructive\" data-dialog=\"emptyTrash\"><span class=\"ar-ic\">${ICON.trash}<\u002Fspan>Empty trash<\u002Fbutton>\n<\u002Fdiv>`};\n\nlet archFilterVal='All';\nsheets.archFilter={render:()=>`${sheetHeader('Filter')}<div style=\"padding-bottom:8px\">\n  ${['All','Sold','Rented','Hidden'].map(f=>`<button class=\"radio-row ${f===archFilterVal?'sel':''}\" data-action=\"pickArchFilter\" data-f=\"${f}\"><span class=\"rr-main\"><span class=\"rr-l\">${f}<\u002Fspan><\u002Fspan><span class=\"rr-check\">${ICON.check}<\u002Fspan><\u002Fbutton>`).join('')}\n<\u002Fdiv>`};\nACTIONS.pickArchFilter=(node)=>{archFilterVal=node.dataset.f;history.back();setTimeout(()=>toast('Filtered: '+archFilterVal),60);};\n\nsheets.quietHours={render:()=>{\n  const hrs=[];for(let h=0;h<24;h++){const ap=h<12?'AM':'PM';let hh=h%12;if(hh===0)hh=12;hrs.push(`${hh}:00 ${ap}`);}\n  const sel=(id,val)=>`<select class=\"field\" id=\"${id}\" style=\"appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2220%22 height=%2220%22 fill=%22none%22 stroke=%22%238E8E8E%22 stroke-width=%221.5%22><path d=%22M5 8l5 5 5-5%22/><\u002Fsvg>');background-repeat:no-repeat;background-position:right 12px center\">${hrs.map(h=>`<option ${h===val?'selected':''}>${h}<\u002Foption>`).join('')}<\u002Fselect>`;\n  return `${sheetHeader('Quiet hours')}<div class=\"sheet-pad\">\n    <div style=\"display:flex;gap:12px\">\n      <div style=\"flex:1\"><label class=\"field-label\">From<\u002Flabel>${sel('qh-from','11:00 PM')}<\u002Fdiv>\n      <div style=\"flex:1\"><label class=\"field-label\">To<\u002Flabel>${sel('qh-to','8:00 AM')}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"info-strip\">Non-urgent notifications are held during these hours.<\u002Fdiv>\n    <button class=\"btn btn-primary block\" style=\"margin-top:8px\" data-toast=\"Quiet hours saved\" data-closesheet=\"1\">Save<\u002Fbutton>\n  <\u002Fdiv>`;}};\n\nsheets.loginMore={render:()=>`${sheetHeader('Login activity')}<div style=\"padding-bottom:8px\">\n  <button class=\"action-row destructive\" data-dialog=\"logoutAll\"><span class=\"ar-ic\">${ICON.logout}<\u002Fspan>Log out of all devices<\u002Fbutton>\n<\u002Fdiv>`};\n\n/* ============================================================ DIALOGS ============================================================ */\ndialogs.logout=()=>({title:'Log out of HomzList?',actions:[\n  {label:'Cancel',kind:'btn-secondary'},\n  {label:'Log out',kind:'btn-error',onClick:()=>toast('Logged out')},\n]});\ndialogs.clearActivity=()=>({title:'Clear recently viewed?',body:\"This won't affect your saved properties.\",actions:[\n  {label:'Cancel',kind:'btn-secondary'},{label:'Clear',kind:'btn-error',onClick:()=>toast('Recently viewed cleared')},\n]});\ndialogs.restore=(d)=>({title:'Restore this listing?',body:'It will be re-reviewed before going live.',actions:[\n  {label:'Cancel',kind:'btn-secondary'},\n  {label:'Restore',kind:'btn-primary',onClick:()=>{fadeCard(d);toast('Listing restored — under review');}},\n]});\ndialogs.deleteNow=(d)=>({title:'Delete permanently?',body:\"This can't be undone.\",actions:[\n  {label:'Cancel',kind:'btn-secondary'},\n  {label:'Delete',kind:'btn-error',onClick:()=>{fadeCard(d);toast('Permanently deleted');}},\n]});\ndialogs.deleteCollection=(d)=>({title:'Delete this collection?',body:\"Saved properties won't be deleted.\",actions:[\n  {label:'Cancel',kind:'btn-secondary'},\n  {label:'Delete',kind:'btn-error',onClick:()=>{history.back();toast('Collection deleted');}},\n]});\ndialogs.logoutDevice=(d)=>({title:'Log out this device?',actions:[\n  {label:'Cancel',kind:'btn-secondary'},\n  {label:'Log out',kind:'btn-primary',onClick:()=>{const r=$(`[data-session=\"${d.id}\"]`);if(r){r.classList.add('fade-out');setTimeout(()=>r.remove(),260);}toast('Device logged out');}},\n]});\ndialogs.secureAccount=()=>({title:'Secure your account',body:\"Log out all devices and contact support if you didn't sign in.\",actions:[\n  {label:'Log out all',kind:'btn-error',onClick:()=>toast('Logged out of all devices')},\n  {label:'Contact support',kind:'btn-outline',onClick:()=>go('placeholder',{title:'Contact Support — P12'})},\n]});\ndialogs.logoutAll=()=>({title:'Log out of all devices?',body:\"You'll need to sign in again with your phone number on each device.\",actions:[\n  {label:'Cancel',kind:'btn-secondary'},{label:'Log out all',kind:'btn-error',onClick:()=>toast('Logged out of all devices')},\n]});\ndialogs.unblock=(d)=>({title:`Unblock ${d.name}?`,body:\"They'll be able to message you again.\",actions:[\n  {label:'Cancel',kind:'btn-secondary'},\n  {label:'Unblock',kind:'btn-primary',onClick:()=>{const r=$(`[data-blockrow=\"${d.id}\"]`);if(r){r.classList.add('fade-out');setTimeout(()=>r.remove(),260);}toast('User unblocked');}},\n]});\ndialogs.emptyTrash=()=>({title:'Empty trash?',body:\"All items will be permanently deleted. This can't be undone.\",actions:[\n  {label:'Cancel',kind:'btn-secondary'},{label:'Empty trash',kind:'btn-error',onClick:()=>{history.back();toast('Trash emptied')}},\n]});\n\nfunction fadeCard(d){\n  if(!d)return;\n  const sel=d.card==='trash'?`[data-trashcard=\"${d.i}\"]`:`.card [data-arg*='\"i\":${d.i}']`;\n  let node=d.card==='trash'?$(`[data-trashcard=\"${d.i}\"]`):null;\n  if(d.card==='arch'){const btn=$(`[data-arg='{\"card\":\"arch\",\"i\":${d.i}}']`);node=btn?btn.closest('.row,.tile'):null;}\n  if(node){node.classList.add('fade-out');setTimeout(()=>node.remove(),260);}\n}\n\n/* ============================================================ DEV OVERLAYS LIST ============================================================ */\n[['newCollection','New-collection sheet','sheet'],\n ['moveCollection','Move-to-collection sheet','sheet'],\n ['tileActions','Saved-tile actions sheet','sheet'],\n ['savedMore','Saved sort/manage sheet','sheet'],\n ['appearance','Appearance sheet','sheet'],\n ['report','Report a problem sheet','sheet'],\n ['shareProfile','Share profile sheet','sheet'],\n ['quietHours','Quiet hours sheet','sheet'],\n ['archFilter','Archived filter sheet','sheet'],\n ['logout','Log out dialog','dialog'],\n ['restore','Restore dialog','dialog',{card:'trash',i:0}],\n ['deleteNow','Delete permanently dialog','dialog',{card:'trash',i:0}],\n ['clearActivity','Clear activity dialog','dialog'],\n ['unblock','Unblock dialog','dialog',{id:'nirav',name:'Nirav Shah'}],\n ['secureAccount','Secure account dialog','dialog'],\n ['logoutAll','Log out all devices dialog','dialog'],\n ['emptyTrash','Empty trash dialog','dialog'],\n].forEach(([id,name,kind,data])=>DEV_OVERLAYS.push({id,name,kind,data}));\n\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
