document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"light\" data-viewport=\"mobile\" data-role=\"broker\" data-state=\"normal\"><head>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>HomzList<\u002Ftitle>\n<style>\n:root{\n  --page:#FFFFFF;--s1:#FFFFFF;--s2:#F5F5F5;--s3:#EFEFEF;--border:#DBDBDB;--divider:#EFEFEF;\n  --ink1:#111111;--ink2:#555555;--ink3:#8E8E8E;--inkDis:#C7C7C7;\n  --accent:#0F9D58;--accentP:#0C7C46;--accentSoft:#E6F4EC;--accentDis:#A8D5BD;\n  --error:#ED4956;--errorSoft:#FDECEE;--warning:#F5A623;--warningSoft:#FEF5E7;--info:#0095F6;--infoSoft:#E7F3FD;\n  --L1:0 1px 2px rgba(0,0,0,.06);--L2:0 4px 12px rgba(0,0,0,.10);--L3:0 8px 24px rgba(0,0,0,.16);\n}\nhtml[data-theme=\"dark\"]{\n  --page:#000000;--s1:#121212;--s2:#1E1E1E;--s3:#262626;--border:#363636;--divider:#262626;\n  --ink1:#F5F5F5;--ink2:#B0B0B0;--ink3:#8E8E8E;--inkDis:#4D4D4D;\n  --accent:#1DB868;--accentP:#159a54;--accentSoft:#0E2B1C;--accentDis:#2f5a44;\n  --error:#FF5C6A;--errorSoft:#2a1416;--warning:#FFB74D;--warningSoft:#2a2113;--info:#3BA7F8;--infoSoft:#0e2233;\n  --L1:0 0 0 1px var(--border);--L2:0 0 0 1px var(--border);--L3:0 0 0 1px var(--border);\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;padding:0;height:100%}\nbody{\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;\n  background:#FAFAFA;color:var(--ink1);\n  -webkit-font-smoothing:antialiased;overscroll-behavior:none;\n}\nhtml[data-theme=\"dark\"] body{background:#000}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}\ninput,textarea,select{font-family:inherit}\na{color:var(--accent);text-decoration:none}\na:hover{color:var(--accentP)}\n\n/* ---------- device frame ---------- */\n#frame{\n  position:relative;width:390px;max-width:100vw;height:100vh;height:100dvh;margin:0 auto;\n  background:var(--page);overflow:hidden;display:flex;flex-direction:column;\n}\n@media(min-width:768px){\n  body{padding:0}\n  #frame{width:470px;height:100vh;height:100dvh;border-left:1px solid var(--border);border-right:1px solid var(--border);}\n  html[data-theme=\"dark\"] #frame{border-color:var(--border)}\n}\nhtml[data-viewport=\"tablet\"] #frame{width:470px}\nhtml[data-viewport=\"desktop\"] #frame{width:470px}\n\n/* ---------- status bar ---------- */\n.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600;color:var(--ink1);background:var(--page)}\n.statusbar .sb-r{display:flex;gap:6px;align-items:center}\n\n/* ---------- app + screens ---------- */\n#app{flex:1 1 auto;position:relative;overflow:hidden;background:var(--page)}\n.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page);overflow:hidden}\n.screen[hidden]{display:none}\n.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}\n.scroll::-webkit-scrollbar{width:0}\n\n/* ---------- header ---------- */\n.hdr{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--page);border-bottom:1px solid var(--divider);position:relative;z-index:2}\n.hdr-title{font-size:17px;font-weight:600;color:var(--ink1);flex:1 1 auto;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.hdr-title.left{text-align:left;padding-left:4px}\n.iconbtn{width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--ink1);transition:transform .12s,background .12s}\n.iconbtn:active{transform:scale(.9);background:var(--s2)}\n.iconbtn.ghost{color:var(--ink1)}\n.hdr .spacer{flex:1 1 auto}\n\n/* ---------- brand wordmark ---------- */\n.wordmark{font-size:24px;font-weight:700;letter-spacing:-.5px}\n.wordmark .h{color:var(--ink1)}.wordmark .l{color:var(--accent)}\n\n/* ---------- buttons ---------- */\n.btn{height:44px;border-radius:8px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;transition:transform .12s,background .12s,opacity .12s;user-select:none}\n.btn:active{transform:scale(.98)}\n.btn.block{width:100%}\n.btn-primary{background:var(--accent);color:#fff}\n.btn-primary:active{background:var(--accentP)}\n.btn-primary[disabled]{background:var(--accentDis);pointer-events:none}\n.btn-secondary{background:var(--s2);color:var(--ink1)}\n.btn-outline{background:transparent;color:var(--ink1);border:1px solid var(--border)}\n.btn-error{background:var(--error);color:#fff}\n.btn-sm{height:32px;font-size:13px;font-weight:600;padding:0 14px;border-radius:8px}\n.btn-link{color:var(--accent);font-weight:600;font-size:15px;background:none;padding:0}\n.btn .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n\n/* ---------- list rows ---------- */\n.section-hd{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;padding:20px 16px 8px}\n.section-hd.row{display:flex;align-items:center;justify-content:space-between}\n.section-hd .seeall{font-size:13px;font-weight:600;color:var(--accent);text-transform:none;letter-spacing:0}\n.row{min-height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--s1);position:relative;transition:background .12s;cursor:pointer;text-align:left;width:100%}\n.row:active{background:var(--s2)}\n.row .r-ic{width:24px;height:24px;flex:0 0 24px;color:var(--ink2);display:flex;align-items:center;justify-content:center}\n.row .r-main{flex:1 1 auto;min-width:0;padding:12px 0;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--divider)}\n.row.nodiv .r-main{border-bottom:none}\n.row:last-child .r-main{border-bottom:none}\n.row .r-label{font-size:15px;color:var(--ink1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.row .r-sub{font-size:11px;color:var(--ink3);white-space:normal}\n.row .r-val{font-size:13px;color:var(--ink3);margin-left:auto;white-space:nowrap;padding:12px 0}\n.row .r-chev{color:var(--ink3);flex:0 0 auto;display:flex;padding:12px 0}\n.row.destructive .r-ic,.row.destructive .r-label{color:var(--error)}\n.row .r-trail{margin-left:auto;display:flex;align-items:center;gap:8px;padding:12px 0}\n\n/* ---------- toggle ---------- */\n.toggle{width:44px;height:26px;border-radius:999px;background:var(--s3);position:relative;flex:0 0 44px;transition:background .15s;cursor:pointer}\n.toggle::after{content:\"\";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}\n.toggle.on{background:var(--accent)}\n.toggle.on::after{transform:translateX(18px)}\n.toggle.disabled{opacity:.4;pointer-events:none}\n\n/* ---------- chips ---------- */\n.chips{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}\n.chips::-webkit-scrollbar{display:none}\n.chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--ink1);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;transition:transform .1s;user-select:none}\n.chip:active{transform:scale(.96)}\n.chip.sel{background:var(--ink1);color:var(--page)}\n.chip.dashed{background:transparent;border:1px dashed var(--border);color:var(--ink2)}\n.chip .cnt{opacity:.6;font-weight:400}\n.chip.sel .cnt{opacity:.8}\n\n/* ---------- badges & pills ---------- */\n.badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding:3px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px}\n.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}\n.b-accent{background:var(--accentSoft);color:var(--accent)}\n.b-error{background:var(--errorSoft);color:var(--error)}\n.b-warn{background:var(--warningSoft);color:var(--warning)}\n.b-neutral{background:var(--s2);color:var(--ink2)}\n.b-info{background:var(--infoSoft);color:var(--info)}\n\n/* ---------- info strip ---------- */\n.info-strip{margin:12px 16px;padding:10px 12px;background:var(--s2);border-radius:8px;font-size:11px;line-height:1.5;color:var(--ink3)}\n.info-strip.accent{background:var(--accentSoft);color:var(--ink1)}\n.alert-strip{margin:12px 16px;padding:12px;background:var(--accentSoft);border-radius:8px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink1)}\n.alert-strip .as-ic{color:var(--accent);flex:0 0 auto}\n.alert-strip .as-tx{flex:1 1 auto}\n.alert-strip a{font-weight:600;flex:0 0 auto}\n\n/* ---------- cards ---------- */\n.card{background:var(--s1);border-radius:12px;border:1px solid var(--border);padding:12px}\nhtml[data-theme=\"light\"] .card{box-shadow:var(--L1)}\n\n/* ---------- saved grid ---------- */\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}\n.tile{position:relative;aspect-ratio:1;background:var(--s3);overflow:hidden}\n.tile img{width:100%;height:100%;object-fit:cover;display:block}\n.tile .price-chip{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px}\n.tile .drop-chip{position:absolute;left:6px;top:6px;background:var(--accentSoft);color:var(--accent);font-size:11px;font-weight:600;padding:3px 7px;border-radius:4px;display:flex;align-items:center;gap:2px}\n.tile.sold::after{content:\"SOLD\";position:absolute;top:14px;right:-34px;width:120px;text-align:center;transform:rotate(45deg);background:var(--ink1);color:var(--page);font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 0}\n.tile.sold img{opacity:.55}\n\n/* ---------- overlays: sheets & dialogs ---------- */\n#overlays{position:absolute;inset:0;pointer-events:none;z-index:40}\n.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s;pointer-events:auto}\n.scrim.show{opacity:1}\nhtml[data-theme=\"dark\"] .scrim{background:rgba(0,0,0,.6)}\n\n.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s1);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,0,0,1);pointer-events:auto;max-height:88%;display:flex;flex-direction:column;box-shadow:var(--L3)}\nhtml[data-theme=\"dark\"] .sheet{border-top:1px solid var(--border)}\n.sheet.show{transform:translateY(0)}\n.sheet .grip{width:36px;height:4px;border-radius:999px;background:var(--border);margin:8px auto 4px;flex:0 0 auto}\n.sheet-hd{display:flex;align-items:center;padding:8px 8px 8px 16px}\n.sheet-hd .sh-title{font-size:17px;font-weight:600;flex:1 1 auto}\n.sheet-body{overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}\n.sheet-body::-webkit-scrollbar{width:0}\n.sheet .action-row{min-height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:15px;color:var(--ink1);width:100%;text-align:left;transition:background .12s}\n.sheet .action-row:active{background:var(--s2)}\n.sheet .action-row .ar-ic{width:24px;height:24px;color:var(--ink2);flex:0 0 24px;display:flex;align-items:center;justify-content:center}\n.sheet .action-row.destructive,.sheet .action-row.destructive .ar-ic{color:var(--error)}\n.sheet-pad{padding:0 16px 16px}\n\n.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);width:calc(100% - 64px);max-width:340px;background:var(--s1);border-radius:16px;padding:20px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:auto;box-shadow:var(--L3)}\nhtml[data-theme=\"dark\"] .dialog{border:1px solid var(--border)}\n.dialog.show{opacity:1;transform:translate(-50%,-50%) scale(1)}\n.dialog .dg-title{font-size:17px;font-weight:600;text-align:center;margin-bottom:6px}\n.dialog .dg-body{font-size:13px;color:var(--ink2);text-align:center;line-height:1.5;margin-bottom:20px}\n.dialog .dg-actions{display:flex;flex-direction:column;gap:8px}\n\n/* ---------- toast ---------- */\n#toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:60;display:flex;justify-content:center;pointer-events:none}\n.toast{background:var(--ink1);color:var(--page);font-size:13px;font-weight:500;padding:12px 18px;border-radius:8px;box-shadow:var(--L2);opacity:0;transform:translateY(12px);transition:opacity .2s,transform .2s;max-width:100%}\nhtml[data-theme=\"dark\"] .toast{border:1px solid var(--border)}\n.toast.show{opacity:1;transform:translateY(0)}\n\n/* ---------- offline banner ---------- */\n.offline-banner{background:var(--ink1);color:var(--page);font-size:12px;text-align:center;padding:6px;flex:0 0 auto;display:none;align-items:center;justify-content:center;gap:6px}\nhtml[data-state=\"offline\"] .offline-banner{display:flex}\n\n/* ---------- empty states ---------- */\n.empty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 40px;gap:8px}\n.empty .e-ic{color:var(--ink3);margin-bottom:8px}\n.empty .e-t{font-size:17px;font-weight:600;color:var(--ink1)}\n.empty .e-s{font-size:13px;color:var(--ink2);line-height:1.5;max-width:280px}\n.empty .btn{margin-top:12px}\n\n/* ---------- skeleton ---------- */\n.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 37%,var(--s2) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite}\n@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}\n.sk-line{height:12px;border-radius:4px;margin:6px 0}\n\n/* ---------- avatar ---------- */\n.avatar{border-radius:50%;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto;overflow:hidden}\n.avatar img{width:100%;height:100%;object-fit:cover}\n\n/* ---------- form ---------- */\n.field{width:100%;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--page);color:var(--ink1);font-size:15px;padding:0 12px}\n.field:focus{outline:none;border-color:var(--accent)}\ntextarea.field{height:auto;padding:12px;resize:none;line-height:1.5}\n.field-label{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:block}\n\n/* radio rows */\n.radio-row{min-height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;width:100%;text-align:left}\n.radio-row:active{background:var(--s2)}\n.radio-row .rr-main{flex:1 1 auto;padding:12px 0;border-bottom:1px solid var(--divider)}\n.radio-row:last-child .rr-main{border-bottom:none}\n.radio-row .rr-l{font-size:15px}\n.radio-row .rr-s{font-size:11px;color:var(--ink3)}\n.radio-row .rr-check{color:var(--accent);opacity:0;flex:0 0 auto}\n.radio-row.sel .rr-check{opacity:1}\n.radiodot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;position:relative}\n.radio-row.sel .radiodot{border-color:var(--accent)}\n.radio-row.sel .radiodot::after{content:\"\";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}\n\n/* ---------- dev toolbar ---------- */\n#dev{position:fixed;top:8px;right:8px;z-index:1000;font-size:12px}\n#dev .dev-toggle{width:32px;height:32px;border-radius:8px;background:rgba(60,60,60,.9);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}\n#dev .dev-panel{display:none;margin-top:6px;width:216px;background:#2b2b2b;color:#eee;border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-height:80vh;overflow-y:auto}\n#dev.open .dev-panel{display:block}\n#dev.open .dev-toggle{background:#111}\n#dev h4{margin:8px 0 4px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#999;font-weight:600}\n#dev h4:first-child{margin-top:0}\n#dev .seg{display:flex;gap:3px;flex-wrap:wrap}\n#dev .seg button{flex:1;min-width:0;padding:5px 4px;background:#3a3a3a;color:#ccc;border-radius:5px;font-size:11px}\n#dev .seg button.on{background:#0F9D58;color:#fff}\n#dev select{width:100%;background:#3a3a3a;color:#eee;border:none;border-radius:5px;padding:6px;font-size:12px;margin-top:2px}\n#dev .devlink{display:block;width:100%;text-align:left;padding:5px 6px;color:#ccc;border-radius:5px;font-size:11px}\n#dev .devlink:active{background:#3a3a3a}\n\n@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}\n\n/* fade util for row removal */\n.fade-out{opacity:0;transform:translateX(30px);transition:opacity .25s,transform .25s;pointer-events:none}\n.crossfade{animation:cf .3s ease-out}\n@keyframes cf{from{opacity:.2}to{opacity:1}}\n.scanline{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 12px 2px var(--accent);border-radius:2px;animation:scan 2.2s cubic-bezier(.4,0,.2,1) infinite}\n@keyframes scan{0%{top:2%;opacity:.4}50%{opacity:1}100%{top:98%;opacity:.4}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"frame\">\n  <div class=\"statusbar\">\n    <span>9:41<\u002Fspan>\n    <span class=\"sb-r\" id=\"sb-icons\"><\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"offline-banner\" id=\"off-banner\"><\u002Fdiv>\n  <div id=\"app\"><\u002Fdiv>\n  <div id=\"overlays\"><\u002Fdiv>\n  <div id=\"toast\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"dev\">\n  <button class=\"dev-toggle\" id=\"dev-toggle\" aria-label=\"Dev tools\"><\u002Fbutton>\n  <div class=\"dev-panel\">\n    <h4>Theme<\u002Fh4>\n    <div class=\"seg\" data-seg=\"theme\"><button data-v=\"light\">Light<\u002Fbutton><button data-v=\"dark\">Dark<\u002Fbutton><\u002Fdiv>\n    <h4>Viewport<\u002Fh4>\n    <div class=\"seg\" data-seg=\"viewport\"><button data-v=\"mobile\">Mobile<\u002Fbutton><button data-v=\"tablet\">Tablet<\u002Fbutton><button data-v=\"desktop\">Desktop<\u002Fbutton><\u002Fdiv>\n    <h4>Role<\u002Fh4>\n    <div class=\"seg\" data-seg=\"r  d=\"M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>',20),\n  user:I('<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1\"/>'),\n  share:I('<path d=\"M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7\"/><path d=\"M16 6l-4-4-4 4M12 2v14\"/>'),\n  share2:I('<circle cx=\"18\" cy=\"5\" r=\"3\"/><circle cx=\"6\" cy=\"12\" r=\"3\"/><circle cx=\"18\" cy=\"19\" r=\"3\"/><path d=\"M8.6 13.5l6.8 4M15.4 6.5l-6.8 4\"/>'),\n  camera:I('<path d=\"M14.5 4l1.5 2h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l1.5-2z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/>'),\n  image:I('<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/><path d=\"M21 15l-5-5L5 21\"/>'),\n  x:I('<path d=\"M18 6L6 18M6 6l12 12\"/>'),\n  search:I('<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M21 21l-4-4\"/>'),\n  check:I('<path d=\"M20 6L9 17l-5-5\"/>'),\n  checkSm:I('<path d=\"M20 6L9 17l-5-5\"/>',20),\n  phone:I('<path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z\"/>'),\n  filter:I('<path d=\"M4 5h16M7 12h10M10 19h4\"/>'),\n  grid:I('<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>'),\n  rows:I('<rect x=\"3\" y=\"4\" width=\"18\" height=\"6\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"18\" height=\"6\" rx=\"1\"/>'),\n  restore:I('<path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"/><path d=\"M3 3v5h5\"/>'),\n  mapPin:I('<path d=\"M12 21s7-5.5 7-11a7 7 0 0 0-14 0c0 5.5 7 11 7 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/>'),\n  wifiOff:I('<path d=\"M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 3.5-2.3M2 8.8a15 15 0 0 bel,kind,onClick,close}]})\n\n/* ---- realistic data ---- */\nconst IMG=(seed,w=400)=>(window.__resources&&window.__resources['img_'+seed])||`https://picsum.photos/seed/${seed}/${w}/${w}`;\n\n/* ============================================================ NAV ============================================================ */\nlet views=[]; // stack of {kind:'screen'|'sheet'|'dialog', id, data}\nlet mounted={screen:null};\n\nfunction currentScreen(){for(let i=views.length-1;i>=0;i--)if(views[i].kind==='screen')return views[i];return null;}\n\nfunction render(){\n  const app=$('#app');const ov=$('#overlays');\n  // screen\n  const sc=currentScreen();\n  if(sc){\n    if(mounted.screenId!==sc.id||mounted.stamp!==sc.stamp){\n      app.innerHTML='';\n      const def=screens[sc.id];\n      const node=el(`<div class=\"screen\" data-screen=\"${sc.id}\">${def.render(sc.data||{})}<\u002Fdiv>`);\n      app.appendChild(node);\n      mounted.screenId=sc.id;mounted.stamp=sc.stamp;\n      if(def.onMount)def.onMount(node,sc.data||{});\n      // focus scroll to top\n      const s=node.querySelector('.scroll');if(s)s.scrollTop=0;\n    }\n  }\n  // overlays: everything above last screen\n  let idx=views.length-1;while(idx>=0&&views[idx].kind==='screen')idx--; // last non-screen from top? need all above screen\n  const scIndex=views.lastIndexOf(sc);\n  const overs=views.slice(scIndex+1).filter(v=>v.kind!=='screen');\n  // rebuild overlays fresh each time (cheap)\n  ov.innerHTML='';\n  overs.forEach((v,i)=>{\n    if(v.kind==='sheet')buildSheet(ov,v);\n    else if(v.kind==='dialog')buildDialog(ov,v);\n  });\n  updateDevActive();\n}\n\nfunction buildSheet(ov,v){\n  const def=sheets[v.id];if(!def)return;\n  const scrim=el('<div class=\"scrim\"><\u002Fdiv>');\n  const sheet=el(`<div class=\"sheet\" data-sheetid=\"${v.id}\"><div class=\"grip\"><\u002Fdiv>${def.title?`<div class=\"sheet-hd\"><div class=\"sh-title\">${def.title(v.data||{})}<\u002Fdiv><button class=\"iconbtn\" data-back>${ICON.x}<\u002Fbutton><\u002Fdiv>`:''}<div class=\"sheet-body\">${def.render(v.data||{})}<\u002Fdiv><\u002Fdiv>`);\n  ov.appendChild(scrim);ov.appendChild(sheet);\n  requestAnimationFrame(()=>{scrim.classList.add('show');sheet.classList.add('show');});\n  scrim.addEventListener('click',()=>history.back());\n  if(def.onMount)def.onMount(sheet,v.data||{});\n  attachSwipe(sheet);\n}\nfunction buildDialog(ov,v){\n  const make=dialogs[v.id];if(!make)return;\n  const cfg=make(v.data||{});\n  const scrim=el('<div class=\"scrim\"><\u002Fdiv>');\n  const dg=el(`<div class=\"dialog\"><div class=\"dg-title\">${cfg.title}<\u002Fdiv>${cfg.body?`<div class=\"dg-body\">${cfg.body}<\u002Fdiv>`:''}<div class=\"dg-actions\"><\u002Fdiv><\u002Fdiv>`);\n  const acts=dg.querySelector('.dg-actions');\n  cfg.actions.forEach(a=>{\n    const b=el(`<button class=\"btn ${a.kind||'btn-secondary'} block\">${a.label}<\u002Fbutton>`);\n    b.addEventListener('click',()=>{if(a.onClick)a.onClick();if(a.close!==false)history.back();});\n    acts.appendChild(b);\n  });\n  ov.appendChild(scrim);ov.appendChild(dg);\n  requestAnimationFrame(()=>{scrim.classList.add('show');dg.classList.add('show');});\n  scrim.addEventListener('click',()=>history.back());\n}\n\n/* swipe-down to dismiss sheet */\nfunction attachSwipe(sheet){\n  let sy=0,dy=0,drag=false;\n  const grip=sheet;\n  sheet.addEventListener('touchstart',e=>{const body=sheet.querySelector('.sheet-body');if(body.scrollTop>0)return;sy=e.touches[0].clientY;drag=true;sheet.style.transition='none';},{passive:true});\n  sheet.addEventListener('touchmove',e=>{if(!drag)return;dy=e.touches[0].clientY-sy;if(dy<0)dy=0;sheet.style.transform=`translateY(${dy}px)`;},{passive:true});\n  sheet.addEventListener('touchend',()=>{if(!drag)return;drag=false;sheet.style.transition='';if(dy>90){history.back();}else{sheet.style.transform='';}dy=0;});\n}\n\n/* ---- navigation API ---- */\nfunction go(id,data){ // push a screen\n  views.push({kind:'screen',id,data,stamp:Math.random()});\n  history.pushState({d:views.length},'');\n  render();\n}\nfunction reset(id,data){ // replace whole stack (root)\n  views=[{kind:'screen',id,data,stamp:Math.random()}];\n  history.replaceState({d:1},'');\n  render();\n}\nfunction openSheet(id,data){views.push({kind:'sheet',id,data});history.pushState({d:views.length},'');render();}\nfunction openDialog(id,data){views.push({kind:'dialog',id,data});history.pushState({d:views.length},'');render();}\nfunction closeTop(){history.back();}\n\nwindow.addEventListener('popstate',()=>{\n  if(views.length>1){\n    const top=views[views.length-1];\n    if(top.kind!=='screen'){\n      // animate out then pop\n      const ov=$('#overlays');\n      $$('.sheet.show',ov).forEach(s=>{s.classList.remove('show');});\n      $$('.dialog.show',ov).forEach(s=>s.classList.remove('show'));\n      $$('.scrim.show',ov).forEach(s=>s.classList.remove('show'));\n      views.pop();\n      setTimeout(()=>render(),230);\n    }else{\n      views.pop();render();\n    }\n  }\n});\n\n/* ============================================================ TOAST ============================================================ */\nlet toastTimer;\nfunction toast(msg){\n  const c=$('#toast');c.innerHTML='';\n  const t=el(`<div class=\"toast\">${msg}<\u002Fdiv>`);c.appendChild(t);\n  requestAnimationFrame(()=>t.classList.add('show'));\n  clearTimeout(toastTimer);\n  toastTimer=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),220);},3000);\n}\n\n/* ============================================================ SHARED RENDER HELPERS ============================================================ */\nfunction header(title,{back=true,left=false,right=''}={}){\n  return `<div class=\"hdr\">\n    ${back?`<button class=\"iconbtn\" data-back>${ICON.back}<\u002Fbutton>`:'<div style=\"width:44px\"><\u002Fdiv>'}\n    <div class=\"hdr-title ${left?'left':''}\">${title}<\u002Fdiv>\n    ${right||'<div style=\"width:44px\"><\u002Fdiv>'}\n  <\u002Fdiv>`;\n}\nfunction iconBtn(icon,attrs=''){return `<button class=\"iconbtn\" ${attrs}>${icon}<\u002Fbutton>`;}\nfunction toggle(on,attrs=''){return `<div class=\"toggle ${on?'on':''}\" ${attrs}><\u002Fdiv>`;}\nfunction row({icon,label,sub,val,chev,trail,cls='',attrs=''}){\n  return `<button class=\"row ${cls}\" ${attrs}>\n    ${icon?`<span class=\"r-ic\">${icon}<\u002Fspan>`:''}\n    <span class=\"r-main\"><span class=\"r-label\">${label}<\u002Fspan>${sub?`<span class=\"r-sub\">${sub}<\u002Fspan>`:''}<\u002Fspan>\n    ${val?`<span class=\"r-val\">${val}<\u002Fspan>`:''}\n    ${trail?`<span class=\"r-trail\">${trail}<\u002Fspan>`:''}\n    ${chev?`<span class=\"r-chev\">${ICON.chevR}<\u002Fspan>`:''}\n  <\u002Fbutton>`;\n}\nfunction toggleRow(id,label,sub,on,{disabled=false,lock=false}={}){\n  return `<div class=\"row nodiv\" style=\"cursor:default\">\n    <span class=\"r-main\"><span class=\"r-label\" style=\"display:flex;align-items:center;gap:6px\">${label}${lock?`<span style=\"color:var(--ink3)\">${ICON.lock.replace('width=\"24\" height=\"24\"','width=\"14\" height=\"14\"')}<\u002Fspan>`:''}<\u002Fspan>${sub?`<span class=\"r-sub\">${sub}<\u002Fspan>`:''}<\u002Fspan>\n    <span class=\"r-trail\">${toggle(on,`data-toggle=\"${id}\" ${disabled?'':''}`).replace('toggle ',`toggle ${disabled?'disabled':''} `)}<\u002Fspan>\n  <\u002Fdiv>`;\n}\nfunction avatar(text,size=40,img){return `<div class=\"avatar\" style=\"width:${size}px;height:${size}px;font-size:${size*0.38}px\">${img?`<img src=\"${img}\" alt=\"\">`:text}<\u002Fdiv>`;}\nfunction skLine(w){return `<div class=\"sk sk-line\" style=\"width:${w}\"><\u002Fdiv>`;}\nfunction identity(){\n  const role=document.documentElement.getAttribute('data-role')||'broker';\n  const map={\n    owner:{name:'Ramesh Kotecha',initials:'RK',role:'Owner',slug:'rameshkotecha',rera:false,plan:'₹999 · 1 slot used'},\n    broker:{name:'RK Properties',initials:'RK',role:'Broker',slug:'rkproperties',rera:true,plan:'₹2,499 · 3 of 10 slots used'},\n    builder:{name:'Kotecha Developers',initials:'KD',role:'Builder',slug:'kotechadevelopers',rera:true,plan:'₹9,999 · 12 of 50 slots used'},\n  };\n  return map[role]||map.broker;\n}\n\n/* toggle state store */\nconst toggleState={};\ndocument.addEventListener('click',e=>{\n  const t=e.target.closest('.toggle:not(.disabled)');\n  if(t&&t.dataset.toggle){t.classList.toggle('on');toggleState[t.dataset.toggle]=t.classList.contains('on');return;}\n});\n\n/* ============================================================ GLOBAL DELEGATION ============================================================ */\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('[data-back]');if(b){history.back();return;}\n  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.arg?JSON.parse(g.dataset.arg):undefined);return;}\n  const sh=e.target.closest('[data-sheet]');if(sh){openSheet(sh.dataset.sheet,sh.dataset.arg?JSON.parse(sh.dataset.arg):undefined);return;}\n  const dg=e.target.closest('[data-dialog]');if(dg){openDialog(dg.dataset.dialog,dg.dataset.arg?JSON.parse(dg.dataset.arg):undefined);return;}\n  const ts=e.target.closest('[data-toast]');if(ts){toast(ts.dataset.toast);if(ts.dataset.closesheet)history.back();return;}\n  const ph=e.target.closest('[data-placeholder]');if(ph){go('placeholder',{title:ph.dataset.placeholder});return;}\n  const act=e.target.closest('[data-action]');if(act){handleAction(act.dataset.action,act,e);return;}\n});\nfunction handleAction(name,node,e){if(ACTIONS[name])ACTIONS[name](node,e);}\nconst ACTIONS={};\n\n/* ============================================================ DEV TOOLBAR ============================================================ */\nfunction setupDev(){\n  const dev=$('#dev');\n  $('#dev-toggle').innerHTML=ICON.wrench;\n  $('#dev-toggle').addEventListener('click',()=>dev.classList.toggle('open'));\n  $$('#dev .seg').forEach(seg=>{\n    const key=seg.dataset.seg;\n    seg.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;\n      document.documentElement.setAttribute('data-'+key,btn.dataset.v);\n      syncDevSeg();\n      if(key==='state'||key==='role')mounted.screenId=null,render();\n      if(key==='state')updateOffline();\n    });\n  });\n  // jump select\n  const jump=$('#dev-jump');\n  DEV_SCREENS.forEach(s=>{const o=el(`<option value=\"${s.id}\">${s.name}<\u002Foption>`);jump.appendChild(o);});\n  jump.addEventListener('change',()=>reset(jump.value,DEV_SCREENS.find(s=>s.id===jump.value).data));\n  // overlays list\n  const ol=$('#dev-overlays');\n  DEV_OVERLAYS.forEach(o=>{const b=el(`<button class=\"devlink\">${o.name}<\u002Fbutton>`);\n    b.addEventListener('click',()=>{if(o.kind==='sheet')openSheet(o.id,o.data);else openDialog(o.id,o.data);});\n    ol.appendChild(b);});\n  syncDevSeg();\n}\nfunction syncDevSeg(){\n  $$('#dev .seg').forEach(seg=>{const key=seg.dataset.seg;const v=document.documentElement.getAttribute('data-'+key);\n    $$('button',seg).forEach(b=>b.classList.toggle('on',b.dataset.v===v));});\n}\nfunction updateDevActive(){const sc=currentScreen();if(sc&&$('#dev-jump'))$('#dev-jump').value=sc.id;}\nfunction updateOffline(){$('#off-banner').innerHTML=`${ICON.wifiOff}<span>No internet connection<\u002Fspan>`;}\n\n/* status bar icons */\nfunction statusBar(){\n  $('#sb-icons').innerHTML=`${I('<path d=\"M2 20h.01M6 16h.01M6 20v-4M10 12v8M14 8v12M18 4v16\" stroke-width=\"2\"/>',16)}${I('<path d=\"M2 8a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01\" stroke-width=\"2\"/>',16)}<svg width=\"24\" height=\"14\" viewBox=\"0 0 24 14\" fill=\"none\"><rect x=\"1\" y=\"2\" width=\"19\" height=\"10\" rx=\"2.5\" stroke=\"currentColor\" stroke-width=\"1.2\"/><rect x=\"3\" y=\"4\" width=\"13\" height=\"6\" rx=\"1\" fill=\"currentColor\"/><rect x=\"21\" y=\"5\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/><\u002Fsvg>`;\n}\n\n/* ============================================================ BOOT ============================================================ */\nconst DEV_SCREENS=[\n  {id:'settings',name:'S6 · Settings Home'},\n  {id:'saved',name:'S1 · Saved / Collections'},\n  {id:'activity',name:'S2 · Your Activity'},\n  {id:'savedSearches',name:'S2b · Saved searches'},\n  {id:'qr',name:'S3 · QR & Share'},\n  {id:'trash',name:'S4 · Trash'},\n  {id:'archived',name:'S5 · Archived'},\n  {id:'notifications',name:'S7 · Notifications'},\n  {id:'language',name:'S8 · Language'},\n  {id:'login',name:'S9 · Login Activity'},\n  {id:'blocked',name:'S10 · Blocked Users'},\n  {id:'privacy',name:'S6b · Privacy'},\n];\nconst DEV_OVERLAYS=[];\n\nwindow.addEventListener('DOMContentLoaded',()=>{\n  statusBar();setupDev();updateOffline();\n  reset('settings');\n});\n\n\n/* ===== screens-a.js ===== */\n/* ============================================================ PLACEHOLDER (other batches) ============================================================ */\nscreens.placeholder={\n  render:(d)=>`${header(d.title||'Coming soon',{left:false})}\n  <div class=\"empty\">\n    <div class=\"e-ic\">${I('<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6v6H9z\"/>',72)}<\u002Fdiv>\n    <div class=\"e-t\">${d.title||'Coming soon'}<\u002Fdiv>\n    <div class=\"e-s\">This screen ships in a later batch. From here you can head back to where you were.<\u002Fdiv>\n    <button class=\"btn btn-outline\" data-back>Go back<\u002Fbutton>\n  <\u002Fdiv>`\n};\n\n/* ============================================================ S6 · SETTINGS HOME ============================================================ */\nscreens.settings={\n  render:()=>{\n    const st=document.documentElement.getAttribute('data-state');\n    if(st==='skeleton')return `${header('Settings')}<div class=\"scroll\">${settingsSkeleton()}<\u002Fdiv>`;\n    const role=(document.documentElement.getAttribute('data-role')||'broker');\n    const id=identity();\n    return `${header('Settings')}\n    <div class=\"scroll\">\n      <div style=\"padding:16px 16px 4px\">\n        <button class=\"row nodiv\" data-placeholder=\"Edit Profile — P9\" style=\"background:var(--s2);border-radius:12px;padding:12px;gap:12px;min-height:auto\">\n          <span class=\"r-ic\" style=\"width:48px;height:48px;flex:0 0 48px\">${avatar(id.initials,48)}<\u002Fspan>\n          <span class=\"r-main\" style=\"border:none;padding:0\">\n            <span class=\"r-label\" style=\"font-weight:600\">${id.name}<\u002Fspan>\n            <span class=\"r-sub\">+91 98250 12345 · ${id.role}<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"r-chev\" style=\"padding:0\">${ICON.chevR}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"section-hd\">Account<\u002Fdiv>\n      ${row({icon:ICON.user,label:'Edit profile',chev:true,attrs:'data-placeholder=\"Edit Profile — P9\"'})}\n      ${row({icon:ICON.phone,label:'Phone number',val:'+91 98250 12345',chev:true,attrs:'data-placeholder=\"Phone — P9\"'})}\n      ${row({icon:ICON.mail,label:'Email',val:'Not added',chev:true,attrs:'data-placeholder=\"Email — P9\"'})}\n      ${row({icon:ICON.mapPin,label:'City',val:'Rajkot',chev:true,attrs:'data-placeholder=\"City — P9\"'})}\n      ${row({icon:ICON.shieldCheck,label:'Verification',trail:`<span class=\"badge b-accent\">${id.rera?'ID ✓ · RERA ✓':'ID ✓'}<\u002Fspan>`,chev:true,attrs:'data-placeholder=\"Verification — P9\"'})}\n      ${row({icon:ICON.shield,label:'Account status',val:'Active',chev:true,attrs:'data-placeholder=\"Account status — P9\"'})}\n\n      <div class=\"section-hd\">Preferences<\u002Fdiv>\n      ${row({icon:ICON.bell,label:'Notifications',chev:true,attrs:'data-go=\"notifications\"'})}\n      ${row({icon:ICON.globe,label:'Language',val:'English',chev:true,attrs:'data-go=\"language\"'})}\n      ${row({icon:ICON.moon,label:'Appearance',val:'System',chev:true,attrs:'data-sheet=\"appearance\"'})}\n      ${row({icon:ICON.lock,label:'Privacy',chev:true,attrs:'data-go=\"privacy\"'})}\n\n      <div class=\"section-hd\">Your content<\u002Fdiv>\n      ${row({icon:ICON.bookmark,label:'Saved',val:'24',chev:true,attrs:'data-go=\"saved\"'})}\n      ${row({icon:ICON.clock,label:'Your activity',chev:true,attrs:'data-go=\"activity\"'})}\n      ${row({icon:ICON.file,label:'Drafts',trail:'<span class=\"badge b-neutral\">2<\u002Fspan>',chev:true,attrs:'data-placeholder=\"Drafts — P6\"'})}\n      ${row({icon:ICON.box,label:'Archived',chev:true,attrs:'data-go=\"archived\"'})}\n      ${row({icon:ICON.trash,label:'Recently deleted',chev:true,attrs:'data-go=\"trash\"'})}\n      ${row({icon:ICON.list,label:'My listings',chev:true,attrs:'data-placeholder=\"My Listings — P9\"'})}\n\n      <div class=\"section-hd\">Plans &amp; billing<\u002Fdiv>\n      ${row({icon:ICON.card,label:'My plan',val:id.plan,chev:true,attrs:'data-placeholder=\"My Plan — P11\"'})}\n      ${row({icon:ICON.receipt,label:'Payment history',chev:true,attrs:'data-placeholder=\"Payment History — P11\"'})}\n      ${row({icon:ICON.rocket,label:'Boosts',chev:true,attrs:'data-placeholder=\"Boosts — P11\"'})}\n\n      <div class=\"section-hd\">Security<\u002Fdiv>\n      ${row({icon:ICON.monitor,label:'Login activity',val:'3 devices',chev:true,attrs:'data-go=\"login\"'})}\n      ${row({icon:ICON.shieldOff,label:'Blocked users',val:'2',chev:true,attrs:'data-go=\"blocked\"'})}\n\n      <div class=\"section-hd\">Support<\u002Fdiv>\n      ${row({icon:ICON.help,label:'Help centre',chev:true,attrs:'data-placeholder=\"Help Centre — P12\"'})}\n      ${row({icon:ICON.headset,label:'Contact support',chev:true,attrs:'data-placeholder=\"Contact Support — P12\"'})}\n      ${row({icon:ICON.flag,label:'Report a problem',chev:true,attrs:'data-sheet=\"report\"'})}\n\n      <div class=\"section-hd\">About<\u002Fdiv>\n      ${row({icon:ICON.file,label:'Terms of Service',chev:true,attrs:'data-placeholder=\"Terms of Service — P12\"'})}\n      ${row({icon:ICON.file,label:'Privacy Policy',chev:true,attrs:'data-placeholder=\"Privacy Policy — P12\"'})}\n      ${row({icon:ICON.file,label:'Refund Policy',chev:true,attrs:'data-placeholder=\"Refund Policy — P12\"'})}\n      ${row({icon:ICON.user,label:'Grievance Officer',chev:true,attrs:'data-placeholder=\"Grievance Officer — P12\"'})}\n      ${row({icon:ICON.help,label:'About HomzList',chev:true,attrs:'data-placeholder=\"About HomzList — P12\"'})}\n      ${row({icon:ICON.download,label:'Download your data',chev:true,attrs:'data-placeholder=\"Download Your Data — P12\"'})}\n      ${row({icon:ICON.star,label:'Rate us on Google',trail:`<span style=\"color:var(--ink3)\">${ICON.extLink}<\u002Fspan>`,attrs:'data-toast=\"Opening Google Play…\"'})}\n\n      <div class=\"section-hd\">Danger zone<\u002Fdiv>\n      ${row({icon:ICON.logout,label:'Log out',cls:'destructive',attrs:'data-dialog=\"logout\"'})}\n      ${row({icon:ICON.shieldOff,label:'Deactivate account',cls:'destructive',attrs:'data-placeholder=\"Deactivate Account — P12\"'})}\n      ${row({icon:ICON.trash,label:'Delete account',cls:'destructive',attrs:'data-placeholder=\"Delete Account — P12\"'})}\n\n      <div style=\"text-align:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom))\">\n        <div class=\"wordmark\" style=\"font-size:18px\">Homz<span class=\"l\">List<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--ink3);margin-top:6px\">Version 1.0.2 (build 148)<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--ink3);margin-top:2px\">Made in Rajkot<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n};\nfunction settingsSkeleton(){\n  let g='<div style=\"padding:16px\"><div class=\"sk\" style=\"height:72px;border-radius:12px\"><\u002Fdiv><\u002Fdiv>';\n  for(let s=0;s<3;s++){g+=`<div style=\"padding:20px 16px 8px\">${skLine('40%')}<\u002Fdiv>`;\n    for(let i=0;i<4;i++)g+=`<div class=\"row nodiv\"><span class=\"r-ic\"><div class=\"sk\" style=\"width:24px;height:24px;border-radius:6px\"><\u002Fdiv><\u002Fspan><span class=\"r-main\">${skLine('60%')}<\u002Fspan><\u002Fdiv>`;}\n  return g;\n}\n\n/* ============================================================ S6b · PRIVACY (sub-screen) ============================================================ */\nscreens.privacy={\n  render:()=>`${header('Privacy')}\n    <div class=\"scroll\">\n      <div class=\"info-strip\">Control what other people can see about you on HomzList.<\u002Fdiv>\n      <div class=\"section-hd\">Visibility<\u002Fdiv>\n      ${toggleRow('pv_number','Show my number by default on new listings','You can change this per listing',false)}\n      ${toggleRow('pv_lastseen','Show last seen in chats','',true)}\n      ${toggleRow('pv_activity','Show activity status','',true)}\n      ${toggleRow('pv_findphone','Allow others to find me by phone number','',true)}\n      <div class=\"info-strip\" style=\"margin-top:20px\">Changing these settings won't affect listings you've already published.<\u002Fdiv>\n    <\u002Fdiv>`\n};\n\n\n/* ===== screens-b.js ===== */\n/* ============================================================ S1 · SAVED / COLLECTIONS ============================================================ */\nconst COLLECTIONS=[\n  {id:'all',name:'All',count:24},\n  {id:'parents',name:'For parents',count:6},\n  {id:'rentals',name:'Rentals',count:0},\n  {id:'invest',name:'Investment',count:9},\n  {id:'office',name:'Office',count:4},\n];\nconst SAVED_TILES=[\n  {seed:'rjk-mavdi1',price:'₹85 L',changed:false},\n  {seed:'rjk-kalavad',price:'₹1.2 Cr',drop:'↓ ₹5 L',changed:true},\n  {seed:'rjk-raiya',price:'₹62 L',changed:false},\n  {seed:'rjk-university',price:'₹95 L',sold:true,changed:true},\n  {seed:'rjk-ringroad',price:'₹1.05 Cr',changed:false},\n  {seed:'rjk-nanamava',price:'₹48 L',changed:false},\n  {seed:'rjk-kotecha',price:'₹72 L',drop:'↓ ₹3 L',changed:true},\n  {seed:'rjk-gondal',price:'₹38 L',changed:false},\n  {seed:'rjk-morbi',price:'₹55 L',changed:false},\n  {seed:'rjk-jamnagar',price:'₹68 L',changed:false},\n  {seed:'rjk-amin',price:'₹1.4 Cr',changed:false},\n  {seed:'rjk-astron',price:'₹79 L',changed:false},\n  {seed:'rjk-crystal',price:'₹52 L',changed:false},\n  {seed:'rjk-madhapar',price:'₹92 L',changed:false},\n  {seed:'rjk-vidyanagar',price:'₹44 L',changed:false},\n];\nlet savedFilterChanged=false;\n\nscreens.saved={\n  render:()=>{\n    const st=document.documentElement.getAttribute('data-state');\n    const rightBtns=`<button class=\"iconbtn\" data-sheet=\"newCollection\">${ICON.plus}<\u002Fbutton><button class=\"iconbtn\" data-sheet=\"savedMore\">${ICON.more}<\u002Fbutton>`;\n    const head=`<div class=\"hdr\"><button class=\"iconbtn\" data-back>${ICON.back}<\u002Fbutton><div class=\"hdr-title\">Saved<\u002Fdiv><div style=\"display:flex\">${rightBtns}<\u002Fdiv><\u002Fdiv>`;\n    if(st==='skeleton')return head+`<div class=\"chips\">${[80,120,110,90].map(w=>`<div class=\"sk\" style=\"width:${w}px;height:34px;border-radius:999px\"><\u002Fdiv>`).join('')}<\u002Fdiv><div class=\"grid3\">${Array(15).fill('<div class=\"tile sk\"><\u002Fdiv>').join('')}<\u002Fdiv>`;\n    if(st==='empty')return head+savedEmptyAll();\n    const chips=COLLECTIONS.map((c,i)=>`<button class=\"chip ${i===0?'sel':''}\" data-action=\"selectCollection\" data-cid=\"${c.id}\">${c.name} <span class=\"cnt\">${c.count}<\u002Fspan><\u002Fbutton>`).join('')+`<button class=\"chip dashed\" data-sheet=\"newCollection\">${ICON.plus.replace('width=\"24\" height=\"24\"','width=\"16\" height=\"16\"')} New<\u002Fbutton>`;\n    const tiles=SAVED_TILES.map((t,i)=>{\n      if(savedFilterChanged&&!t.changed)return '';\n      return `<div class=\"tile ${t.sold?'sold':''}\" data-action=\"tilePress\" data-i=\"${i}\">\n        <img src=\"${IMG(t.seed)}\" alt=\"\" loading=\"lazy\">\n        <span class=\"price-chip\">${t.price}<\u002Fspan>\n        ${t.drop?`<span class=\"drop-chip\">${t.drop}<\u002Fspan>`:''}\n      <\u002Fdiv>`;}).join('');\n    return head+`<div class=\"scroll\">\n      <div class=\"chips\">${chips}<\u002Fdiv>\n      <div class=\"alert-strip\" id=\"saved-alert\">\n        <span class=\"as-ic\">${ICON.bell}<\u002Fspan>\n        <span class=\"as-tx\">${savedFilterChanged?'Showing 3 changed properties':'3 saved properties changed'}<\u002Fspan>\n        <a href=\"javascript:void(0)\" data-action=\"${savedFilterChanged?'clearChangedFilter':'showChanged'}\">${savedFilterChanged?'Show all':'View'}<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"grid3\" id=\"saved-grid\">${tiles}<\u002Fdiv>\n      <div style=\"height:24px\"><\u002Fdiv>\n    <\u002Fdiv>`;\n  },\n  onMount:(root)=>{\n    attachLongPress(root,'.chip[data-cid]',(node)=>{const c=COLLECTIONS.find(x=>x.id===node.dataset.cid);if(c&&c.id!=='all')openSheet('collectionManage',{name:c.name});});\n    attachLongPress(root,'.tile[data-i]',(node)=>openSheet('tileActions',{}));\n  }\n};\nfunction savedEmptyAll(){return `<div class=\"empty\">\n  <div class=\"e-ic\">${ICON.bookmark.replace('width=\"24\" height=\"24\"','width=\"88\" height=\"88\"')}<\u002Fdiv>\n  <div class=\"e-t\">Nothing saved yet<\u002Fdiv>\n  <div class=\"e-s\">Tap the bookmark on any property to save it here.<\u002Fdiv>\n  <button class=\"btn btn-primary\" data-toast=\"Opening feed…\">Explore Properties<\u002Fbutton>\n<\u002Fdiv>`;}\nfunction savedEmptyCollection(){return `<div style=\"padding:56px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px\">\n  <div style=\"color:var(--ink3);margin-bottom:8px\">${ICON.box.replace('width=\"24\" height=\"24\"','width=\"72\" height=\"72\"')}<\u002Fdiv>\n  <div style=\"font-size:17px;font-weight:600;color:var(--ink1)\">This collection is empty<\u002Fdiv>\n  <div style=\"font-size:13px;color:var(--ink2);line-height:1.5;max-width:260px\">Move saved properties here to organise them.<\u002Fdiv>\n  <button class=\"btn btn-outline\" style=\"margin-top:12px\" data-action=\"selectCollectionAll\">Browse saved<\u002Fbutton>\n<\u002Fdiv>`;}\n\nACTIONS.selectCollection=(node)=>{\n  $$('.chip[data-cid]').forEach(c=>c.classList.remove('sel'));node.classList.add('sel');\n  const cid=node.dataset.cid;\n  const c=COLLECTIONS.find(x=>x.id===cid);\n  const grid=$('#saved-grid');const alert=$('#saved-alert');\n  savedFilterChanged=false;\n  grid.style.display='';\n  if(c.count===0){ // empty collection state\n    grid.style.display='block';\n    grid.classList.add('crossfade');\n    grid.innerHTML=savedEmptyCollection();\n    if(alert)alert.style.display='none';\n    return;\n  }\n  if(cid==='office'){ // demo a smaller collection\n    grid.innerHTML=SAVED_TILES.slice(0,4).map(t=>`<div class=\"tile\"><img src=\"${IMG(t.seed)}\" alt=\"\"><span class=\"price-chip\">${t.price}<\u002Fspan><\u002Fdiv>`).join('');\n    if(alert)alert.style.display='none';\n  }else if(cid==='all'){\n    grid.classList.add('crossfade');grid.innerHTML=SAVED_TILES.map((t,i)=>`<div class=\"tile ${t.sold?'sold':''}\" data-action=\"tilePress\" data-i=\"${i}\"><img src=\"${IMG(t.seed)}\" alt=\"\"><span class=\"price-chip\">${t.price}<\u002Fspan>${t.drop?`<span class=\"drop-chip\">${t.drop}<\u002Fspan>`:''}<\u002Fdiv>`).join('');\n    if(alert)alert.style.display='';\n  }else{\n    grid.classList.add('crossfade');grid.innerHTML=SAVED_TILES.slice(0,c.count).map(t=>`<div class=\"tile\"><img src=\"${IMG(t.seed)}\" alt=\"\"><span class=\"price-chip\">${t.price}<\u002Fspan><\u002Fdiv>`).join('');\n    if(alert)alert.style.display='none';\n  }\n  attachLongPress($('#app'),'.tile[data-i]',()=>openSheet('tileActions',{}));\n};\nACTIONS.showChanged=()=>{savedFilterChanged=true;mounted.screenId=null;render();};\nACTIONS.clearChangedFilter=()=>{savedFilterChanged=false;mounted.screenId=null;render();};\nACTIONS.selectCollectionAll=()=>{const all=$('.chip[data-cid=\"all\"]');if(all)ACTIONS.selectCollection(all);};\n\n/* long-press helper */\nfunction attachLongPress(root,sel,cb){\n  $$(sel,root).forEach(node=>{\n    let timer;\n    const start=(e)=>{timer=setTimeout(()=>{cb(node);},430);};\n    const cancel=()=>clearTimeout(timer);\n    node.addEventListener('touchstart',start,{passive:true});\n    node.addEventListener('touchend',cancel);node.addEventListener('touchmove',cancel);\n    node.addEventListener('mousedown',start);node.addEventListener('mouseup',cancel);node.addEventListener('mouseleave',cancel);\n    node.addEventListener('contextmenu',e=>{e.preventDefault();cb(node);});\n  });\n}\n\n/* ============================================================ S2 · YOUR ACTIVITY ============================================================ */\nconst RECENT=[\n  {seed:'rjk-mavdi1',price:'₹85 L',t:'3 BHK Mavdi',ago:'2h ago'},\n  {seed:'rjk-raiya',price:'₹62 L',t:'2 BHK Raiya Rd',ago:'5h ago'},\n  {seed:'rjk-kalavad',price:'₹1.2 Cr',t:'4 BHK Kalavad',ago:'Yesterday'},\n  {seed:'rjk-nanamava',price:'₹48 L',t:'2 BHK Nana Mava',ago:'2d ago'},\n  {seed:'rjk-madhapar',price:'₹92 L',t:'3 BHK Madhapar',ago:'3d ago'},\n];\nconst INQUIRIES=[\n  {seed:'rjk-mavdi1',t:'3 BHK Flat, Mavdi',status:'Accepted',cls:'b-accent',ago:'2h'},\n  {seed:'rjk-ringroad',t:'Shop, 150 Ft Ring Rd',status:'Pending',cls:'b-neutral',ago:'1d'},\n  {seed:'rjk-kotecha',t:'2 BHK, Kotecha Nagar',status:'Declined',cls:'b-error',ago:'3d'},\n];\nscreens.activity={\n  render:()=>{\n    const st=document.documentElement.getAttribute('data-state');\n    if(st==='empty')return header('Your activity')+`<div class=\"empty\">\n      <div class=\"e-ic\">${ICON.clock.replace('width=\"24\" height=\"24\"','width=\"88\" height=\"88\"')}<\u002Fdiv>\n      <div class=\"e-t\">No activity yet<\u002Fdiv>\n      <div class=\"e-s\">Properties you view and inquire about appear here.<\u002Fdiv><\u002Fdiv>`;\n    return header('Your activity')+`<div class=\"scroll\">\n      <div class=\"section-hd row\"><span>Recently viewed<\u002Fspan><a class=\"seeall\" data-placeholder=\"Recently Viewed\">See all<\u002Fa><\u002Fdiv>\n      <div class=\"chips\" style=\"padding-top:0\">\n        ${RECENT.map(r=>`<div style=\"flex:0 0 116px;cursor:pointer\" data-placeholder=\"Property\">\n          <div cla \u002Fdiv>`;\n  }\n};\n\n\n/* ===== screens-c.js ===== */\n/* ============================================================ S3 · QR & SHARE PROFILE ============================================================ */\nfunction qrMatrix(){\n  const n=25;const cells=[];\n  const finder=(r,c)=>{const rr=r-c;return false;};\n  // deterministic pseudo-random\n  let seed=1337;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return (seed>>16)&1;};\n  const isFinder=(r,c)=>{\n    const inBox=(br,bc)=>r>=br&&r<br+7&&c>=bc&&c<bc+7;\n    for(const [br,bc] of [[0,0],[0,n-7],[n-7,0]]){\n      if(inBox(br,bc)){\n        const lr=r-br,lc=c-bc;\n        if(lr===0||lr===6||lc===0||lc===6)return 1;\n        if(lr>=2&&lr<=4&&lc>=2&&lc<=4)return 1;\n        return 0;\n      }\n    }\n    return -1;\n  };\n  let html='';\n  for(let r=0;r<n;r++)for(let c=0;c<n;c++){\n    const f=isFinder(r,c);\n    const on=f===-1?rnd():f;\n    html+=`<i style=\"${on?'':'opacity:0'}\"><\u002Fi>`;\n  }\n  return {html,n};\n}\nlet qrColor='white';\nscreens.qr={\n  render:(d)=>{\n    const tab=d.tab||'code';\n    const rightBtn=`<button class=\"iconbtn\" data-sheet=\"shareProfile\">${ICON.share}<\u002Fbutton>`;\n    const head=`<div class=\"hdr\"><button class=\"iconbtn\" data-back>${ICON.back}<\u002Fbutton><div class=\"hdr-title\">Your QR code<\u002Fdiv>${tab==='code'?rightBtn:'<div style=\"width:44px\"><\u002Fdiv>'}<\u002Fdiv>`;\n    const tabs=`<div style=\"display:flex;padding:8px 16px 12px;gap:8px\">\n      <button class=\"btn ${tab==='code'?'btn-secondary':'btn-outline'} block btn-sm\" style=\"height:36px\" data-go=\"qr\" data-arg='{\"tab\":\"code\"}'>My code<\u002Fbutton>\n      <button class=\"btn ${tab==='scan'?'btn-secondary':'btn-outline'} block btn-sm\" style=\"height:36px\" data-go=\"qr\" data-arg='{\"tab\":\"scan\"}'>Scan code<\u002Fbutton>\n    <\u002Fdiv>`;\n    if(tab==='scan')return head+tabs+scanBody();\n    return head+tabs+qrBody();\n  },\n  onMount:(root)=>{}\n};\nfunction qrBody(){\n  const m=qrMatrix();\n  const id=identity();\n  const bg={white:'var(--s1)',accent:'var(--accent)',ink1:'var(--ink1)'}[qrColor];\n  const fg=qrColor==='white'?'var(--ink1)':'#fff';\n  const sub=qrColor==='white'?'var(--ink3)':'rgba(255,255,255,.75)';\n  return `<div class=\"scroll\" style=\"padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px\">\n    <div style=\"position:relative;width:100%;max-width:320px;margin-top:28px\">\n      <div class=\"avatar\" style=\"width:56px;height:56px;font-size:21px;position:absolute;top:-28px;left:50%;transform:translateX(-50%);z-index:2;border:3px solid var(--page)\">${id.initials}<\u002Fdiv>\n      <div style=\"background:${bg};border-radius:16px;padding:36px 24px 24px;box-shadow:var(--L2);text-align:center\" id=\"qr-card\">\n        <div style=\"background:#fff;border-radius:12px;padding:14px;display:inline-block;position:relative\">\n          <div style=\"display:grid;grid-template-columns:repeat(${m.n},1fr);width:180px;height:180px;gap:0\">\n            ${m.html}\n          <\u002Fdiv>\n          <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none\">\n            <div style=\"width:38px;height:38px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff\">\n              <span class=\"wordmark\" style=\"font-size:22px\"><span class=\"h\" style=\"color:var(--accent)\">H<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;color:${fg};margin-top:16px\">${id.name}<\u002Fdiv>\n        <div style=\"font-size:13px;color:${sub}\">${id.role} · Rajkot<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;justify-content:center;margin-top:8px\">\n          <span class=\"badge b-accent\">ID ✓<\u002Fspan>${id.rera?'<span class=\"badge b-accent\">RERA ✓<\u002Fsp
