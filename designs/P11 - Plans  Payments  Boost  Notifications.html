  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"light\" data-viewport=\"mobile\" data-role=\"owner\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n<title>HomzList — Plans &amp; Billing<\u002Ftitle>\n\n<style>\n:root{\n  --page:#FFFFFF; --s1:#FFFFFF; --s2:#F5F5F5; --s3:#EFEFEF; --border:#DBDBDB; --divider:#EFEFEF;\n  --ink1:#111111; --ink2:#555555; --ink3:#8E8E8E; --inkDis:#C7C7C7;\n  --accent:#0F9D58; --accentPressed:#0C7C46; --accentSoft:#E6F4EC; --accentDis:#A8D5BD;\n  --error:#ED4956; --errorSoft:#FDECEE; --warning:#F5A623; --warningSoft:#FEF5E7; --info:#0095F6; --infoSoft:#E7F3FD;\n  --l1:0 1px 2px rgba(0,0,0,.06); --l2:0 4px 12px rgba(0,0,0,.10); --l3:0 8px 24px rgba(0,0,0,.16);\n  --promoted:rgba(0,0,0,.6); --scrim:rgba(0,0,0,.40);\n  --ease:cubic-bezier(0.2,0,0,1);\n}\nhtml[data-theme=\"dark\"]{\n  --page:#000000; --s1:#121212; --s2:#1E1E1E; --s3:#262626; --border:#363636; --divider:#262626;\n  --ink1:#F5F5F5; --ink2:#B0B0B0; --ink3:#8E8E8E; --inkDis:#4D4D4D;\n  --accent:#1DB868; --accentPressed:#17A05A; --accentSoft:#0E2B1C; --accentDis:#2E5A42;\n  --error:#FF5C6A; --errorSoft:#2B1416; --warning:#FFB74D; --warningSoft:#2B2113; --info:#3BA7F8; --infoSoft:#0E2436;\n  --l1:0 0 0 1px var(--border); --l2:0 0 0 1px var(--border); --l3:0 0 0 1px var(--border);\n  --promoted:rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6);\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;\n  background:#FAFAFA; color:var(--ink1);\n  -webkit-font-smoothing:antialiased;\n}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}\ninput{font-family:inherit}\na{color:var(--accent);text-decoration:none}\n\n/* ---- Responsive frame ---- */\n#frame{\n  position:relative; margin:0 auto; background:var(--page); min-height:100vh;\n  width:100%; max-width:100%;\n  transition:max-width .3s var(--ease);\n}\n/* Viewport toggle drives frame width. On phones (<768px) it's naturally full-bleed;\n   on wider screens the same design is centered with #FAFAFA gutters + hairline borders. */\n@media(min-width:768px){\n  body{background:#FAFAFA}\n  html[data-theme=\"dark\"] body{background:#000}\n  #frame{\n    min-height:100vh;\n    border-left:1px solid var(--border); border-right:1px solid var(--border);\n  }\n  html[data-viewport=\"mobile\"] #frame{max-width:390px}\n  html[data-viewport=\"tablet\"] #frame{max-width:470px}\n  html[data-viewport=\"desktop\"] #frame{max-width:470px}\n}\n#viewport-tag{display:none}\n\n/* ---- Screens ---- */\n.screen{display:none;flex-direction:column;min-height:100vh;padding-bottom:96px}\n.screen.active{display:flex}\n\n/* ---- Top app bar ---- */\n.appbar{\n  position:sticky;top:0;z-index:40;background:var(--page);\n  display:flex;align-items:center;gap:4px;height:52px;padding:0 4px 0 4px;\n  border-bottom:1px solid var(--divider);\n}\n.appbar .title{font-size:17px;font-weight:600;flex:1;text-align:center;padding-right:0}\n.appbar .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px}\n.appbar .ib:active{background:var(--s2)}\n.appbar .ib.ghost{visibility:hidden}\n.brand{font-size:20px;font-weight:700;letter-spacing:-.4px}\n.brand b{color:var(--accent);font-weight:700}\n.brand span{color:var(--ink1)}\n\n/* ---- Body content ---- */\n.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px}\n.body.tight{gap:12px}\n.sec-label{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;margin:4px 0 -4px}\n\n/* ---- Card ---- */\n.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px}\nhtml[data-theme=\"light\"] .card{box-shadow:var(--l1)}\n\n/* ---- Buttons ---- */\n.btn{height:44px;border-radius:8px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;transition:transform .12s var(--ease),background .12s var(--ease);width:100%}\n.btn:active{transform:scale(.98)}\n.btn-primary{background:var(--accent);color:#fff}\n.btn-primary:active{background:var(--accentPressed)}\n.btn-primary:disabled{background:var(--accentDis);color:#fff}\n.btn-secondary{background:var(--s2);color:var(--ink1)}\n.btn-outline{background:transparent;color:var(--ink1);border:1px solid var(--border)}\n.btn-outline.accent{color:var(--accent);border-color:var(--accent)}\n.btn-error{background:var(--error);color:#fff}\n.btn-sm{height:36px;font-size:13px;padding:0 14px;width:auto}\n.btn-block{width:100%}\n.btn.loading{pointer-events:none;color:transparent!important;position:relative}\n.btn.loading::after{content:\"\";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}\n.btn-outline.loading::after{border-color:rgba(15,157,88,.3);border-top-color:var(--accent)}\n.tlink{color:var(--accent);font-weight:600;font-size:13px;background:none;padding:0;display:inline-flex;align-items:center;gap:4px}\n.tlink.err{color:var(--error)}\n@keyframes spin{to{transform:rotate(360deg)}}\n.minispin{width:14px;height:14px;border:2px solid var(--infoSoft);border-top-color:var(--info);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;flex:none}\n.cd-circ{stroke-dasharray:208;stroke-dashoffset:208;animation:cd-c .5s var(--ease) forwards}\n.cd-check{stroke-dasharray:60;stroke-dashoffset:60;animation:cd-p .4s var(--ease) .35s forwards}\n.hl-tx{border-radius:12px;box-shadow:0 0 0 2px var(--accent)}\n.hl-tx .card{border-color:transparent}\n@keyframes cd-c{to{stroke-dashoffset:0}}\n@keyframes cd-p{to{stroke-dashoffset:0}}\n@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}\n\n/* ---- Badges ---- */\n.badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;border-radius:4px;padding:3px 6px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}\n.b-active{background:var(--accentSoft);color:var(--accent)}\n.b-expired{background:var(--s3);color:var(--ink3)}\n.b-pending{background:var(--infoSoft);color:var(--info)}\n.b-failed{background:var(--errorSoft);color:var(--error)}\n.b-refunded{background:var(--s2);color:var(--ink2)}\n.b-promoted{background:var(--promoted);color:#fff}\n.b-trial{background:var(--infoSoft);color:var(--info)}\n.b-grace{background:var(--warningSoft);color:var(--warning)}\n.b-rejected{background:var(--errorSoft);color:var(--error)}\n.b-stopped{background:var(--s3);color:var(--ink3)}\n.micro{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;background:var(--accentSoft);color:var(--accent);border-radius:4px;padding:2px 6px}\n\n/* ---- Usage bar ---- */\n.usage{display:flex;flex-direction:column;gap:6px}\n.usage .row{display:flex;justify-content:space-between;align-items:baseline}\n.usage .lbl{font-size:13px;font-weight:600}\n.usage .val{font-size:13px;color:var(--ink3)}\n.track{height:6px;border-radius:999px;background:var(--s3);overflow:hidden}\n.fill{height:100%;background:var(--accent);border-radius:999px;width:0;transition:width .6s var(--ease)}\n.helper{font-size:11px;color:var(--ink3)}\n.helper a{font-weight:600}\n\n/* ---- Rows / list ---- */\n.hint{font-size:11px;color:var(--ink3);line-height:1.45}\n.meta{font-size:11px;color:var(--ink3)}\n.body-txt{font-size:15px;line-height:1.45}\n.divider{height:1px;background:var(--divider);margin:0}\n\n/* ---- Checklist ---- */\n.checklist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}\n.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}\n.checklist li svg{flex:none;margin-top:1px;color:var(--accent)}\n\n/* ---- Chips ---- */\n.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}\n.chips::-webkit-scrollbar{display:none}\n.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--ink2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}\n.chip.on{background:var(--ink1);color:var(--page)}\n.pill{display:inline-flex;align-items:center;background:var(--s2);color:var(--ink2);font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px}\n\n/* ---- Bottom nav ---- */\n.botnav{position:absolute;bottom:0;left:0;right:0;height:56px;background:var(--page);border-top:1px solid var(--divider);display:flex;z-index:30}\n.botnav button{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink1)}\n.botnav button.dim{color:var(--ink3)}\n\n/* ---- Sheet ---- */\n.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s var(--ease);z-index:60}\n.scrim.show{opacity:1;pointer-events:auto}\n.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:470px;background:var(--page);border-radius:12px 12px 0 0;z-index:70;transition:transform .3s var(--ease);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}\nhtml[data-theme=\"dark\"] .sheet{border:1px solid var(--border);border-bottom:none}\n.sheet.show{transform:translate(-50%,0)}\n.sheet.tall{height:90vh}\nhtml[data-viewport=\"mobile\"] .sheet{max-width:390px}\n.grab{width:36px;height:4px;border-radius:999px;background:var(--border);margin:8px auto 4px}\n.sheet-hd{display:flex;align-items:center;padding:8px 8px 8px 16px;gap:4px}\n.sheet-hd .st{font-size:17px;font-weight:600;flex:1}\n.sheet-body{padding:0 16px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}\n.sheet-list button.opt{width:100%;text-align:left;padding:15px 16px;font-size:15px;display:flex;align-items:center;gap:12px;border-radius:8px}\n.sheet-list button.opt:active{background:var(--s2)}\n.sheet-list button.opt.err{color:var(--error)}\n.sheet-list{padding:4px 8px 16px}\n\n/* ---- Dialog ---- */\n.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(340px,88vw);background:var(--page);border-radius:16px;z-index:80;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}\nhtml[data-theme=\"dark\"] .dialog{border:1px solid var(--border)}\n.dialog.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}\n.dialog h3{font-size:17px;font-weight:600;margin:0 0 8px}\n.dialog p{font-size:13px;color:var(--ink2);margin:0 0 20px;line-height:1.45}\n.dialog .actions{display:flex;gap:12px}\n\n/* ---- Toast ---- */\n.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--ink1);color:var(--page);font-size:13px;font-weight:500;padding:12px 18px;border-radius:8px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);max-width:88%;text-align:center}\nhtml[data-theme=\"dark\"] .toast{border:1px solid var(--border)}\n.toast.show{opacity:1;transform:translate(-50%,0)}\n\n/* ---- Banner ---- */\n.banner{border-radius:8px;padding:12px;display:flex;gap:10px;align-items:flex-start}\n.banner.info{background:var(--infoSoft)}\n.banner.warn{background:var(--warningSoft)}\n.banner.accent{background:var(--accentSoft)}\n.banner .bt{font-size:13px;font-weight:600}\n.banner .bs{font-size:11px;color:var(--ink2);line-height:1.4}\n.banner svg{flex:none;margin-top:1px}\n\n/* ---- Icon circles ---- */\n.icirc{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}\n.ic-accent{background:var(--accentSoft);color:var(--accent)}\n.ic-warn{background:var(--warningSoft);color:var(--warning)}\n.ic-err{background:var(--errorSoft);color:var(--error)}\n.ic-info{background:var(--infoSoft);color:var(--info)}\n.ic-neutral{background:var(--s2);color:var(--ink2)}\n\n/* ---- Avatar ---- */\n.avatar{width:40px;height:40px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff}\n.thumb{width:40px;height:40px;border-radius:8px;flex:none;object-fit:cover;background:var(--s3)}\n\n/* ---- Empty state ---- */\n.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 32px;gap:8px}\n.empty .art{color:var(--inkDis);margin-bottom:8px}\n.empty h3{font-size:17px;font-weight:600;margin:0}\n.empty p{font-size:13px;color:var(--ink2);margin:0 0 12px;line-height:1.45}\n\n/* ---- Skeleton ---- */\n.sk{background:var(--s2);border-radius:8px;position:relative;overflow:hidden}\n.sk::after{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shim 1.2s infinite}\nhtml[data-theme=\"dark\"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}\n@keyframes shim{100%{transform:translateX(100%)}}\n.sk-circ{border-radius:999px}\n\n/* ---- Offline banner ---- */\n.offline{background:var(--ink1);color:var(--page);font-size:12px;text-align:center;padding:8px;display:flex;align-items:center;justify-content:center;gap:8px}\n\n/* ---- Segmented tabs ---- */\n.tabs{display:flex;border-bottom:1px solid var(--divider);position:sticky;top:52px;background:var(--page);z-index:20}\n.tabs button{flex:1;height:44px;font-size:15px;font-weight:600;color:var(--ink3);position:relative}\n.tabs button.on{color:var(--ink1)}\n.tabs .ind{position:absolute;bottom:0;height:2px;background:var(--ink1);transition:left .2s var(--ease),width .2s var(--ease)}\n\n/* ---- Sticky footer CTA ---- */\n.sticky-cta{position:sticky;bottom:0;background:var(--page);border-top:1px solid var(--divider);padding:12px 16px;margin-top:auto;z-index:15}\n\n/* ---- Coupon ---- */\n.coupon-input{display:flex;gap:8px}\n.coupon-input input{flex:1;height:44px;border:1px solid var(--border);border-radius:8px;padding:0 14px;font-size:15px;background:var(--s1);color:var(--ink1);text-transform:uppercase}\n.field-row{background:var(--s2);border-radius:8px;min-height:48px;display:flex;align-items:center;gap:10px;padding:0 14px}\n\n/* ---- Notification row ---- */\n.nrow{position:relative;overflow:hidden}\n.nrow .inner{display:flex;gap:12px;padding:16px;align-items:flex-start;background:var(--page);position:relative;transition:transform .1s linear;will-change:transform}\n.nrow.unread .inner{background:var(--accentSoft)}\n.nrow.unread .inner::before{content:\"\";position:absolute;left:6px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:999px;background:var(--accent)}\n.nrow.unread .inner{padding-left:24px}\n.nrow .inner:active{background:var(--s2)}\n.nrow .ntext{flex:1;font-size:13px;line-height:1.45;color:var(--ink1)}\n.nrow .ntext b{font-weight:600}\n.nrow .ntime{font-size:11px;color:var(--ink3);margin-top:3px}\n.nrow .swipebg{position:absolute;inset:0;background:var(--error);display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:#fff}\n.inline-actions{display:flex;gap:8px;margin-top:10px}\n.inline-actions .btn{width:auto}\n.grp-hd{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;padding:16px 16px 8px;background:var(--page);position:sticky;top:52px;z-index:10}\n\n/* ---- Toggle ---- */\n.toggle{width:44px;height:26px;border-radius:999px;background:var(--s3);position:relative;transition:background .2s var(--ease);flex:none}\n.toggle.on{background:var(--accent)}\n.toggle::after{content:\"\";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:999px;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}\n.toggle.on::after{transform:translateX(18px)}\n\n/* ---- Radio ---- */\n.radio{width:22px;height:22px;border-radius:999px;border:2px solid var(--border);flex:none;position:relative}\n.radio.on{border-color:var(--accent)}\n.radio.on::after{content:\"\";position:absolute;inset:4px;border-radius:999px;background:var(--accent)}\n\n/* ---- Timeline ---- */\n.timeline{display:flex;flex-direction:column}\n.tl-item{display:flex;gap:12px}\n.tl-rail{display:flex;flex-direction:column;align-items:center;flex:none;width:12px}\n.tl-dot{width:10px;height:10px;border-radius:999px;background:var(--accent);margin-top:4px;flex:none}\n.tl-line{width:2px;flex:1;background:var(--divider);margin:4px 0}\n.tl-body{padding-bottom:16px;flex:1}\n.tl-body .tt{font-size:13px;font-weight:600}\n.tl-body .ts{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.5}\n\n/* ---- Comparison table ---- */\n.cmp{width:100%;border-collapse:collapse;font-size:13px}\n.cmp th,.cmp td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--divider)}\n.cmp th.feat,.cmp td.feat{text-align:left;position:sticky;left:0;background:var(--page);color:var(--ink2);font-weight:400;min-width:130px;z-index:2}\n.cmp thead th{font-weight:600;font-size:13px;position:sticky;top:0;background:var(--page);z-index:3}\n.cmp thead th.feat{z-index:4}\n.cmp .ck{color:var(--accent)}\n.cmp .dash{color:var(--ink3)}\n\n/* ---- Invoice ---- */\n.invoice{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;font-size:13px}\n.invoice .il{display:flex;justify-content:space-between;padding:4px 0}\n.invoice .il.total{font-size:17px;font-weight:600;padding-top:8px}\n\n/* ---- Mini listing card (boost picker) ---- */\n.pickrow{display:flex;gap:12px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}\n.pickrow::-webkit-scrollbar{display:none}\n.pick{flex:none;width:120px;border-radius:8px;overflow:hidden;border:1.5px solid var(--border);position:relative}\n.pick.on{border-color:var(--accent)}\n.pick.dim{opacity:.5}\n.pick .pimg{width:120px;height:120px;background:var(--s3);object-fit:cover;display:block}\n.pick .pmeta{padding:8px}\n.pick .chkbadge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:999px;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center}\n.pick.on .chkbadge{display:flex}\n.pick .lockbadge{position:absolute;top:6px;left:6px;background:var(--promoted);color:#fff;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px}\n\n/* dur cards */\n.dur-cards{display:flex;gap:12px}\n.dur{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:14px;position:relative}\n.dur.on{border-color:var(--accent)}\n.dur .drad{position:absolute;top:12px;right:12px}\n\n/* target rows */\n.trow{min-height:56px;display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--divider)}\n.trow:last-child{border-bottom:none}\n.trow .tmid{flex:1}\n\n/* generic list row */\n.lrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--divider)}\n.lrow:last-child{border-bottom:none}\n.lrow .lmid{flex:1;min-width:0}\n\n/* dev toolbar */\n#dev{position:fixed;top:8px;right:8px;z-index:200;font-size:11px}\n#dev .tgl{width:32px;height:32px;border-radius:8px;background:rgba(60,60,60,.92);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}\n#dev .panel{display:none;position:absolute;top:38px;right:0;width:260px;max-height:80vh;overflow-y:auto;background:#2a2a2a;color:#eee;border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}\n#dev.open .panel{display:block}\n#dev h4{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#999;margin:12px 0 5px;font-weight:600}\n#dev h4:first-child{margin-top:0}\n#dev .grp{display:flex;flex-wrap:wrap;gap:4px}\n#dev .grp button{background:#3a3a3a;color:#ccc;border-radius:5px;padding:5px 7px;font-size:10px;text-align:left}\n#dev .grp button.on{background:var(--accent);color:#fff}\n#dev .full{width:100%}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"frame\">\n  <div id=\ 1 14 0c0 4.7-7 11-7 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/>'),\n  building:IC('<rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"1\"/><path d=\"M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01\"/>'),\n  hourglass:IC('<path d=\"M6 3h12\"/><path d=\"M6 21h12\"/><path d=\"M6 3c0 5 6 5 6 9s-6 4-6 9\"/><path d=\"M18 3c0 5-6 5-6 9s6 4 6 9\"/>'),\n  shield:IC('<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/>'),\n  device:IC('<rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><path d=\"M12 18h.01\"/>'),\n  bulb:IC('<path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.7.8 1 1.5 1 2.5h6c0-1 .3-1.7 1-2.5A6 6 0 0 0 12 3z\"/>'),\n  chart:IC('<path d=\"M3 3v18h18\"/><path d=\"M7 15l3-4 3 2 4-6\"/>'),\n  users:IC('<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"/><path d=\"M16 5a3.5 3.5 0 0 1 0 6.5\"/><path d=\"M17.5 20a6.5 6.5 0 0 0-3-5.5\"/>'),\n  refund:IC('<path d=\"M3 12a9 9 0 1 0 3-6.7\"/><path d=\"M3 4v5h5\"/>'),\n  moon:IC('<path d=\"M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z\"/>',18),\n  sun:IC('<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4 12H2M22 12h-2M6 6 4.5 4.5M19.5 19.5 18 18M18 6l1.5-1.5M4.5 19.5 6 18\"/>',18),\n};\n\n/* ================= STATE ================= */\nconst S={\n  screen:'plans', role:'owner',\n  plan:'active999', payment:'success', boost:'active', view:'normal',\n  theme:'light', viewport:'mobile'\n};\nconst brand='<span class=\"brand\"><span>Homz<\u002Fspan><b>List<\u002Fb><\u002Fspan>';\n\n/* ================= HELPERS ================= */\nconst $=s=>document.querySelector(s);\nconst app=$('#app');\nfunction appbar(title,{back=true,right='',left=''}={}){\n  const l = left || (back?`<button class=\"ib\" onclick=\"goBack()\">${ICON.back}<\u002Fbutton>`:`<div class=\"ib ghost\"><\u002Fdiv>`);\n  return `<header class=\"appbar\">${l}<div class=\"title\">${title}<\u002Fdiv>${right||'<div class=\"ib ghost\"><\u002Fdiv>'}<\u002Fheader>`;\n}\nfunction usageBar(label,val,pct,helper,cls=''){\n  return `<div class=\"usage ${cls}\">\n    <div class=\"row\"><span class=\"lbl\">${label}<\u002Fspan><span class=\"val\">${val}<\u002Fspan><\u002Fdiv>\n    <div class=\"track\"><div class=\"fill\" data-pct=\"${pct}\"><\u002Fdiv><\u002Fdiv>\n    ${helper?`<div class=\"helper\">${helper}<\u002Fdiv>`:''}\n  <\u002Fdiv>`;\n}\nfunction badge(type,text){return `<span class=\"badge b-${type}\">${text}<\u002Fspan>`;}\nfunction offlineBanner(){return `<div class=\"offline\">${ICON.wifi.replace('24','16').replace('24','16')} You're offline — showing last saved data<\u002Fdiv>`;}\nfunction checkItem(t){return `<li>${ICON.check.replace(/width=\"24\" height=\"24\"/,'width=\"18\" height=\"18\"')}<span>${t}<\u002Fspan><\u002Fli>`;}\n\n/* ================= NAV ENGINE ================= */\nlet navStack=['plans'];\nfunction go(screen,push=true){\n  S.screen=screen;\n  if(push){navStack.push(screen);history.pushState({screen},'','#'+screen);}\n  render();\n  const b=app.querySelector('.body,.sheet-body'); if(b)b.scrollTop=0;\n  window.scrollTo(0,0);\n}\nfunction goBack(){ if(navStack.length>1){history.back();} }\nwindow.addEventListener('popstate',e=>{\n  if(anySheetOpen()){closeSheet();return;}\n  if(navStack.length>1){navStack.pop();S.screen=navStack[navStack.length-1];render();}\n});\n\n/* ================= RENDER ================= */\nconst SCREENS={};\nfunction render(){\n  document.documentElement.dataset.theme=S.theme;\n  document.documentElement.dataset.viewport=S.viewport;\n  document.documentElement.dataset.role=S.role;\n  const fn=SCREENS[S.screen]||SCREENS.plans;\n  app.innerHTML=`<section class=\"screen active\">${fn()}<\u002Fsection>`;\n  // bottom nav only on notifications & placeholders\n  const nav=$('#botnav');\n  if(S.screen==='notif'||S.screen==='placeholder'){nav.style.display='flex';renderNav();}\n  else nav.style.display='none';\n  // animate usage bars\n  requestAnimationFrame(()=>{setTimeout(()=>{app.querySelectorAll('.fill[data-pct]').forEach(f=>f.style.width=f.dataset.pct+'%');},60);});\n  // position tab indicator\n  const tabs=app.querySelector('.tabs');\n  if(tabs){const on=tabs.querySelector('button.on');const ind=tabs.querySelector('.ind');\n    if(on&&ind){ind.style.width=on.offsetWidth+'px';ind.style.left=on.offsetLeft+'px';}}\n  buildDev();\n}\nfunction renderNav(){\n  const items=[['home',ICON.home],['search',ICON.search],['req',ICON.file],['msg',ICON.chat],['profile',ICON.user]];\n  $('#botnav').innerHTML=items.map(([k,ic])=>`<button class=\"dim\" onclick=\"toast('${k[0].toUpperCase()+k.slice(1)} — other batch')\">${ic}<\u002Fbutton>`).join('');\n}\nfunction placeholder(label){\n  SCREENS.placeholder=()=>appbar(label)+`<div class=\"empty\" style=\"padding-bottom:120px\"><div class=\"art\">${ICON.bolt}<\u002Fdiv><h3>${label}<\u002Fh3><p>This screen lives in another batch. This is a placeholder in the Plans & Billing module.<\u002Fp><button class=\"btn btn-outline accent\" style=\"width:auto\" onclick=\"goBack()\">Go back<\u002Fbutton><\u002Fdiv>`;\n  go('placeholder');\n}\n\n/* ================= SHEETS / DIALOGS / TOAST ================= */\nlet sheetEl=null,dialogEl=null;\nconst scrim=$('#scrim');\nscrim.addEventListener('click',()=>{closeSheet();closeDialog();});\nfunction anySheetOpen(){return !!sheetEl||!!dialogEl;}\nfunction openSheet(inner,{tall=false}={}){\n  closeSheet();\n  const el=document.createElement('div');\n  el.className='sheet'+(tall?' tall':'');\n  el.innerHTML=inner;\n  document.body.appendChild(el);\n  sheetEl=el;\n  scrim.classList.add('show');\n  requestAnimationFrame(()=>{el.classList.add('show');\n    el.querySelectorAll('.fill[data-pct]').forEach(f=>setTimeout(()=>f.style.width=f.dataset.pct+'%',200));\n  });\n  enableSwipeDown(el);\n  history.pushState({sheet:true},'','');\n}\nfunction closeSheet(){\n  if(!sheetEl)return;\n  const el=sheetEl;sheetEl=null;\n  el.classList.remove('show');\n  if(!dialogEl)scrim.classList.remove('show');\n  setTimeout(()=>el.remove(),300);\n}\nfunction sheetHead(title,{grab=true}={}){\n  return `${grab?'<div class=\"grab\"><\u002Fdiv>':''}<div class=\"sheet-hd\"><div class=\"st\">${title}<\u002Fdiv><button class=\"ib\" onclick=\"closeSheet()\">${ICON.x}<\u002Fbutton><\u002Fdiv>`;\n}\nfunction optSheet(title,opts){\n  // opts: [{label,icon,onclick,err}]\n  openSheet(sheetHead(title)+`<div class=\"sheet-list\">${opts.map(o=>`<button class=\"opt ${o.err?'err':''}\" onclick=\"closeSheet();${o.onclick||''}\">${o.icon||''}<span>${o.label}<\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv>`);\n}\nfunction openDialog(title,body,actions){\n  closeDialog();\n  const el=document.createElement('div');\n  el.className='dialog';\n  el.innerHTML=`<h3>${title}<\u002Fh3><p>${body}<\u002Fp><div class=\"actions\">${actions}<\u002Fdiv>`;\n  document.body.appendChild(el);\n  dialogEl=el;scrim.classList.add('show');\n  requestAnimationFrame(()=>el.classList.add('show'));\n}\nfunction closeDialog(){\n  if(!dialogEl)return;const el=dialogEl;dialogEl=null;\n  el.classList.remove('show');\n  if(!sheetEl)scrim.classList.remove('show');\n  setTimeout(()=>el.remove(),200);\n}\nlet toastT;\nfunction toast(msg){\n  const t=$('#toast');t.textContent=msg;t.classList.add('show');\n  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);\n}\nfunction enableSwipeDown(el){\n  const handle=el;let sy=0,dy=0,drag=false;\n  const start=e=>{const y=e.touches?e.touches[0].clientY:e.clientY;\n    const body=el.querySelector('.sheet-body');\n    if(body&&body.scrollTop>0&&e.target.closest('.sheet-body'))return;\n    sy=y;drag=true;el.style.transition='none';};\n  const move=e=>{if(!drag)return;const y=e.touches?e.touches[0].clientY:e.clientY;dy=Math.max(0,y-sy);if(dy>0){el.style.transform=`translate(-50%,${dy}px)`;}};\n  const end=()=>{if(!drag)return;drag=false;el.style.transition='';if(dy>120){history.back();}else{el.style.transform='';}dy=0;};\n  handle.addEventListener('touchstart',start,{passive:true});\n  handle.addEventListener('touchmove',move,{passive:true});\n  handle.addEventListener('touchend',end);\n}\n<\u002Fscript>\n<script>\n/* ================= S1 PLANS & PRICING ================= */\nfunction planActive(){return ['active999','active2999','active9999','multiple','grace'].includes(S.plan);}\nfunction skelBlock(){\n  return `<div class=\"body\"><div class=\"sk\" style=\"height:60px\"><\u002Fdiv><div class=\"sk\" style=\"height:220px\"><\u002Fdiv><div class=\"sk\" style=\"height:220px\"><\u002Fdiv><\u002Fdiv>`;\n}\nSCREENS.plans=function(){\n  const right=`<button class=\"ib\" onclick=\"plansMenu()\">${ICON.dots}<\u002Fbutton>`;\n  if(S.view==='skeleton')return appbar('Plans',{right})+skelBlock();\n  const off = S.view==='offline'?offlineBanner():'';\n\n  const trial = S.plan==='trial'?`<div class=\"banner info\">${ICON.gift}<div><div class=\"bt\">You have a trial from HomzList<\u002Fdiv><div class=\"bs\">1 listing + 1 requirement · 14 days left<\u002Fdiv><\u002Fdiv><button class=\"tlink\" style=\"margin-left:auto;align-self:center\" onclick=\"go('myplan')\">View<\u002Fbutton><\u002Fdiv>`:'';\n\n  const strip = planActive()?`<div class=\"banner accent\"><span style=\"color:var(--accent)\">${ICON.checkCircle.replace(/width=\"24\" height=\"24\"/,'width=\"20\" height=\"20\"')}<\u002Fspan><div style=\"flex:1\"><span style=\"font-size:13px;color:var(--accent);font-weight:600\">You have an active ${activePlanName()} plan<\u002Fspan><\u002Fdiv><button class=\"tlink\" onclick=\"go('myplan')\">View details<\u002Fbutton><\u002Fdiv>`:'';\n\n  // Role-aware recommendation banner\n  const roleMeta={\n    owner:{label:'Owner',rec:'999',line:'List your property once — it stays live forever.'},\n    broker:{label:'Broker',rec:'2999',line:'Unlock every requirement and win more deals.'},\n    builder:{label:'Builder',rec:'9999',line:'Showcase your project with unlimited unit types.'},\n  }[S.role];\n  const roleBanner=`<div class=\"banner info\"><span style=\"c  chips=[['all','All 24'],['unread','Unread 6'],['inquiry','Inquiries'],['listing','Listings'],['requirement','Requirements'],['payment','Payments']];\n  const chipBar=`<div style=\"padding:12px 16px 8px\"><div class=\"chips\">${chips.map(c=>`<button class=\"chip ${notifFilter===c[0]?'on':''}\" onclick=\"notifFilter='${c[0]}';render()\">${c[1]}<\u002Fbutton>`).join('')}<\u002Fdiv><\u002Fdiv>`;\n\n  const banner=S.view==='offline'?offlineBanner():(window.notifBlocked?`<div class=\"banner warn\" style=\"border-radius:0\"><span style=\"color:var(--warning)\">${ICON.warn.replace(/width=\"24\" height=\"24\"/,'width=\"20\" height=\"20\"')}<\u002Fspan><div class=\"bs\" style=\"flex:1;align-self:center\">Browser notifications are blocked — you'll miss instant alerts<\u002Fdiv><a style=\"align-self:center;font-weight:600\" onclick=\"toast('Enable in browser settings')\">How to enable<\u002Fa><\u002Fdiv>`:'');\n\n  const groups=[['today','Today'],['week','This week'],['earlier','Earlier']];\n  let list='';\n  groups.forEach(([gk,gl])=>{\n    const rows=data.filter(n=>n.g===gk);\n    if(!rows.length)return;\n    list+=`<div class=\"grp-hd\">${gl}<\u002Fdiv>`;\n    list+=rows.map(n=>notifRow(n)).join('');\n  });\n\n  return appbar('Notifications',{right})+banner+chipBar+`<div style=\"padding-bottom:24px\">${list||'<div class=\"empty\" style=\"padding:40px 24px\"><p>Nothing here for this filter<\u002Fp><\u002Fdiv>'}<\u002Fdiv>`;\n};\nfunction notifRow(n){\n  const idAttr=n.id?`id=\"${n.id}\"`:'';\n  return `<div class=\"nrow ${n.un?'unread':''}\" ${idAttr}>\n    <div class=\"swipebg\">${ICON.x}<\u002Fdiv>\n    <div class=\"inner\" ${n.tap?`onclick=\"${n.tap}\"`:''}>\n      ${n.lead}\n      <div class=\"ntext\">${n.t}<div class=\"ntime\">${n.time}<\u002Fdiv>${n.actions?`<div class=\"inline-actions\">${n.actions}<\u002Fdiv>`:''}<\u002Fdiv>\n      ${n.thumb?nThumb():''}\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction allowNum(id){\n  const row=document.getElementById(id);if(!row)return;\n  row.querySelector('.ntext').innerHTML=`You shared your number with <b>Meet Patel<\u002Fb> <span style=\"color:var(--accent)\">✓<\u002Fspan><div class=\"ntime\">Just now<\u002Fdiv>`;\n  row.classList.remove('unread');row.querySelector('.inner').classList.remove('unread');\n  toast('Number shared');\n}\nfunction dismissNum(id){collapseRow(document.getElementById(id));}\nfunction dismissAvail(id,which,msg){collapseRow(document.getElementById(id));toast(msg);}\nfunction collapseRow(row){if(!row)return;row.style.transition='opacity .2s,max-height .25s,margin .25s';row.style.maxHeight=row.offsetHeight+'px';requestAnimationFrame(()=>{row.style.opacity='0';row.style.maxHeight='0';row.style.overflow='hidden';});setTimeout(()=>row.remove(),260);}\nfunction notifMenu(){\n  optSheet('Notifications',[\n    {label:'Mark all as read',icon:ICON.checkCircle.replace(/width=\"24\" height=\"24\"/,'width=\"20\" height=\"20\"'),onclick:\"markAllRead()\"},\n    {label:'Notification settings',icon:ICON.bell.replace(/width=\"24\" height=\"24\"/,'width=\"20\" height=\"20\"'),onclick:\"toast('Settings — other batch')\"},\n    {label:'Clear all',icon:ICON.x,err:1,onclick:\"clearAllNotif()\"},\n  ]);\n}\nfunction markAllRead(){document.querySelectorAll('.nrow.unread').forEach(r=>r.classList.remove('unread'));toast('All marked as read');}\nfunction clearAllNotif(){\n  openDialog('Clear all notifications?','This removes every notification. This can\\'t be undone.',\n    `<button class=\"btn btn-outline\" onclick=\"closeDialog()\">Cancel<\u002Fbutton><button class=\"btn btn-error\" onclick=\"closeDialog();document.querySelectorAll('.nrow').forEach(collapseRow)\">Clear all<\u002Fbutton>`);\n}\n/* swipe to dismiss */\ndocument.addEventListener('touchstart',e=>{\n  const inner=e.target.closest('.nrow .inner');if(!inner)return;\n  if(e.target.closest('.inline-actions')||e.target.closest('button'))return;\n  inner._sx=e.touches[0].clientX;inner._dx=0;inner._drag=true;inner.style.transition='none';\n},{passive:true});\ndocument.addEventListener('touchmove',e=>{\n  const inner=e.target.closest('.nrow .inner');if(!inner||!inner._drag)return;\n  inner._dx=Math.min(0,e.touches[0].clientX-inner._sx);\n  inner.style.transform=`translateX(${inner._dx}px)`;\n},{passive:true});\ndocument.addEventListener('touchend',e=>{\n  const inner=e.target.closest('.nrow .inner');if(!inner||!inner._drag)return;\n  inner._drag=false;inner.style.transition='';\n  if(inner._dx<-90){inner.style.transform='translateX(-100%)';setTimeout(()=>collapseRow(inner.closest('.nrow')),150);}\n  else inner.style.transform='';\n});\n\n/* ================= DEV TOOLBAR ================= */\n$('#devtgl').addEventListener('click',()=>$('#dev').classList.toggle('open'));\nfunction seg(label,key,opts){\n  return `<h4>${label}<\u002Fh4><div class=\"grp\">`+opts.map(([v,t])=>`<button class=\"${S[key]===v?'on':''}\" onclick=\"setState('${key}','${v}')\">${t}<\u002Fbutton>`).join('')+`<\u002Fdiv>`;\n}\nfunction setState(k,v){\n  S[k]=v;\n  if(k==='theme')document.documentElement.dataset.theme=v;\n  if(k==='viewport')document.documentElement.dataset.viewport=v;\n  render();\n}\nfunction buildDev(){\n  const scr=[['plans','Plans'],['myplan','My Plan'],['payments','Payments'],['boostbuy','Boost Buy'],['boost','Boost Status'],['topup','Top-up'],['notif','Notifications']];\n  $('#devpanel').innerHTML=\n    `<h4>Screen<\u002Fh4><div class=\"grp\">`+scr.map(([v,t])=>`<button class=\"${S.screen===v?'on':''}\" onclick=\"go('${v}')\">${t}<\u002Fbutton>`).join('')+`<\u002Fdiv>`\n    +seg('Theme','theme',[['light','Light'],['dark','Dark']])\n    +seg('Viewport','viewport',[['mobile','Mobile'],['tablet','Tablet'],['desktop','Desktop']])\n    +seg('Role','role',[['owner','Owner'],['broker','Broker'],['builder','Builder']])\n    +seg('Plan state','plan',[['none','No plan'],['active999','₹999'],['active2999','₹2,999'],['active9999','₹9,999'],['multiple','Multiple'],['expired','Expired'],['grace','Grace'],['trial','Trial']])\n    +seg('Payment state','payment',[['success','Success'],['pending','Pending'],['failed','Failed'],['refunded','Refunded']])\n    +seg('Boost state','boost',[['none','None'],['pending','Pending'],['active','Active'],['expired','Expired'],['rejected','Rejected']])\n    +seg('View state','view',[['normal','Normal'],['skeleton','Skeleton'],['empty','Empty'],['offline','Offline']])\n    +`<h4>Notifications<\u002Fh4><div class=\"grp\"><button class=\"full ${window.notifBlocked?'on':''}\" onclick=\"window.notifBlocked=!window.notifBlocked;render()\">Blocked-permission banner<\u002Fbutton><\u002Fdiv>`;\n}\n\n/* ================= BOOT ================= */\nwindow.addEventListener('DOMContentLoaded',()=>{\n  const h=location.hash.slice(1);\n  if(h&&SCREENS[h])S.screen=h;\n  navStack=[S.screen];\n  history.replaceState({screen:S.screen},'','#'+S.screen);\n  render();\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
