document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

class=\"ic i20 chd-i\" style=\"color:var(--i3)\"><use href=\"#i-chd\"><\u002Fuse><\u002Fsvg><\u002Fbutton><div class=\"acc-a\"><p class=\"t13 pad\" style=\"color:var(--i2);padding-bottom:16px\">Your plan activates instantly. If payment succeeds but the plan doesn't activate within 10 minutes, we activate it or refund you automatically.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div><button class=\"lrow\" data-accx=\"1\"><span style=\"flex:1\" class=\"t15b\">Can I pause or transfer my plan?<\u002Fspan><svg class=\"ic i20 chd-i\" style=\"color:var(--i3)\"><use href=\"#i-chd\"><\u002Fuse><\u002Fsvg><\u002Fbutton><div class=\"acc-a\"><p class=\"t13 pad\" style=\"color:var(--i2);padding-bottom:16px\">No. Plans can't be paused, transferred to another account, or moved to another property once used.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div><button class=\"lrow\" data-accx=\"1\"><span style=\"flex:1\" class=\"t15b\">How do refunds work?<\u002Fspan><svg class=\"ic i20 chd-i\" style=\"color:var(--i3)\"><use href=\"#i-chd\"><\u002Fuse><\u002Fsvg><\u002Fbutton><div class=\"acc-a\"><p class=\"t13 pad\" style=\"color:var(--i2);padding-bottom:16px\">There are no refunds after purchase, except technical failures (payment deducted but plan not activated) and boosts rejected by our team — those are refunded in full within 5–7 working days.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div><button class=\"lrow\" data-accx=\"1\"><span style=\"flex:1\" class=\"t15b\">What is a boost?<\u002Fspan><svg class=\"ic i20 chd-i\" style=\"color:var(--i3)\"><use href=\"#i-chd\"><\u002Fuse><\u002Fsvg><\u002Fbutton><div class=\"acc-a\"><p class=\"t13 pad\" style=\"color:var(--i2);padding-bottom:16px\">A boost promotes your listing at the top of its area for a fixed number of days. Boost days aren't refunded if you sell or remove the listing early.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div><button class=\"lrow\" data-accx=\"1\"><span style=\"flex:1\" class=\"t15b\">Do listings expire?<\u002Fspan><svg class=\"ic i20 chd-i\" style=\"color:var(--i3)\"><use href=\"#i-chd\"><\u002Fuse><\u002Fsvg><\u002Fbutton><div class=\"acc-a\"><p class=\"t13 pad\" style=\"color:var(--i2);padding-bottom:16px\">No. Listings on the ₹999 plan are lifetime. Every 2 months we ask you to confirm the property is still available.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div><button class=\"lrow\" data-accx=\"1\"><span style=\"flex:1\" class=\"t15b\">What does the requirement slot include?<\u002Fspan><svg class=\"ic i20 chd-i\" style=\"color:var(--i3)\"><use href=\"#i-chd\"><\u002Fuse><\u002Fsvg><\u002Fbutton><div class=\"acc-a\"><p class=\"t13 pad\" style=\"color:var(--i2);padding-bottom:16px\">One requirement live for 30 days with up to 10 proposals from owners. Turning off or deleting a requirement still uses its slot.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div><button class=\"lrow\" data-accx=\"1\"><span style=\"flex:1\" class=\"t15b\">How do I get an invoice?<\u002Fspan><svg class=\"ic i20 chd-i\" style=\"color:var(--i3)\"><use href=\"#i-chd\"><\u002Fuse><\u002Fsvg><\u002Fbutton><div class=\"acc-a\"><p class=\"t13 pad\" style=\"color:var(--i2);padding-bottom:16px\">Every payment generates a GST invoice automatically. Find it under Payments → Details → Download invoice.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pad\" style=\"margin-top:24px\">\n    <div style=\"background:var(--accs);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px\">\n      <svg class=\"ic i32\" style=\"color:var(--acc)\"><use href=\"#i-hset\"><\u002Fuse><\u002Fsvg>\n      <div style=\"flex:1\"><p class=\"t15b\">Still need help?<\u002Fp><p class=\"t11\" style=\"color:var(--i2)\">Our team replies within 24 hours<\u002Fp><\u002Fdiv>\n      <button class=\"btn b-pri b-sm\" data-nav=\"s-tk-new\">Contact support<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"scr\" id=\"s-help-art\" data-screen-label=\"S1 Help article\">\n  <div class=\"hdr\"><button class=\"ibtn\" 02Fspan><span class=\"t13b\" style=\"padding-right:12px\">Terms of Service<\u002Fspan><\u002Fdiv>\n  <div class=\"pad\" style=\"margin-top:12px\">\n    <div class=\"rowf t11\" style=\"background:var(--s2);border-radius:8px;padding:10px 12px;gap:8px;color:var(--i3)\">Version 1.2 · Effective 1 Jan 2025<span style=\"flex:1\"><\u002Fspan><a href=\"#versions\" data-toast=\"Previous versions (demo)\">View previous versions<\u002Fa><\u002Fdiv>\n    <div class=\"card\" style=\"margin-top:12px;overflow:hidden\">\n      <button class=\"lrow\" data-act=\"toc\" style=\"min-height:48px\"><span class=\"t13b\" style=\"flex:1\">Table of contents<\u002Fspan><svg class=\"ic i20 chd-i\" style=\"color:var(--i3)\"><use href=\"#i-chd\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n      <div class=\"acc-a\" id=\"toc-body\"><div class=\"stk t13\" style=\"gap:8px;padding:0 16px 16px\">\n        <a href=\"#t1x\" data-jump=\"t-s1\">1. About HomzList<\u002Fa><a href=\"#t2x\" data-jump=\"t-s2\">2. Your account<\u002Fa><a href=\"#t3x\" data-jump=\"t-s3\">3. Posting rules<\u002Fa><a href=\"#t4x\" data-jump=\"t-s4\">4. Plans and payments<\u002Fa><a href=\"#t5x\" data-jump=\"t-s5\">5. Prohibited content<\u002Fa><a href=\"#t6x\" data-jump=\"t-s6\">6. Limitation of liability<\u002Fa><a href=\"#t7x\" data-jump=\"t-s7\">7. Indemnity<\u002Fa><a href=\"#t8x\" data-jump=\"t-s8\">8. Governing law<\u002Fa><a href=\"#t9x\" data-jump=\"t-s9\">9. Arbitration<\u002Fa><a href=\"#t10x\" data-jump=\"t-s10\">10. Changes to these terms<\u002Fa>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"longform\">\n    <h2 id=\"t-s1\" style=\"margin-top:12px\">1. About HomzList<\u002Fh2>\n    <p>HomzList is an online marketplace that connects property owners with people looking for property in and around Rajkot. HomzList is an <b>intermediary under Section 79 of the Information Technology Act, 2000<\u002Fb>.<\u002Fp>\n    <p>All listings, photos, prices and claims on HomzList are <b>user-generated content<\u002Fb>. HomzList does not own, sell, verify the title of, or guarantee any property shown on the platform. Any transaction — token, agreement, registration or payment for a property — is <b>solely between users<\u002Fb>.<\u002Fp>\n    <h2 id=\"t-s2\">2. Your account<\u002Fh2>\n    <ol><li>You must be <b>18 years or older<\u002Fb> to use HomzList.<\u002Fli><li>One account per mobile number. Keep your number active — it's how buyers reach you.<\u002Fli><li>Accounts and plans are <b>not transferable<\u002Fb> to another person or number.<\u002Fli><\u002Fol>\n    <h2 id=\"t-s3\">3. Posting rules<\u002Fh2>\n    <ol><li>Post only <b>truthful information<\u002Fb> — real price, real size, real photos.<\u002Fli><li>You must have the <b>legal right to list<\u002Fb> the property (owner or authorised by the owner).<\u002Fli><li>Photos must be <b>your own<\u002Fb>. Stock photos and other people's photos are removed.<\u002Fli><\u002Fol>\n    <h2 id=\"t-s4\">4. Plans and payments<\u002Fh2>\n    <ol><li>HomzList is <b>payment-first<\u002Fb>: features unlock after payment succeeds.<\u002Fli><li>Plans cannot be <b>paused, transferred or exchanged<\u002Fb> once purchased.<\u002Fli><li>See the <a href=\"#refund\" data-nav=\"s-refund\">Refund Policy<\u002Fa> for the narrow cases where money is returned.<\u002Fli><\u002Fol>\n    <h2 id=\"t-s5\">5. Prohibited content<\u002Fh2>\n    <p>No fake or duplicate listings, no illegal properties, no discriminatory conditions, no spam, no contact details hidden inside photos, and no attempts to take payments through HomzList chat.<\u002Fp>\n    <h2 id=\"t-s6\">6. Limitation of liability<\u002Fh2>\n    <p>HomzList provides the platform \"as is\". To the maximum extent permitted by law, our total liability for any claim is limited to the <b>amount you paid us in the 12 months<\u002Fb> before the claim arose.<\u002Fp>\n    <h2 id=\"t-s7\">7. Indemnity<\u002Fh2>\n    <p>You agree to indemnify HomzList against claims arising from your listings, your content, or your dealings with other users.<\u002Fp>\n    <h2 id=\"t-s8\">8. Governing law<\u002Fh2>\n    <p>These terms are governed by the laws of India. Disputes are subject to the <b>exclusive jurisdiction of the courts in Rajkot, Gujarat<\u002Fb>.<\u002Fp>\n    <h2 id=\"t-s9\">9. Arbitration<\u002Fh2>\n    <p>Before going to court, disputes are first referred to arbitration by a sole arbitrator in Rajkot under the Arbitration and Conciliation Act, 1996. Proceedings are in English.<\u002Fp>\n    <h2 id=\"t-s10\">10. Changes to these terms<\u002Fh2>\n    <p>We may update these terms. For significant changes we'll ask you to review and accept them again before you continue using HomzList.<\u002Fp>\n    <p class=\"t11\" style=\"color:var(--i3);margin-top:24px\">Last updated 1 Jan 2025<\u002Fp>\n    <div class=\"rowf\" style=\"gap:12px;margin-top:12px\">\n      <button class=\"btn b-out b-sm\" data-toast=\"Downloading terms-of-service-v1.2.pdf\"><svg class=\"ic i16\"><use href=\"#i-dl\"><\u002Fuse><\u002Fsvg>Download PDF<\u002Fbutton>\n      <button class=\"btn b-out b-sm\" data-sheet=\"sh-share\"><svg class=\"ic i16\"><use href=\"#i-share\"><\u002Fuse><\u002Fsvg>Share<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"scr g-ok\" id=\"s-refund\" data-screen-label=\"S3 Refund Policy\">\n  <div class=\"hdr u-hdr\"><button class=\"ibtn\" data-back=\"1\"><svg class=\"ic\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1>Refund Policy<\u002Fh1><\u002Fdiv>\n  <div class=\"hdr g-hdr\"><button class=\"ibtn\" data-back=\"1\"><svg class=\"ic\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><span class=\"wm\" style=\"font-size:17px\">Homz<b>List<\u002Fb><\u002Fspan><span style=\"flex:1\"><\u002Fspan><span class=\"t13b\" style=\"padding-right:12px\">Refund Policy<\u002Fspan><\u002Fdiv>\n  <div class=\"pad\" style=\"margin-top:12px\">\n    <div class=\"rowf t11\" style=\"background:var(--s2);border-radius:8px;padding:10px 12px;gap:8px;color:var(--i3)\">Version 1.1 · Effective 1 Jan 2025<span style=\"flex:1\"><\u002Fspan><a href=\"#versions2\" data-toast=\"Previous versions (demo)\">View previous versions<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"longform\">\n    <h2 style=\"margin-top:12px\">1. The rule<\u002Fh2>\n    <p><b>No refunds or cancellations after purchase.<\u002Fb> Plans and boosts are digital services that activate immediately, so once purchased they cannot be cancelled.<\u002Fp>\n    <h2>2. Exception — technical failures<\u002Fh2>\n    <p>If your payment succeeds but your plan isn't activated, we'll either <b>activate it or refund you automatically<\u002Fb> — you don't need to raise a ticket, though you can if you'd like an update.<\u002Fp>\n    <h2>3. Boosts<\u002Fh2>\n    <ol><li>Boosts <b>rejected by our team<\u002Fb> are refunded in full.<\u002Fli><li>There are <b>no refunds for unused boost days<\u002Fb> if a listing is sold or removed early.<\u002Fli><\u002Fol>\n    <h2>4. Timelines<\u002Fh2>\n    <p>Approved refunds reach your account in <b>5–7 working days<\u002Fb>, to the same payment method you used.<\u002Fp>\n    <p>Questions about a specific payment? <a href=\"#contact\" data-nav=\"s-tk-new\">Contact support<\u002Fa> with your Payment ID.<\u002Fp>\n    <p class=\"t11\" style=\"color:var(--i3);margin-top:24px\">Last updated 1 Jan 2025<\u002Fp>\n    <div class=\"rowf\" style=\"gap:12px;margin-top:12px\">\n      <button class=\"btn b-out b-sm\" data-toast=\"Downloading refund-policy-v1.1.pdf\"><svg class=\"ic i16\"><use href=\"#i-dl\"><\u002Fuse><\u002Fsvg>Download PDF<\u002Fbutton>\n      <button class=\"btn b-out b-sm\" data-sheet=\"sh-share\"><svg class=\"ic i16\"><use href=\"#i-share\"><\u002Fuse><\u002Fsvg>Share<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"scr g-ok\" id=\"s-grievance\" data-screen-label=\"S3 Grievance Officer\">\n  <div class=\"hdr u-hdr\"><button class=\"ibtn\" data-back=\"1\"><svg class=\"ic\" data-nav=\"s-tk-new\" data-arg=\"grievance\">Raise a grievance<\u002Fbutton>\n    <\u002Fdiv>\n    <h2>What to include<\u002Fh2>\n    <ul><li>Your name and registered mobile number<\u002Fli><li>A link to the listing, profile or content you're complaining about<\u002Fli><li>What went wrong, with dates and screenshots if possible<\u002Fli><\u002Ful>\n    <p class=\"t11\" style=\"color:var(--i3);margin-top:24px\">Last updated 1 Jan 2025<\u002Fp>\n    <div class=\"rowf\" style=\"gap:12px;margin-top:12px\">\n      <button class=\"btn b-out b-sm\" data-toast=\"Downloading grievance-policy-v1.0.pdf\"><svg class=\"ic i16\"><use href=\"#i-dl\"><\u002Fuse><\u002Fsvg>Download PDF<\u002Fbutton>\n      <button class=\"btn b-out b-sm\" data-sheet=\"sh-share\"><svg class=\"ic i16\"><use href=\"#i-share\"><\u002Fuse><\u002Fsvg>Share<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"dlgw\" id=\"dg-terms\" data-screen-label=\"T&amp;C re-acceptance\">\n  <div class=\"dlg stk\" style=\"gap:12px;max-width:360px\">\n    <svg class=\"ic i32\" style=\"color:var(--acc)\"><use href=\"#i-doc\"><\u002Fuse><\u002Fsvg>\n    <p class=\"t20\">We've updated our Terms<\u002Fp>\n    <p style=\"color:var(--i2)\">We've clarified how numbers are shared and how requirement slots are counted.<\u002Fp>\n    <ul class=\"t13\" style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--i2)\">\n      <li>Your number is shared only after you accept an inquiry<\u002Fli>\n      <li>Deleted requirements still count towards your slot<\u002Fli>\n      <li>Clearer refund language for failed payments<\u002Fli>\n    <\u002Ful>\n    <div id=\"tprev\" class=\"t13\" style=\"height:120px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px;padding:12px;color:var(--i2);line-height:1.6\">\n      <b style=\"color:var(--i1)\">Summary of changes (v1.2)<\u002Fb><br><br>\n      <b>Numbers.<\u002Fb> Your mobile number is never shown publicly. It is shared with a s n class=\"btn b-out b-blk\" data-act=\"load-more\">Load more<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"scr g-ok\" id=\"s-post\" data-screen-label=\"S4 Blog post\">\n  <div class=\"hdr u-hdr\"><button class=\"ibtn\" data-back=\"1\"><svg class=\"ic\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1><\u002Fh1><button class=\"ibtn\" data-sheet=\"sh-share\"><svg class=\"ic\"><use href=\"#i-share\"><\u002Fuse><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n  <div class=\"hdr g-hdr\"><button class=\"ibtn\" data-back=\"1\"><svg class=\"ic\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><span class=\"wm\" style=\"font-size:17px\">Homz<b>List<\u002Fb><\u002Fspan><span style=\"flex:1\"><\u002Fspan><button class=\"ibtn\" data-sheet=\"sh-share\"><svg class=\"ic\"><use href=\"#i-share\"><\u002Fuse><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n  <div class=\"prog\"><i id=\"post-prog\"><\u002Fi><\u002Fdiv>\n  <div class=\"ph\" style=\"aspect-ratio:16/9;width:100%\"><svg class=\"ic i48\"><use href=\"#i-bldg\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n  <div class=\"longform\">\n    <span class=\"badge bg-acc\">Guide<\u002Fspan>\n    <h1 class=\"t24\" style=\"margin:10px 0 12px\">Buying a flat in Rajkot: a 2025 checklist<\u002Fh1>\n    <div class=\"rowf\" style=\"gap:8px;margin-bottom:20px\">\n      <span class=\"av\" style=\"width:24px;height:24px;font-size:11px\">H<\u002Fspan>\n      <span class=\"t13b\">HomzList Team<\u002Fspan>\n      <span class=\"t11\" style=\"color:var(--i3)\">12 Jan 2025 · 8 min read<\u002Fspan>\n    <\u002Fdiv>\n    <p>Rajkot's market moved fast in 2024 — new schemes on Kalawad Road, steady demand in Mavdi, and prices up roughly 8–12% in the popular western belt. If you're buying your first flat in 2025, this checklist keeps you out of trouble.<\u002Fp>\n    <h2>1. Fix your real budget first<\u002Fh2>\n    <p>Your budget isn't the flat price. Add stamp duty (4.9% for most buyers in Gujarat), registration, society deposit, and interiors. On a <b>₹45 Lakh<\u002Fb> flat, expect ₹3–4 Lakh on top.<\u002Fp>\n    <h2>2. Shortlist the area, not just the flat<\u002Fh2>\n    <ul>\n      <li><b>Mavdi<\u002Fb> — newer stock, good value, fast-growing<\u002Fli>\n      <li><b>University Road<\u002Fb> — established, walkable, pricier<\u002Fli>\n      <li><b>Kalawad Road<\u002Fb> — premium schemes, wide roads<\u002Fli>\n      <li><b>150 Feet Ring Road<\u002Fb> — best connectivity, commercial buzz<\u002Fli>\n    <\u002Ful>\n    <blockquote style=\"margin:16px 0;padding:4px 0 4px 16px;border-left:3px solid var(--acc);font-size:17px;font-style:italic;color:var(--i2)\">\"Most buyers regret the area before they regret the flat. Spend your Sundays walking the lane, not the sample flat.\"<\u002Fblockquote>\n    <h2>3. Check the paperwork<\u002Fh2>\n    <p>Ask for the title deed, NA order, approved plan and BU permission. For under-construction schemes, verify the <b>RERA registration number<\u002Fb> on the Gujarat RERA portal.<\u002Fp>\n    <div class=\"co co-acc\" style=\"margin:0 0 12px\"><svg class=\"ic\" style=\"color:var(--acc)\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span>On HomzList, listings with a verified badge have had their ownership documents checked by our team.<\u002Fspan><\u002Fdiv>\n    <h2>4. Negotiate like a local<\u002Fh2>\n    <p>Quoted prices in Rajkot usually carry 3–7% room. Compare per-sq-ft rates across at least three similar listings in the same lane before you make an offer.<\u002Fp>\n    <div class=\"ph3\" style=\"aspect-ratio:16/9;border-radius:12px;margin:16px 0 6px\"><svg class=\"ic i48\"><use href=\"#i-cam\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n    <p class=\"t11\" style=\"color:var(--i3);margin-bottom:16px\">New residential schemes coming up along Kalawad Road, Rajkot<\u002Fp>\n    <p>Finally — never pay a token in cash without a written receipt that names the flat, the price and the refund condition. It's the single cheapest insurance you can buy.<\u002Fp>\n  <\u002Fdiv>\n  <div class x;padding:12px 4px\"><svg class=\"ic i32\" style=\"color:var(--i3)\"><use href=\"#i-warnt\"><\u002Fuse><\u002Fsvg><span class=\"t11 mut3\">Crash<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"toastc\" id=\"toastc\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const $ = (s, r) => (r || document).querySelector(s);\n    const $$ = (s, r) => [...(r || document).querySelectorAll(s)];\n    this.stack = ['s-home']; this.sheets = []; this.dlgs = [];\n    history.replaceState({ d: 1 }, '');\n    const scrim = document.createElement('div'); scrim.className = 'scrim'; document.body.appendChild(scrim); this.scrimEl = scrim;\n    scrim.addEventListener('click', () => history.back());\n\n    const toast = (msg, cls) => {\n      const c = $('#toastc'); if (!c) return;\n      const t = document.createElement('div'); t.className = 'toast' + (cls ? ' ' + cls : ''); t.textContent = msg;\n      c.appendChild(t);\n      setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, 3000);\n    };\n    this.toast = toast;\n\n    const sw = (id) => {\n      $$('.scr.on').forEach(e => e.classList.remove('on'));\n      const el = document.getElementById(id);\n      if (el) el.classList.add('on');\n      window.scrollTo(0, 0);\n      this.afterShow(id);\n    };\n    this.sw = sw;\n    this.nav = (id, arg) => {\n      if (!document.getElementById(id)) { toast('Screen not built in this batch'); return; }\n      // force-close any open overlays (e.g. navigating from a dialog/sheet)\n      this.dlgs.forEach(d => document.getElementById(d)?.classList.remove('on'));\n      this.sheets.forEach(s => document.getElementById(s)?.classList.remove('on'));\n      this.dlgs = []; this.sheets = []; this.scrimEl.classList.remove('on');\n      this.prep(id, arg);\n      this.stack.push(id);\n      history.pushState({ d: this.stack.length + this.sheets.length + this.dlgs.length }, '');\n      sw(id);\n    };\n    const syncScrim = () => scrim.classList.toggle('on', this.sheets.length > 0);\n    this.openSheet = (id) => {\n      const el = document.getElementById(id); if (!el) return;\n      el.classList.add('on'); this.sheets.push(id); syncScrim();\n      history.pushState({ d: this.stack.length + this.sheets.length + this.dlgs.length }, '');\n    };\n    this.openDlg = (id) => {\n      const el = document.getElementById(id); if (!el) return;\n      el.classList.add('on'); this.dlgs.push(id);\n      history.pushState({ d: this.stack.length + this.sheets.length + this.dlgs.length }, '');\n      if (id === 'dg-terms') this.resetTerms();\n    };\n    const closeTop = () => {\n      if (this.dlgs.length) { const id = this.dlgs.pop(); document.getElementById(id)?.classList.remove('on'); return true; }\n      if (this.sheets.length) { const id = this.sheets.pop(); document.getElementById(id)?.classList.remove('on'); syncScrim(); return true; }\n      if (this.stack.length > 1) { this.stack.pop(); sw(this.stack[this.stack.length - 1]); return true; }\n      return false;\n    };\n    window.addEventListener('popstate', () => { closeTop(); });\n\n    // click delegation\n    document.addEventListener('click', (e) => {\n      const q = (a) => e.target.closest('[' + a + ']');\n      let t;\n      if ((t = q('data-back'))) { history.back(); return; }\n      if ((t = q('data-close'))) { history.back(); return; }\n      if ((t = q('data-nav'))) { this.nav(t.dataset.nav, t.dataset.arg); this.closeTB(t); return; }\n      if ((t = q('data-sheet'))) { this.openSheet(t.dataset.sheet); this.closeTB(t); return; }\n      if ((t = q('data-dlg'))) { this.openDlg(t.dataset.dlg); this.closeTB(t); return; }\n      if ((t = q('data-toast'))) { toast(t.dataset.toast); return; }\n      if ((t = q('data-copy'))) { try { navigator.clipboard.writeText(t.dataset.copy); } catch (err) {} toast('Copied to clipboard'); return; }\n      if ((t = q('data-jump'))) { this.jump(t.dataset.jump); if (this.sheets.length) history.back(); return; }\n      if ((t = q('data-tab'))) { this.tab(t); return; }\n      if ((t = q('data-accx'))) {\n        const body = t.nextElementSibling, open = body.style.maxHeight && body.style.maxHeight !== '0px';\n        body.style.maxHeight = open ? '0px' : body.scrollHeight + 'px';\n        const ch = t.querySelector('.chd-i'); if (ch) ch.classList.toggle('rot', !open);\n        return;\n      }\n      if ((t = q('data-cgrp'))) { // radio chip groups\n        $$('[data-cgrp=\"' + t.dataset.cgrp + '\"]').forEach(c => c.classList.remove('on'));\n        t.classList.add('on');\n        if (t.dataset.cgrp === 'blogcat') this.blogFilter(t.textContent.trim());\n        return;\n      }\n      if ((t = q('data-act'))) { this.act(t.dataset.act, t, e); return; }\n    });\n\n    // input delegation\n    document.addEventListener('input', (e) => {\n      const el = e.target;\n      if (el.dataset.filter === 'help') this.helpFilter(el.value);\n      if (el.dataset.count) {\n        const max = el.dataset.count, c = el.parentElement.querySelector('.cnt');\n        if (c) c.textContent = el.value.length + ' / ' + max;\n        if (el.value.length > +max) el.value = el.value.slice(0, +max);\n      }\n      if (el.id === 'del-in') { const b = $('#del-go'); if (b) b.disabled = el.value.trim() !== 'DELETE'; }\n      if (el.classList.contains('otp-in')) {\n        el.value = el.value.replace(/\\D/g, '').slice(-1);\n        if (el.value) { const nx = el.nextElementSibling; if (nx && nx.classList.contains('otp-in')) nx.focus(); }\n        const all = $$('.otp-in', el.closest('.otp-grp')), full = all.every(i => i.value);\n        const vb = el.closest('.scr, .dlg')?.querySelector('[data-act=\"otp-verify\"]'); if (vb) vb.disabled = !full;\n      }\n    });\n    document.addEventListener('keydown', (e) => {\n      const el = e.target;\n      if (el.classList && el.classList.contains('otp-in') && e.key === 'Backspace' && !el.value) {\n        const pv = el.previousElementSibling; if (pv && pv.classList.contains('otp-in')) { pv.focus(); pv.value = ''; }\n      }\n      if (e.key === 'Escape' && (this.sheets.length || this.dlgs.length)) history.back();\n    });\n\n    // scroll: blog progress + terms preview gate\n    window.addEventListener('scroll', (e) => {\n      if (e.target === document && $('#s-post')?.classList.contains('on')) {\n        const h = document.documentElement, max = h.scrollHeight - h.clientHeight;\n        const p = max > 0 ? Math.min(100, (h.scrollTop || window.scrollY) / max * 100) : 0;\n        const bar = $('#post-prog'); if (bar) bar.style.width = p + '%';\n      }\n      const tv = e.target;\n      if (tv && tv.id === 'tprev' && tv.scrollTop + tv.clientHeight >= tv.scrollHeight - 8) {\n        const b = $('#agree-btn'); if (b) b.disabled = false;\n      }\n    }, true);\n\n    // sheet swipe-down\n    let sy = null, sEl = null;\n    document.addEventListener('touchstart', (e) => {\n      sEl = e.target.closest('.sheet.on'); if (!sEl) return;\n      const bd = sEl.querySelector('.sh-bd');\n      if (bd && bd.contains(e.target) && bd.scrollTop > 0) { sEl = null; return; }\n      sy = e.touches[0].clientY;\n    }, { passive: true });\n    document.addEventListener('touchmove', (e) => {\n      if (!sEl || sy == null) return;\n      const dy = e.touches[0].clientY - sy;\n      if (dy > 0) sEl.style.transform = 'translate(-50%,' + dy + 'px)';\n    }, { passive: true });\n    document.addEventListener('touchend', (e) => {\n      if (!sEl || sy == null) return;\n      const dy = e.changedTouches[0].clientY - sy;\n      sEl.style.transform = '';\n      if (dy > 90) history.back();\n      sEl = null; sy = null;\n    });\n  }\n\n  closeTB(t) { const tb = document.getElementById('devtb'); if (tb && tb.contains(t)) tb.classList.remove('open'); }\n\n  prep(id, arg) {\n    const $ = (s) => document.querySelector(s);\n    if (id === 's-help-cat' && arg) $('#hcat-t').textContent = arg.replace(/&amp;/g, '&');\n    if (id === 's-tk-thread') this.setThreadClosed(arg === 'closed');\n    if (id === 's-otp') {\n      const scr = $('#s-otp'); scr.dataset.flow = arg || 'deactivate';\n      $('#otp-t').textContent = arg === 'delete' ? 'Confirm deletion' : 'Confirm deactivation';\n      $('#otp-btn-t').textContent = arg === 'delete' ? 'Verify & delete' : 'Verify & deactivate';\n      scr.querySelectorAll('.otp-in').forEach(i => i.value = '');\n      const vb = scr.querySelector('[data-act=\"otp-verify\"]'); if (vb) vb.disabled = true;\n    }\n    if (id === 's-tk-new' && arg === 'grievance') this.setTkCat('Grievance complaint');\n  }\n\n  afterShow(id) {\n    if (id === 's-tk-success') {\n      const w = document.querySelector('#s-tk-success .chk-draw');\n      if (w) { w.classList.remove('chk-draw'); void w.getBoundingClientRect(); w.classList.add('chk-draw'); }\n    }\n    if (id === 's-otp') setTimeout(() => document.querySelector('#s-otp .otp-in')?.focus(), 150);\n  }\n\n  setThreadClosed(closed) {\n    const scr = document.getElementById('s-tk-thread'); if (!scr) return;\n    scr.classList.toggle('closed', closed);\n    const b = scr.querySelector('#th-badge');\n    if (b) { b.className = 'badge ' + (closed ? 'bg-mut' : 'bg-inf'); b.textContent = closed ? 'Closed' : 'Open'; }\n    scr.querySelector('#th-composer')?.classList.toggle('hide', closed);\n    scr.querySelector('#th-closedbar')?.classList.toggle('hide', !closed);\n  }\n\n  setTkCat(v) {\n    const el = document.getElementById('tkcat-val');\n    if (el) { el.textContent = v; el.style.color = 'var(--i1)'; }\n    ['tk-c-pay', 'tk-c-num', 'tk-c-rep'].forEach(x => document.getElementById(x)?.classList.add('hide'));\n    if (v === 'Payment or refund') document.getElementById('tk-c-pay')?.classList.remove('hide');\n    if (v === 'Lost access to my number') document.getElementById('tk-c-num')?.classList.remove('hide');\n    if (v === 'Report a user or listing') document.getElementById('tk-c-rep')?.classList.remove('hide');\n  }\n\n  helpFilter(q) {\n    q = q.trim().toLowerCase();\n    const items = document.querySelectorAll('#s-help [data-search]');\n    let n = 0;\n    items.forEach(it => {\n      const hit = !q || (it.textContent + ' ' + it.dataset.search).toLowerCase().includes(q);\n      it.style.display = hit ? '' : 'none';\n      if (hit) n++;\n    });\n    const empty = document.getElementById('help-empty'), main = document.getElementById('help-main');\n    const none = q && n === 0;\n    empty.classList.toggle('hide', !none);\n    main.classList.toggle('hide', !!none);\n    document.getElementById('help-empty-q').textContent = q;\n  }\n\n  blogFilter(cat) {\n    document.querySelectorAll('#blog-rows [data-cat]').forEach(r => {\n      r.style.display = (cat === 'All' || r.dataset.cat === cat) ? '' : 'none';\n    });\n  }\n\n  jump(id) {\n    const el = document.getElementById(id); if (!el) return;\n    const y = el.getBoundingClientRect().top + window.scrollY - 108;\n    window.scrollTo({ top: y, behavior: 'smooth' });\n  }\n\n  tab(t) {\n    const bar = t.closest('[data-tabs]'); if (!bar) return;\n    bar.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === t));\n    const grp = bar.dataset.tabs, v = t.dataset.tab;\n    document.querySelectorAll('[data-tabv][data-tabgrp=\"' + grp + '\"]').forEach(r => {\n      r.style.display = r.dataset.tabv.split(' ').includes(v) ? '' : 'none';\n    });\n  }\n\n  resetTerms() {\n    const b = document.getElementById('agree-btn'); if (b) b.disabled = true;\n    const p = document.getElementById('tprev'); if (p) p.scrollTop = 0;\n  }\n\n  act(name, t, e) {\n    const $ = (s) => document.querySelector(s);\n    const toast = this.toast;\n    switch (name) {\n      case 'tb': t.closest('.tb').classList.toggle('open'); break;\n      case 'theme': {\n        document.body.dataset.theme = t.dataset.v === 'dark' ? 'dark' : '';\n        document.querySelectorAll('[data-act=\"theme\"]').forEach(b => b.classList.toggle('on', b.dataset.v === t.dataset.v));\n        break;\n      }\n      case 'themetgl': {\n        const dk = document.body.dataset.theme === 'dark';\n        document.body.dataset.theme = dk ? '' : 'dark';\n        document.querySelectorAll('[data-act=\"theme\"]').forEach(b => b.classList.toggle('on', b.dataset.v === (dk ? 'light' : 'dark')));\n        break;\n      }\n      case 'vp': {\n        document.body.dataset.vp = t.dataset.v === 'auto' ? '' : t.dataset.v;\n        document.querySelectorAll('[data-act=\"vp\"]').forEach(b => b.classList.toggle('on', b === t));\n        break;\n      }\n      case 'sess': {\n        document.body.classList.toggle('guest', t.dataset.v === 'guest');\n        document.querySelectorAll('[data-act=\"sess\"]').forEach(b => b.classList.toggle('on', b === t));\n        toast(t.dataset.v === 'guest' ? 'Viewing as guest' : 'Viewing as logged-in user');\n        break;\n      }\n      case 'tstate': {\n        const on = document.body.classList.toggle(t.dataset.v);\n        t.classList.toggle('on', on);\n        break;\n      }\n      case 'helpchip': {\n        const q = t.textContent.trim();\n        const inp = $('#help-q'); inp.value = q;\n        document.querySelectorAll('#help-chips .chip').forEach(c => c.classList.toggle('on', c === t));\n        this.helpFilter(q === 'Chat & Numbers' ? 'chat' : q);\n        break;\n      }\n      case 'fb-yes': case 'fb-no': {\n        const w = t.closest('.fbk');\n        w.querySelector('.fbk-btns').classList.add('hide');\n        w.querySelector('.fbk-thanks').classList.remove('hide');\n        if (name === 'fb-no') w.querySelector('.fbk-no').classList.remove('hide');\n        break;\n      }\n      case 'fb-send': {\n        const w = t.closest('.fbk');\n        w.querySelector('.fbk-no').classList.add('hide');\n        toast('Thanks for your feedback');\n        break;\n      }\n      case 'tkcat': { this.setTkCat(t.dataset.v); history.back(); break; }\n      case 'att': {\n        if (t.classList.contains('up')) return;\n        t.classList.add('up');\n        break;\n      }\n      case 'att-rm': { e.stopPropagation(); t.closest('.upl').classList.remove('up'); break; }\n      case 'submit-ticket': this.nav('s-tk-success'); break;\n      case 'send-msg': {\n        const ta = $('#th-in'); const v = (ta.value || '').trim(); if (!v) return;\n        const list = $('#th-msgs');\n        const d = document.createElement('div');\n        d.className = 'bub me'; d.textContent = v;\n        list.appendChild(d);\n        const m = document.createElement('div'); m.className = 'sysline'; m.textContent = 'Just now';\n        list.appendChild(m);\n        ta.value = '';\n        break;\n      }\n      case 'reopen': { this.setThreadClosed(false); toast('Ticket reopened'); break; }\n      case 'reason': {\n        const box = t.closest('.rsn-grp');\n        box.querySelectorAll('.radio').forEach(r => r.classList.remove('on'));\n        t.querySelector('.radio').classList.add('on');\n        const b = $('#del1-go'); if (b) b.disabled = false;\n        break;\n      }\n      case 'otp-verify': {\n        const flow = $('#s-otp').dataset.flow;\n        this.nav(flow === 'delete' ? 's-grace' : 's-deactivated');\n        break;\n      }\n      case 'agree': { history.back(); toast('Thanks — terms accepted'); break; }\n      case 'data-req': {\n        $('#data-idle').classList.add('hide');\n        $('#data-requested').classList.remove('hide');\n        setTimeout(() => {\n          $('#data-requested').classList.add('hide');\n          $('#data-ready').classList.remove('hide');\n          toast('Your data is ready');\n        }, 2600);\n        break;\n      }\n      case 'data-dl': toast('Downloading homzlist-data-12jan2025.zip'); break;\n      case 'data-again': {\n        $('#data-ready').classList.add('hide');\n        $('#data-idle').classList.remove('hide');\n        break;\n      }\n      case 'retry': {\n        const lb = t.querySelector('.rlbl'), sp = t.querySelector('.spin');\n        lb.classList.add('hide'); sp.classList.remove('hide'); t.disabled = true;\n        setTimeout(() => { lb.classList.remove('hide'); sp.classList.add('hide'); t.disabled = false; toast('Still offline', 'terr'); }, 1500);\n        break;\n      }\n      case 'retry-m': {\n        const lb = t.querySelector('.rlbl'), sp = t.querySelector('.spin');\n        lb.classList.add('hide'); sp.classList.remove('hide'); t.disabled = true;\n        setTimeout(() => { lb.classList.remove('hide'); sp.classList.add('hide'); t.disabled = false; toast('Still under maintenance — try again soon'); }, 1500);\n        break;\n      }\n      case 'cancel-del': { toast('Deletion cancelled — welcome back'); this.nav('s-account'); break; }\n      case 'load-more': toast(\"You're all caught up\"); break;\n      case 'tglx': t.classList.toggle('on'); break;\n      case 'stackdemo': { this.openSheet('sh-jump'); setTimeout(() => this.openSheet('sh-share'), 350); break; }\n      case 'toc': {\n        const body = $('#toc-body'), open = body.style.maxHeight && body.style.maxHeight !== '0px';\n        body.style.maxHeight = open ? '0px' : body.scrollHeight + 'px';\n        t.querySelector('.chd-i')?.classList.toggle('rot', !open);\n        break;\n      }\n    }\n  }\n\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
