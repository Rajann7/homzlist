document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f01c7155-9976-4377-bb3a-e94e42e728c9\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\n  body{margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n  *{box-sizing:border-box}\n  input,button,textarea{font-family:inherit}\n  .hz-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}\n  .hz-scroll::-webkit-scrollbar{width:0;height:0}\n  .hz-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}\n  .hz-x::-webkit-scrollbar{display:none}\n  input[type=range].hz-rng{-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;position:absolute;left:0;right:0;width:100%;height:24px;margin:0}\n  input[type=range].hz-rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:999px;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}\n  input[type=range].hz-rng::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:999px;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}\n  @keyframes hzSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}\n  @keyframes hzScrim{from{opacity:0}to{opacity:1}}\n  @keyframes hzToast{from{transform:translate(-50%,140%);opacity:0}to{transform:translate(-50%,0);opacity:1}}\n  @keyframes hzPop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}\n  @keyframes hzFade{from{opacity:0}to{opacity:1}}\n  @keyframes hzShimmer{0%{background-position:-360px 0}100%{background-position:360px 0}}\n  @keyframes hzUnderline{from{transform:scaleX(.4);opacity:.4}to{transform:scaleX(1);opacity:1}}\n  .hz-shim{background:linear-gradient(90deg,var(--surface2) 0px,var(--surface3) 60px,var(--surface2) 120px);background-size:360px 100%;animation:hzShimmer 1.2s infinite linear}\n  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"{{ rootStyle }}\">\n\n  <!-- ============ DEV TOOLBAR ============ -->\n  <div style=\"{{ devWrapStyle }}\">\n    <button sc-camel-on-click=\"{{ toggleDev }}\" style=\"display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;background:#2a2a2a;color:#e5e5e5;border:none;border-radius:7px;font:600 12px/1 -apple-system,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)\">\n      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2\"><\u002Fpath><\u002Fsvg>\n      DEV\n    <\u002Fbutton>\n    <sc-if value=\"{{ devOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:6px;width:214px;background:#232323;border:1px solid #3a3a3a;border-radius:9px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.45);color:#ddd;font:400 12px/1.3 -apple-system,sans-serif\">\n        <div style=\"font:600 10px/1 -apple-system;letter-spacing:.4px;color:#8a8a8a;text-transform:uppercase;margin-bottom:6px\">Screen<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px\">\n          <sc-for list=\"{{ devScreens }}\" as=\"d\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:600 10px/1 -apple-system;letter-spacing:.4px;color:#8a8a8a;text-transform:uppercase;margin-bottom:6px\">Theme<\u002Fdiv>\n        <div style=\"display:flex;gap:5px;margin-bottom:10px\">\n          <button sc-camel-on-click=\"{{ setLight }}\" style=\"{{ lightBtn }}\">Light<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setDark }}\" style=\"{{ darkBtn }}\">Dark<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font:600 10px/1 -apple-system;letter-spacing:.4px;color:#8a8a8a;text-transform:uppercase;margin-bottom:6px\">Device<\u002Fdiv>\n        <div style=\"display:flex;gap:5px;margin-bottom:10px\">\n          <sc-for list=\"{{ devDevices }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:600 10px/1 -apple-system;letter-spacing:.4px;color:#8a8a8a;text-transform:uppercase;margin-bottom:6px\">State<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:5px\">\n          <sc-for list=\"{{ devStates }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- ============ APP COLUMN ============ -->\n  <div style=\"{{ colStyle }}\">\n\n    <!-- ===== HOME (S1) ===== -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;height:100%;position:relative;background:var(--page)\">\n\n        <!-- header -->\n        <div style=\"flex:0 0 auto;background:var(--surface1);border-bottom:1px solid var(--divider);padding:8px 16px 10px\">\n          <div style=\"display:flex;align-items:center;gap:10px;height:40px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0 12px;transition:border-color .15s\" sc-camel-on-click=\"{{ focusSearch }}\">\n            <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink3)\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.2-3.2\"><\u002Fpath><\u002Fsvg>\n            <input value=\"{{ query }}\" sc-camel-on-input=\"{{ onQuery }}\" sc-camel-on-focus=\"{{ focusSearch }}\" placeholder=\"Search area, city or society…\" style=\"flex:1;border:none;background:transparent;font:400 15px/1 -apple-system;color:var(--ink1);outline:none;padding:0\">\n            <sc-if value=\"{{ query }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ clearQuery }}\" style=\"width:22px;height:22px;display:grid;place-items:center;border:none;background:var(--surface3);border-radius:999px;cursor:pointer;padding:0\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink2)\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:0;margin-top:10px;background:var(--surface2);border-radius:999px;padding:3px\">\n            <button sc-camel-on-click=\"{{ modeProp }}\" style=\"{{ modePropStyle }}\">Property<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ modeReq }}\" style=\"{{ modeReqStyle }}\">Requirement<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- autocomplete overlay -->\n        <sc-if value=\"{{ acOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;left:16px;right:16px;top:110px;z-index:40;background:var(--surface1);border:1px solid var(--border);border-radius:8px;box-shadow:var(--l3);max-height:62%;overflow-y:auto;animation:hzFade .15s ease-out\">\n            <sc-if value=\"{{ acHasSug }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:10px 14px 4px;font:600 11px/1 -apple-system;letter-spacing:.3px;color:var(--ink3);text-transform:uppercase\">Suggestions<\u002Fdiv>\n              <sc-for list=\"{{ acSuggestions }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ s.go }}\" style=\"display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;cursor:pointer\">\n                  <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink3)\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.4\"><\u002Fcircle><\u002Fsvg>\n                  <div><div style=\"font:400 15px/1.3 -apple-system;color:var(--ink1)\">{{ s.name }}<\u002Fdiv><div style=\"font:400 13px/1.3 -apple-system;color:var(--ink3)\">{{ s.meta }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ acHasPages }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"border-top:1px solid var(--divider);padding:10px 14px 4px;font:600 11px/1 -apple-system;letter-spacing:.3px;color:var(--ink3);text-transform:uppercase\">Pages<\u002Fdiv>\n              <sc-for list=\"{{ acPages }}\" as=\"p\" hint-placeholder-count=\"1\">\n                <div sc-camel-on-click=\"{{ p.go }}\" style=\"display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;cursor:pointer\">\n                  <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.6\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><\u002Fsvg>\n                  <div style=\"font:400 15px/1.3 -apple-system;color:var(--accent)\">{{ p.name }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n            <div style=\"border-top:1px solid var(--divider);padding:10px 14px 4px;font:600 11px/1 -apple-system;letter-spacing:.3px;color:var(--ink3);text-transform:uppercase\">Recent<\u002Fdiv>\n            <sc-for list=\"{{ acRecent }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ r.search }}\" style=\"display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 14px;cursor:pointer\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink3)\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n                <div style=\"font:400 15px/1.3 -apple-system;color:var(--ink1)\">{{ r.q }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ blurSearch }}\" style=\"position:absolute;inset:0;top:110px;z-index:30\"><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- body -->\n        <div class=\"hz-scroll\" style=\"flex:1;min-height:0\">\n\n          <!-- SKELETON -->\n          <sc-if value=\"{{ isSkeleton }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px\">\n              <div class=\"hz-shim\" style=\"height:12px;width:120px;border-radius:4px;margin-bottom:14px\"><\u002Fdiv>\n              <sc-for list=\"{{ four }}\" as=\"n\" hint-placeholder-count=\"4\"><div class=\"hz-shim\" style=\"height:16px;border-radius:4px;margin-bottom:12px\"><\u002Fdiv><\u002Fsc-for>\n              <div class=\"hz-shim\" style=\"height:12px;width:160px;border-radius:4px;margin:20px 0 14px\"><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2px\">\n                <sc-for list=\"{{ nine }}\" as=\"n\" hint-placeholder-count=\"9\"><div class=\"hz-shim\" style=\"aspect-ratio:1;border-radius:2px\"><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- NORMAL / PROPERTY MODE -->\n          <sc-if value=\"{{ homePropertyNormal }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:16px 0 20px\">\n              <!-- recents -->\n              <sc-if value=\"{{ hasRecents }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:0 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px\">\n                  <span style=\"font:600 11px/1 -apple-system;letter-spacing:.3px;color:var(--ink3);text-transform:uppercase\">Recent searches<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ clearRecents }}\" style=\"border:none;background:none;color:var(--accent);font:600 13px/1 -apple-system;cursor:pointer;padding:6px 0\">Clear all<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-for list=\"{{ recents }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:12px;height:44px;padding:0 16px\">\n                    <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink3)\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n                    <span sc-camel-on-click=\"{{ r.search }}\" style=\"flex:1;font:400 15px/1.3 -apple-system;color:var(--ink1);cursor:pointer\">{{ r.q }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ r.remove }}\" style=\"width:44px;height:44px;display:grid;place-items:center;border:none;background:none;cursor:pointer;margin-right:-12px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink3)\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ recentsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:24px 16px;text-align:center\"><div style=\"font:400 13px/1.45 -apple-system;color:var(--ink3)\">No recent searches yet<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-if>\n\n              <!-- popular areas -->\n              <div style=\"padding:0 16px;margin:20px 0 10px;font:600 11px/1 -apple-system;letter-spacing:.3px;color:var(--ink3);text-transform:uppercase\">Popular areas in Rajkot<\u002Fdiv>\n              <div class=\"hz-x\" style=\"display:flex;gap:8px;padding:0 16px\">\n                <sc-for list=\"{{ popularAreas }}\" as=\"a\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ a.go }}\" style=\"flex:0 0 auto;height:36px;padding:0 16px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;font:600 13px/1 -apple-system;color:var(--ink1);cursor:pointer;white-space:nowrap\">{{ a.name }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <!-- explore -->\n              <div style=\"padding:0 16px;margin:22px 0 10px;font:600 11px/1 -apple-system;letter-spacing:.3px;color:var(--ink3);text-transform:uppercase\">Explore<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:2px\">\n                <sc-for list=\"{{ exploreTiles }}\" as=\"t\" hint-placeholder-count=\"8\">\n                  <div style=\"{{ t.cellStyle }}\" sc-camel-on-click=\"{{ t.open }}\" sc-camel-on-mouse-down=\"{{ t.down }}\" sc-camel-on-mouse-up=\"{{ t.up }}\" sc-camel-on-mouse-leave=\"{{ t.up }}\" sc-camel-on-touch-start=\"{{ t.down }}\" sc-camel-on-touch-end=\"{{ t.up }}\">\n                    <div style=\"position:absolute;inset:0;background-image:{{ t.bg }};background-size:cover;background-position:center\"><\u002Fdiv>\n                    <sc-if value=\"{{ t.promoted }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font:600 11px/1 -apple-system;letter-spacing:.3px;text-transform:uppercase;padding:4px 7px;border-radius:4px\">Promoted<\u002Fspan>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ t.count }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:3px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.8\"><rect x=\"3\" y=\"8\" width=\"14\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 8V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2\"><\u002Fpath><\u002Fsvg><span style=\"font:600 12px/1 -apple-system\">{{ t.count }}<\u002Fspan><\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- NORMAL / REQUIREMENT MODE -->\n          <sc-if value=\"{{ homeReqNormal }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px 0 24px\">\n              <div style=\"margin:0 16px 16px;padding:16px;background:var(--accentSoft);border-radius:12px\">\n                <div style=\"font:600 15px/1.3 -apple-system;color:var(--ink1)\">Can't find what you're looking for?<\u002Fdiv>\n                <div style=\"font:400 13px/1.45 -apple-system;color:var(--ink2);margin-top:4px;text-wrap:pretty\">Post your requirement and let verified brokers &amp; owners reach out to you with matching properties.<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ postReq }}\" style=\"margin-top:12px;height:44px;width:100%;background:var(--accent);border:none;border-radius:8px;font:600 15px/1 -apple-system;color:#fff;cursor:pointer\">Post a Requirement<\u002Fbutton>\n              <\u002Fdiv>\n\n              <div style=\"padding:0 16px;margin:4px 0 10px;font:600 11px/1 -apple-system;letter-spacing:.3px;  url = u => `url('${u}')`;\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'home', theme: 'light', device: 'mobile', forced: null, devOpen: false,\n    mode: 'property', query: '', searchFocused: false,\n    recents: ['3 BHK Mavdi', 'Flats under 50 lakh', 'Shree Residency', 'Plots Kuvadva Road'],\n    resultQuery: '3 BHK Mavdi', resultTab: 'all', sort: 'latest',\n    sheet: null, peek: null, notified: false, toast: '',\n    faqOpen: {},\n    savedCards: {},\n    f: {\n      lookingTo: 'buy', types: ['Flat'], bhk: ['3'], baths: [], furnishing: ['Semi-furnished'],\n      facing: [], areaUnit: [], road: [], tenant: [], carpet: [], wash: [],\n      amenities: [], areas: ['Mavdi', 'University Road'],\n      budgetMin: 20, budgetMax: 150,\n      corner: false, veg: false,\n      pnego: false, ready: false, newc: false, verified: false\n    }\n  };\n\n  componentDidMount() {\n    const valid = ['home', 'results', 'area', 'comingsoon', 'placeholder'];\n    const h = (location.hash || '').replace('#', '');\n    const initial = valid.includes(h) ? h : 'home';\n    if (initial !== this.state.screen) this.setState({ screen: initial });\n    history.replaceState({ screen: initial }, '');\n    this._pop = (e) => { const s = (e.state && e.state.screen) || 'home'; this.setState({ screen: s, sheet: null, peek: null }); };\n    window.addEventListener('popstate', this._pop);\n  }\n  componentWillUnmount() { window.removeEventListener('popstate', this._pop); if (this._t) clearTimeout(this._t); if (this._lp) clearTimeout(this._lp); }\n\n  nav(screen) { history.pushState({ screen }, '', '#' + screen); this.setState({ screen, sheet: null, peek: null, searchFocused: false }); }\n  gotoDetail(hash) { window.location.href = 'HomzList%20Detail.dc.html' + (hash ? '#' + hash : ''); }\n  goBack() { history.back(); }\n  toast(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 3000); }\n  openSheet(k) { this.setState({ sheet: k }); }\n  closeSheet() { this.setState({ sheet: null }); }\n\n  toggleArr(key, val) {\n    this.setState(s => { const a = s.f[key] || []; const has = a.includes(val); return { f: { ...s.f, [key]: has ? a.filter(x => x !== val) : [...a, val] } }; });\n  }\n  setFlag(key, val) { this.setState(s => ({ f: { ...s.f, [key]: val } })); }\n\n  liveCount() {\n    const f = this.state.f;\n    let base = 142;\n    const span = (f.budgetMax - f.budgetMin) / 300;\n    base = Math.round(base * (0.35 + span * 0.65));\n    if (f.bhk.length) base = Math.round(base * (0.6 + f.bhk.length * 0.13));\n    if (f.verified) base = Math.round(base * 0.7);\n    if (f.ready) base = Math.round(base * 0.8);\n    return Math.max(3, base);\n  }\n  fmtL(l) { return l >= 100 ? '₹' + (l / 100).toFixed(l % 100 === 0 ? 0 : 1).replace(/\\.0$/, '') + ' Cr' : '₹' + l + ' L'; }\n\n  chip(label, on, onClick) {\n    return { label, style: `flex:0 0 auto;height:36px;padding:0 16px;border-radius:999px;font:600 13px/1 -apple-system;cursor:pointer;white-space:nowrap;transition:all .12s;${on ? 'background:var(--accentSoft);border:1px solid var(--accent);color:var(--accent)' : 'background:var(--surface2);border:1px solid var(--border);color:var(--ink1)'}`, toggle: onClick };\n  }\n  toggleUI(on) {\n    return {\n      track: `position:relative;width:46px;height:28px;border-radius:999px;border:none;cursor:pointer;transition:background .15s;background:${on ? 'var(--accent)' : 'var(--surface3)'}`,\n      knob: `position:absolute;top:3px;left:${on ? '21px' : '3px'};width:22px;height:22px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s`\n    };\n  }\n\n  makeCard(i, opts) {\n    opts = opts || {};\n    const arr = [\n      { price: '₹85 Lakh', badge: 'For Sale', meta: '3 BHK · 1,450 sqft · ₹5,862/sqft', area: 'Mavdi, Rajkot', poster: 'RK Properties', role: 'Broker', verified: true, count: 6, ph: 0, av: 0, sub: '3 BHK · Mavdi' },\n      { price: '₹62 Lakh', badge:
