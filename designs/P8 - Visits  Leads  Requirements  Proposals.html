  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"light\" data-viewport=\"mobile\" data-role=\"broker\" data-plan=\"p2999\" data-state=\"normal\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\">\n<title>HomzList<\u002Ftitle>\n<style>\n/* ============ DESIGN TOKENS ============ */\n:root{\n  --page:#FFFFFF; --s1:#FFFFFF; --s2:#F5F5F5; --s3:#EFEFEF; --border:#DBDBDB; --divider:#EFEFEF;\n  --ink1:#111111; --ink2:#555555; --ink3:#8E8E8E; --inkD:#C7C7C7;\n  --accent:#0F9D58; --accentP:#0C7C46; --accentSoft:#E6F4EC; --accentD:#A8D5BD;\n  --error:#ED4956; --errorSoft:#FDECEE; --warning:#F5A623; --warningSoft:#FEF5E7; --info:#0095F6; --infoSoft:#E7F3FD;\n  --l1:0 1px 2px rgba(0,0,0,.06); --l2:0 4px 12px rgba(0,0,0,.10); --l3:0 8px 24px rgba(0,0,0,.16);\n  --ease:cubic-bezier(0.2,0,0,1);\n  --blurBg:rgba(0,0,0,.45);\n}\nhtml[data-theme=\"dark\"]{\n  --page:#000000; --s1:#121212; --s2:#1E1E1E; --s3:#262626; --border:#363636; --divider:#262626;\n  --ink1:#F5F5F5; --ink2:#B0B0B0; --ink3:#8E8E8E; --inkD:#5A5A5A;\n  --accent:#1DB868; --accentP:#149A54; --accentSoft:#0E2B1C; --accentD:#1a4a30;\n  --error:#FF5C6A; --errorSoft:#2b1416; --warning:#FFB74D; --warningSoft:#2b2110; --info:#3BA7F8; --infoSoft:#0e2233;\n  --l1:0 0 0 1px var(--border); --l2:0 0 0 1px var(--border); --l3:0 0 0 1px var(--border);\n  --blurBg:rgba(0,0,0,.6);\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;\n  background:#FAFAFA;color:var(--ink1);\n  -webkit-font-smoothing:antialiased;line-height:1.35;\n}\nhtml[data-theme=\"dark\"] body{background:#000}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}\ninput,textarea,select{font-family:inherit}\n::-webkit-scrollbar{width:0;height:0}\n\n/* ============ APP FRAME ============ */\n#app{\n  position:relative;width:390px;min-height:100vh;margin:0 auto;background:var(--page);\n  overflow:hidden;transition:width .25s var(--ease);\n}\n/* viewport-driven framing (independent of window width so the dev toolbar always works) */\nhtml[data-viewport=\"mobile\"] body{background:var(--page)}\nhtml[data-viewport=\"mobile\"] #app{width:390px;border:0;box-shadow:none;min-height:100vh}\nhtml[data-viewport=\"tablet\"] body{background:#FAFAFA}\nhtml[data-viewport=\"tablet\"] #app{width:470px;border-left:1px solid var(--border);border-right:1px solid var(--border);min-height:100vh}\nhtml[data-viewport=\"desktop\"] body{background:#E7E9ED;padding:28px 0;min-height:100vh}\nhtml[data-theme=\"dark\"][data-viewport=\"desktop\"] body{background:#0a0a0a}\nhtml[data-viewport=\"desktop\"] #app{width:1080px;max-width:calc(100vw - 40px);min-height:calc(100vh - 56px);\n  background:var(--page);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.22);\n  padding-top:46px;overflow:hidden;position:relative}\nhtml[data-viewport=\"desktop\"] #app::before{content:\"\";position:absolute;top:0;left:0;right:0;height:46px;\n  background:var(--s2);border-bottom:1px solid var(--border);z-index:1}\nhtml[data-viewport=\"desktop\"] #app::after{content:\"\";position:absolute;top:18px;left:20px;width:11px;height:11px;\n  border-radius:50%;background:#ff5f57;box-shadow:19px 0 #febc2e,38px 0 #28c840;z-index:2}\nhtml[data-viewport=\"desktop\"] #screens,html[data-viewport=\"desktop\"] #app>.offline{\n  width:470px;margin:0 auto;background:var(--page);\n  border-left:1px solid var(--border);border-right:1px solid var(--border)}\nhtml[data-viewport=\"desktop\"] #screens{min-height:calc(100vh - 200px)}\nhtml[data-theme=\"dark\"] #app{border-color:var(--border)}\n\n/* ============ TYPO HELPERS ============ */\n.t24{font-size:24px;font-weight:700;letter-spacing:-.2px}\n.t20{font-size:20px;font-weight:700;letter-spacing:-.2px}\n.t17{font-size:17px;font-weight:600}\n.t15{font-size:15px;font-weight:400}\n.t15s{font-size:15px;font-weight:600}\n.t13{font-size:13px;font-weight:400}\n.t13s{font-size:13px;font-weight:600}\n.t11{font-size:11px;font-weight:400}\n.t11s{font-size:11px;font-weight:600}\n.i1{color:var(--ink1)}.i2{color:var(--ink2)}.i3{color:var(--ink3)}\n.upper{text-transform:uppercase;letter-spacing:.3px}\n.acc{color:var(--accent)}.err{color:var(--error)}\n\n/* ============ HEADER ============ */\n.appbar{\n  position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:4px;\n  padding:0 8px;background:var(--page);border-bottom:1px solid var(--divider);\n}\n.appbar .title{flex:1;font-size:17px;font-weight:600;text-align:center;min-width:0;\n  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.appbar .title.left{text-align:left;padding-left:8px;font-size:20px;font-weight:700}\n.appbar .title .sub{font-size:11px;font-weight:400;color:var(--ink3);margin-top:1px}\n.iconbtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;\n  border-radius:999px;color:var(--ink1);position:relative;transition:transform .12s var(--ease),background .12s}\n.iconbtn:active{transform:scale(.92);background:var(--s2)}\n.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:999px;background:var(--accent);border:2px solid var(--page)}\n.brand{font-size:20px;font-weight:700}\n.brand .g{color:var(--accent)}\n\n/* ============ SCREENS ============ */\n.screen{display:none;padding-bottom:80px}\n.screen.active{display:block}\n.body-pad{padding:16px}\n.scrollwrap{min-height:calc(100vh - 56px)}\n\n/* ============ BUTTONS ============ */\n.btn{height:44px;border-radius:8px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;\n  justify-content:center;gap:8px;padding:0 18px;transition:transform .12s var(--ease),background .12s;width:100%}\n.btn:active{transform:scale(.98)}\n.btn-primary{background:var(--accent);color:#fff}\n.btn-primary:active{background:var(--accentP)}\n.btn-primary[disabled]{background:var(--accentD);color:#fff;pointer-events:none}\n.btn-error{background:var(--error);color:#fff}\n.btn-secondary{background:var(--s2);color:var(--ink1)}\n.btn-outline{background:transparent;color:var(--ink1);border:1px solid var(--border)}\n.btn-outline:active{background:var(--s2)}\n.btn.sm{height:36px;font-size:13px;font-weight:600;padding:0 14px;width:auto}\n.btn.auto{width:auto}\n.tlink{color:var(--accent);font-size:13px;font-weight:600;background:none;padding:6px 2px}\n.tlink.err{color:var(--error)}\n.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:999px;animation:spin .7s linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n\n/* ============ CHIPS / BADGES ============ */\n.chiprow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}\n.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--ink1);\n  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;\n  transition:transform .12s var(--ease)}\n.chip:active{transform:scale(.96)}\n.chip.active{background:var(--ink1);color:var(--page)}\n.chip .cnt{opacity:.6;font-weight:600}\n.chip.active .cnt{opacity:.8}\n.chip .newdot{width:6px;height:6px;border-radius:999px;background:var(--accent)}\n.badge{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:4px;\n  font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}\n.b-verified{background:var(--accentSoft);color:var(--accent)}\n.b-promoted{background:rgba(0,0,0,.6);color:#fff}\n.b-active{background:var(--accentSoft);color:var(--accent)}\n.b-expired{background:var(--s3);color:var(--ink3)}\n.b-fulfilled{background:var(--accentSoft);color:var(--accent)}\n.b-pending{background:var(--s2);color:var(--ink2)}\n.b-accepted{background:var(--accentSoft);color:var(--accent)}\n.b-declined{background:var(--errorSoft);color:var(--error)}\n.b-urgent{background:var(--warningSoft);color:var(--warning)}\n.b-new{background:var(--infoSoft);color:var(--info)}\n.b-contacted{background:var(--s2);color:var(--ink2)}\n.b-visit{background:var(--warningSoft);color:var(--warning)}\n.b-nego{background:var(--accentSoft);color:var(--accent)}\n.b-closed{background:var(--accent);color:#fff}\n.tag{font-size:11px;font-weight:600;color:var(--ink3)}\n\n/* ============ CARDS ============ */\n.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:var(--l1)}\nhtml[data-theme=\"dark\"] .card{box-shadow:none}\n.card+.card{margin-top:12px}\n.thumb{border-radius:8px;background:linear-gradient(135deg,var(--s3),var(--s2));flex:none;\n  background-image:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.03) 6px,rgba(0,0,0,.03) 12px);\n  display:flex;align-items:center;justify-content:center;color:var(--ink3);overflow:hidden}\n.avatar{border-radius:999px;flex:none;background:linear-gradient(135deg,#cfd8dc,#eceff1);display:flex;align-items:center;\n  justify-content:center;font-weight:700;color:#607d8b;overflow:hidden}\nhtml[data-theme=\"dark\"] .avatar{background:linear-gradient(135deg,#37474f,#263238);color:#b0bec5}\n.avatar.a56{width:56px;height:56px;font-size:20px}\n.avatar.a48{width:48px;height:48px;font-size:17px}\n.avatar.a40{width:40px;height:40px;font-size:15px}\n.avatar.a24{width:24px;height:24px;font-size:11px}\n.avatar.a20{width:20px;height:20px;font-size:10px}\n.row{display:flex;align-items:center;gap:8px}\n.hr{height:1px;background:var(--divider);border:0;margin:12px 0}\n\n/* ============ SECTION HEADERS ============ */\n.sechead{position:sticky;top:56px;z-index:10;background:var(--page);padding:16px 16px 8px;\n  font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px}\n.cascade{display:flex;align-items:center;gap:6px;padding:20px 16px 8px;font-size:13px;font-weight:600;\n  color:var(--ink3);text-transform:uppercase;letter-spacing:.3px}\n\n/* ============ BOTTOM NAV ============ */\n.bottomnav{position:sticky;bottom:0;z-index:20;height:56px;display:flex;background:var(--page);\n  border-top:1px solid var(--divider)}\n.navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;\n  color:var(--ink3);font-size:10px;font-weight:600}\n.navitem.active{color:var(--ink1)}\n.navitem.active svg{stroke-width:2}\n\n/* ============ SHEETS / DIALOGS ============ */\n#overlayRoot{position:fixed;inset:0;z-index:1000;display:none;pointer-events:none}\n#overlayRoot.on{display:block;pointer-events:auto}\n.scrim{position:absolute;inset:0;background:var(--blurBg);opacity:0;transition:opacity .25s var(--ease)}\n.scrim.show{opacity:1}\n.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);width:390px;max-width:100%;\n  background:var(--page);border-radius:16px 16px 0 0;box-shadow:var(--l3);max-height:88vh;overflow-y:auto;\n  transition:transform .3s var(--ease);padding-bottom:24px}\n@media(min-width:768px){.sheet{width:470px}}\n.sheet.show{transform:translate(-50%,0)}\n.sheet .grab{width:36px;height:4px;border-radius:999px;background:var(--border);margin:8px auto 0}\n.sheet-head{display:flex;align-items:center;padding:8px 8px 8px 16px;position:sticky;top:0;background:var(--page);z-index:2}\n.sheet-head .h{flex:1;font-size:17px;font-weight:600}\n.sheet-body{padding:4px 16px}\n.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:320px;max-width:88%;\n  background:var(--page);border-radius:16px;box-shadow:var(--l3);padding:20px;opacity:0;transition:all .22s var(--ease)}\n.dialog.show{transform:translate(-50%,-50%);opacity:1}\n.dialog h3{margin:0 0 8px;font-size:17px;font-weight:600}\n.dialog p{margin:0 0 16px;font-size:13px;color:var(--ink2);line-height:1.5}\n.dialog .actions{display:flex;gap:8px}\n.dialog .actions .btn{flex:1}\n\n/* ============ FORM CONTROL r:var(--page);font-size:13px;font-weight:600;padding:12px 18px;border-radius:8px;\n  box-shadow:var(--l2);opacity:0;pointer-events:none;transition:all .2s var(--ease);max-width:340px;text-align:center}\n#toast.show{transform:translate(-50%,0);opacity:1}\nhtml[data-theme=\"dark\"] #toast{background:var(--s3);color:var(--ink1);border:1px solid var(--border)}\n\n/* ============ STRIPS / MISC ============ */\n.strip{border-radius:8px;padding:12px;font-size:11px;display:flex;gap:8px;align-items:flex-start}\n.strip.warn{background:var(--warningSoft);color:var(--warning)}\n.strip.acc{background:var(--accentSoft);color:var(--accent)}\n.strip.err{background:var(--errorSoft);color:var(--error)}\n.strip.info{background:var(--infoSoft);color:var(--info)}\n.summary{display:flex;background:var(--s2);border-radius:12px;padding:14px 0;margin:0 16px}\n.summary .col{flex:1;text-align:center;position:relative}\n.summary .col+.col::before{content:\"\";position:absolute;left:0;top:20%;height:60%;width:1px;background:var(--border)}\n.summary .n{font-size:17px;font-weight:700;color:var(--ink1)}\n.summary .lbl{font-size:11px;color:var(--ink3);margin-top:2px}\n.tooltip{position:relative}\n.pop{position:absolute;z-index:30;background:var(--ink1);color:var(--page);font-size:11px;line-height:1.5;\n  padding:10px 12px;border-radius:8px;width:230px;box-shadow:var(--l2);right:0;top:28px;display:none}\n.pop.show{display:block}\nhtml[data-theme=\"dark\"] .pop{background:var(--s3);color:var(--ink1);border:1px solid var(--border)}\n.blur6{filter:blur(6px)}\n.lockover{position:relative}\n.lockover .lockic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2)}\n.progress{height:6px;border-radius:999px;background:var(--s3);overflow:hidden}\n.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px}\n\n/* ============ SKELETON ============ */\n.sk{background:var(--s2);border-radius:8px;overflow:hidden;position:relative}\n.sk::after{content:\"\";position:absolute;inset:0;transform:translateX(-100%);\n  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 1.2s infinite}\nhtml[data-theme=\"dark\"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}\n@keyframes shimmer{to{transform:translateX(100%)}}\n.skline{height:12px;border-radius:6px}\n\n/* ============ EMPTY / OFFLINE ============ */\n.empty{padding:64px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}\n.empty .art{color:var(--ink3);margin-bottom:8px}\n.empty h3{margin:0;font-size:17px;font-weight:600}\n.empty p{margin:0;font-size:13px;color:var(--ink2);max-width:260px;line-height:1.5}\n.empty .btn{margin-top:16px;width:auto}\n.offline{background:var(--s3);color:var(--ink2);font-size:13px;font-weight:600;padding:10px 16px;\n  display:none;align-items:center;gap:8px;justify-content:center}\nhtml[data-state=\"offline\"] .offline{display:flex}\n\n/* state visibility helpers */\n[data-showstate]{display:none}\nhtml[data-state=\"normal\"] [data-showstate=\"normal\"]{display:block}\nhtml[data-state=\"skeleton\"] [data-showstate=\"skeleton\"]{display:block}\nhtml[data-state=\"empty\"] [data-showstate=\"empty\"]{display:block}\n\n/* ============ DEV TOOLBAR ============ */\n#dev{position:fixed;top:8px;right:8px;z-index:5000;font-size:11px;font-family:ui-monospace,Menlo,monospace}\n#devToggle{width:32px;height:32px;border-radius:8px;background:rgba(30,30,30,.85);color:#fff;display:flex;\n  align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}\n#devPanel{display:none;position:absolute;top:38px;right:0;width:210px;background:#1c1c1e;color:#ddd;\n  border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-height:82vh;overflow-y:auto}\n#dev.open #devPanel{display:block}\n#dev.open #devToggle{background:#0F9D58}\n.dev-h{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#777;margin:10px 0 5px}\n.dev-h:first-child{margin-top:0}\n.dev-row{display:flex;flex-wrap:wrap;gap:4px}\n.dev-b{background:#2c2c2e;color:#bbb;border-radius:5px;padding:5px 7px;font-size:10px;flex:none}\n.dev-b.on{background:#0F9D58;color:#fff}\n.dev-sel{width:100%;background:#2c2c2e;color:#ddd;border:0;border-radius:5px;padding:6px;font-size:10px;margin-top:2px}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div id=\"app\">\n  <div class=\"offline\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M1 1l22 22M16.7 13.7A5 5 0 006 8m-2.5 2.5A9 9 0 00.9 13\"><\u002Fpath><path d=\"M5 12.5A9 9 0 0114 8.5M12 20h.01\"><\u002Fpath><\u002Fsvg> You're offline — showing cached data<\u002Fdiv>\n  <div id=\"screens\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"overlayRoot\"><div class=\"scrim\" id=\"scrim\"><\u002Fdiv><div id=\"overlayHost\"><\u002Fdiv><\u002Fdiv>\n<div id=\"toast\"><\u002Fdiv>\n\n<!-- DEV TOOLBAR -->\n<div id=\"dev\">\n  <button id=\"devToggle\" onclick=\"document.getElementById('dev').classList.toggle('open')\">\n    <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z\"><\u002Fpath><\u002Fsvg>\n  <\u002Fbutton>\n  <div id=\"devPanel\">\n    <div class=\"dev-h\">Screen<\u002Fdiv>\n    <select class=\"dev-sel\" id=\"devScreen\"><\u002Fselect>\n    <div class=\"dev-h\">Sheets &amp; Dialogs<\u002Fdiv>\n    <select class=\"dev-sel\" id=\"devSheet\"><\u002Fselect>\n    <div class=\"dev-h\">Theme<\u002Fdiv>\n    <div class=\"dev-row\" data-dev=\"theme\">\n      <button class=\"dev-b\" data-val=\"light\">Light<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"dark\">Dark<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"dev-h\">Viewport<\u002Fdiv>\n    <div class=\"dev-row\" data-dev=\"viewport\">\n      <button class=\"dev-b\" data-val=\"mobile\">Mobile<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"tablet\">Tablet<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"desktop\">Desktop<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"dev-h\">Role<\u002Fdiv>\n    <div class=\"dev-row\" data-dev=\"role\">\n      <button class=\"dev-b\" data-val=\"owner\">Owner<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"broker\">Broker<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"builder\">Builder<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"dev-h\">Plan<\u002Fdiv>\n    <div class=\"dev-row\" data-dev=\"plan\">\n      <button class=\"dev-b\" data-val=\"none\">No plan<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"p999\">₹999<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"p2999\">₹2,999<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"dev-h\">State<\u002Fdiv>\n    <div class=\"dev-row\" data-dev=\"state\">\n      <button class=\"dev-b\" data-val=\"normal\">Normal<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"skeleton\">Skeleton<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"empty\">Empty<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"offline\">Offline<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"expired\">Expired<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"fulfilled\">Fulfilled<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"quota\">Quota-exh<\u002Fbutton>\n      <button class=\"dev-b\" data-val=\"duplicate\">Dup-guard<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ============================================================\n   ICONS (Lucide-style, 1.5px outline)\n============================================================ */\nconst IC = {\n  back:'<path d=\"M19 12H5M12 19l-7-7 7-7\"/>',\n  filter:'<path d=\"M22 3H2l8 9.46V19l4 2v-8.54L22 3z\"/>',\n  clock:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>',\n  msg:'<path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\"/>',\n  cal:'<rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/>',\n  plus:'<path d=\"M12 5v14M5 12h14\"/>',\n  export:'<path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3\"/>',\n  more:'<circle cx=\"12\" cy=\"5\" r=\"1.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.5\"/><circle cx=\"12\" cy=\"19\" r=\"1.5\"/>',\n  chevR:'<path d=\"M9 18l6-6-6-6\"/>',\n  check:'<path d=\"M20 6L9 17l-5-5\"/>',\n  x:'<path d=\"M18 6L6 18M6 6l12 12\"/>',\n  lock:'<rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0110 0v4\"/>',\n  phone:'<path d=\"M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0122 16.92z\"/>',\n  copy:'<rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1\"/>',\n  flame:'<path d=\"M12 2s4 4 4 8a4 4 0 01-8 0c0-1 .5-2 .5-2S6 11 6 14a6 6 0 0012 0c0-5-6-12-6-12z\"/>',\n  pin:'<path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/>',\n  list:'<path d=\"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01\"/>',\n  home:'<path d=\"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z\"/><path d=\"M9 22V12h6v10\"/>',\n  info:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 16v-4M12 8h.01\"/>',\n  share:'<circle cx=\"18\" cy=\"5\" r=\"3\"/><circle cx=\"6\" cy=\"12\" r=\"3\"/><circle cx=\"18\" cy=\"19\" r=\"3\"/><path d=\"M8.6 13.5l6.8 4M15.4 6.5l-6.8 4\"/>',\n  trash:'<path d=\"M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6\"/>',\n  edit:'<path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z\"/>',\n  boost:'<path d=\"M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z\"/>',\n  megaphone:'<path d=\"M3 11l15-6v14L3 13v-2zM3 11H2a1 1 0 00-1 1v0a1 1 0 001 1h1M8 13v5a1 1 0 001 1h1a1 1 0 001-1v-3\"/>',\n  funnel:'<path d=\"M3 4h18l-7 8v7l-4 2v-9L3 4z\"/>',\n  inbox:'<path d=\"M22 12h-6l-2 3h-4l-2-3H2\"/><path d=\"M5.5 5.5L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.5-6.5A2 2 0 0016.7 4H7.3a2 2 0 00-1.8 1.5z\"/>',\n  handshake:'<path d=\"M11 17l2 2 4-4M8 13l-3-3 4-4 3 3M2 12l4 4M22 12l-6 6-3-3\"/>',\n  search:'<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M21 21l-4-4\"/>',\n  house2:'<path d=\"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z\"/>',\n  chat2:'<path d=\"M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z\"/>',\n  wifi:'<path d=\"M5 12.5A9 9 0 0119 12.5M8.5 16A5 5 0 0115.5 16M12 19.5h.01\"/>',\n};\nfunction svg(name,size=24,sw=1.5,cls=''){return `<svg class=\"${cls}\" width=\"${size}\" height=\"${size}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${sw}\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${IC[name]||''}<\u002Fsvg>`;}\nwindow.svg=svg;\n\n/* thumbnail placeholder */\nfunction thumb(size,r=8){return `<div class=\"thumb\" style=\"width:${size}px;height:${size}px;border-radius:${r}px\">${svg('home',Math.min(24,size*.4),1.5)}<\u002Fdiv>`;}\n\n/* ============================================================\n   NAV ENGINE — screens registry + history\n============================================================ */\nconst Screens = {};      // id -> render() => html string\nconst ScreenTitles = {};\nlet currentScreen = null;\n\nfunction registerScreen(id,title,render){Screens[id]=render;ScreenTitles[id]=title;}\n\nfunction renderScreen(id){\n  const host=document.getElementById('screens');\n  host.innerHTML=`<div class=\"screen active\">${Screens[id]()}<\u002Fdiv>`;\n  currentScreen=id;\n  window.scrollTo(0,0);\n  document.getElementById('app').scrollTop=0;\n  const sel=document.getElementById('devScreen'); if(sel)sel.value=id;\n}\n\nfunction go(id,push=true){\n  if(!Screens[id])return;\n  if(push)history.pushState({screen:id},'',`#${id}`);\n  renderScreen(id);\n}\n\nwindow.addEventListener('popstate',e=>{\n  if(isOverlayOpen()){closeOverlay(false);return;}\n  const id=(e.state&&e.state.screen)||'visits';\n  renderScreen(id);\n});\n\n/* ============================================================\n   OVERLAY (sheets + dialogs) with own history entry\n============================================================ */\nlet overlayOpen=false, overlayHistoryPushed=false, dragStartY=null;\nfunction isOverlayOpen(){return overlayOpen;}\n\nfunction openOverlay(html,kind){ // kind: 'sheet' | 'dialog'\n  const root=document.getElementById('overlayRoot'), host=document.getElementById('overlayHost'), scrim=document.getElementById('scrim');\n  host.innerHTML=html;\n  root.classList.add('on');\n  overlayOpen=true;\n  if(!overlayHistoryPushed){history.pushState({overlay:true,screen:currentScreen},'',location.hash);overlayHistoryPushed=true;}\n  requestAnimationFrame(()=>{\n    scrim.classList.add('show');\n    const el=host.firstElementChild;\n    if(el)el.classList.add('show');\n    if(kind==='sheet'&&el)attachDrag(el);\n  });\n}\nfunction closeOverlay(pop=true){\n  const root=document.getElementById('overlayRoot'), host=document.getElementById('overlayHost'), scrim=document.getElementById('scrim');\n  const el=host.firstElementChild;\n  scrim.classList.remove('show');\n  if(el){el.classList.remove('show');if(el.classList.contains('sheet'))el.style.transform='';}\n  overlayOpen=false;\n  setTimeout(()=>{root.classList.remove('on');host.innerHTML='';},280);\n  if(overlayHistoryPushed&&pop){overlayHistoryPushed=false;history.back();}\n  else if(overlayHistoryPushed){overlayHistoryPushed=false;}\n}\ndocument.getElementById('scrim').addEventListener('click',()=>closeOverlay());\n\nfunction attachDrag(el){\n  let sy=null,cur=0;\n  el.addEventListener('touchstart',e=>{if(el.scrollTop<=0){sy=e.touches[0].clientY;}},{passive:true});\n  el.addEventListener('touchmove',e=>{\n    if(sy===null)return;cur=e.touches[0].clientY-sy;\n    if(cur>0){el.style.transform=`translate(-50%,${cur}px)`;}\n  },{passive:true});\n  el.addEventListener('touchend',()=>{\n    if(sy===null)return;\n    if(cur>90){closeOverlay();}else{el.style.transform='';}\n    sy=null;cur=0;\n  });\n}\n\n/* ============================================================\n   TOAST\n============================================================ */\nlet toastT=null;\nfunction toast(msg){\n  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');\n  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);\n}\nwindow.toast=toast;window.go=go;window.openOverlay=openOverlay;window.closeOverlay=closeOverlay;\n\n/* ============================================================\n   DEV TOOLBAR wiring\n============================================================ */\nfunction setAttrState(key,val){\n  document.documentElement.setAttribute('data-'+key,val);\n  document.querySelectorAll(`[data-dev=\"${key}\"] .dev-b`).forEach(b=>b.classList.toggle('on',b.dataset.val===val));\n  if(key==='state'){\n    // jump to the screen where this state is demonstrable so the effect is visible\n    const target={expired:'myReq',fulfilled:'myReq',quota:'reqBrowse',duplicate:'reqBrowse'}[val];\n    if(target){\n      if(val==='quota'||val==='duplicate')document.documentElement.setAttribute('data-plan','p2999');\n      go(target);\n      if(val==='quota'||val==='duplicate')setTimeout(()=>Sheets.proposal('r1'),120);\n      return;\n    }\n    if(currentScreen)renderScreen(currentScreen);\n    return;\n  }\n  if(key==='role'){go('leads');return;}\n  if(key==='plan'&&currentScreen)renderScreen(currentScreen);\n}\ndocument.querySelectorAll('[data-dev] .dev-b').forEach(b=>{\n  b.addEventListener('click',()=>setAttrState(b.parentElement.dataset.dev,b.dataset.val));\n});\n\n/* boot after screens registered (see below) */\nwindow.__boot=function(){\n  const ss=document.getElementById('devScreen');\n  Object.keys(ScreenTitles).forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=ScreenTitles[id];ss.appendChild(o);});\n  ss.addEventListener('change',()=>go(ss.value));\n  const sh=document.getElementById('devSheet');\n  Object.assign(SheetTitles,{cancelVisit:'Dialog · Cancel visit',turnOff:'Dialog · Turn off requirement',markFulfilled:'Dialog · Mark fulfilled',reopen:'Dialog · Reopen',deleteReq:'Dialog · Delete requirement',decline:'Dialog · Decline proposal',notRelevant:'Dialog · Not relevant'});\n  // expose every dialog through the sheet registry so the toolbar can jump to it\n  Object.keys(Dialogs).forEach(k=>{if(!Sheets[k])Sheets[k]=Dialogs[k];});\n  const jumpItems=Object.keys(Sheets);\n  jumpItems.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=SheetTitles[id]||id;sh.appendChild(o);});\n  sh.insertAdjacentHTML('afterbegin','<option value=\"\">— open —<\u002Foption>');\n  sh.addEventListener('change',()=>{if(sh.value){Sheets[sh.value]();sh.value='';}});\n  // init dev button states\n  ['theme','viewport','role','plan','state'].forEach(k=>{\n    const v=document.documentElement.getAttribute('data-'+k);\n    document.querySelectorAll(`[data-dev=\"${k}\"] .dev-b`).forEach(x=>x.classList.toggle('on',x.dataset.val===v));\n  });\n  const start=(location.hash||'').replace('#','')||'visits';\n  history.replaceState({screen:start},'',`#${start}`);\n  renderScreen(start);\n};\n\n/* Sheets registry (filled in later script blocks) */\nconst Sheets={}; const SheetTitles={};\nwindow.Sheets=Sheets;window.SheetTitles=SheetTitles;window.registerScreen=registerScreen;\n\n/* ---------- shared UI helpers ---------- */\nfunction appbar(opts){ // {back, title, sub, left, right:[{icon,onclick,dot}]}\n  const back=opts.back!==false?`<button class=\"iconbtn\" onclick=\"history.back()\">${svg('back')}<\u002Fbutton>`:'<div style=\"width:8px\"><\u002Fdiv>';\n  const rights=(opts.right||[]).map(r=>`<button class=\"iconbtn\" onclick=\"${r.onclick}\">${svg(r.icon)}${r.dot?'<span class=\"dot\"><\u002Fspan>':''}<\u002Fbutton>`).join('');\n  const title=opts.brand?`<div class=\"title left\"><span class=\"brand\">Homz<span class=\"g\">List<\u002Fspan><\u002Fspan><\u002Fdiv>`\n    :`<div class=\"title ${opts.left?'left':''}\">${opts.title}${opts.sub?`<div class=\"sub\">${opts.sub}<\u002Fdiv>`:''}<\u002Fdiv>`;\n  return `<div class=\"appbar\">${back}${title}${rights||'<div style=\"width:8px\"><\u002Fdiv>'}<\u002Fdiv>`;\n}\nfunction skRow(){return `<div class=\"card\"><div class=\"row\" style=\"align-items:flex-start\"><div class=\"sk\" style=\"width:56px;height:56px;border-radius:8px\"><\u002Fdiv><div style=\"flex:1\"><div class=\"sk skline\" style=\"width:70%\"><\u002Fdiv><div class=\"sk skline\" style=\"width:45%;margin-top:8px\"><\u002Fdiv><div class=\"sk skline\" style=\"width:55%;margin-top:12px;height:10px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;}\nfunction skList(n){let s='<div class=\"body-pad\">';for(let i=0;i<n;i++)s+=skRow();return s+'<\u002Fdiv>';}\nfunction emptyState(icon,title,sub,btn){return `<div class=\"empty\"><div class=\"art\">${svg(icon,96,1.2)}<\u002Fdiv><h3>${title}<\u002Fh3><p>${sub}<\u002Fp>${btn?`<button class=\"btn btn-primary auto\" onclick=\"${btn.onclick}\">${btn.label}<\u002Fbutton>`:''}<\u002Fdiv>`;}\nfunction role(){return document.documentElement.getAttribute('data-role');}\nfunction plan(){return document.documentElement.getAttribute('data-plan');}\nfunction estate(){return document.documentElement.getAttribute('data-state');}\n\n/* =====================================================================\n   S1 · MY VISITS\n===================================================================== */\nregisterScreen('visits','My Visits',()=>{\n  const st=estate();\n  let body;\n  if(st==='skeleton')body=skList(4);\n  else if(st==='empty')body=emptyState('cal','No visits scheduled','Site visits you schedule from chats appear here',{label:'Explore Properties',onclick:\"toast('Opening Explore…')\"});\n  else body=visitsBody();\n  return appbar({back:false,left:true,title:'My visits',right:[{icon:'filter',onclick:\"Sheets.visitFilter()\"}]})+`<div class=\"scrollwrap\">${body}<\u002Fdiv>`;\n});\n\nfunction visitCard(v){\n  const chipCls={Confirmed:'b-active',Proposed:'b-pending',Completed:'b-expired',Cancelled:'b-declined'}[v.status];\n  const footer = v.group==='past' ?\n    `<div class=\"strip warn\" style=\"margin-top:12px;flex-direction:column;gap:8px\"><div class=\"t11s\" style=\"color:var(--warning)\">How did this visit go?<\u002Fdiv><div class=\"row\" style=\"gap:8px\"><button class=\"chip\" onclick=\"setOutcome(this,'Done')\">Done<\u002Fbutton><button class=\"chip\" onclick=\"setOutcome(this,'Cancelled')\">Cancelled<\u002Fbutton><button class=\"chip\" onclick=\"Sheets.reschedule()\">Reschedule<\u002Fbutton><\u002Fdiv><\u002Fdiv>`\n    : (v.status==='Confirmed'||v.status==='Proposed') ?\n    `<div class=\"row\" style=\"margin-top:12px;gap:16px\"><button class=\"tlink\" onclick=\"Sheets.reschedule()\">Reschedule<\u002Fbutton><button class=\"tlink err\" onclick=\"Dialogs.cancelVisit()\">Cancel<\u002Fbutton><\u002Fdiv>` : '';\n  const dim=v.group==='completed'||v.group==='cancelled'?'opacity:.6':'';\n  return `<div class=\"card\" style=\"${dim}\">\n    <div class=\"row\" style=\"align-items:flex-start;gap:12px\">\n      ${thumb(56)}\n      <div style=\"flex:1;min-width:0\">\n        <div class=\"t15s\">${v.title}<\u002Fdiv>\n        <div class=\"t11 i3\" style=\"margin-top:2px\">${v.price}<\u002Fdiv>\n        <div class=\"row\" style=\"margin-top:8px;gap:6px\">\n          <span class=\"i2\">${svg('clock',16)}<\u002Fspan><span class=\"t13s\">${v.time}<\u002Fspan>\n          <span class=\"badge ${chipCls}\" style=\"margin-left:2px\">${v.status}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"margin-top:8px;gap:6px\">\n          <div class=\"avatar a20\">${v.who[0]}<\u002Fdiv><span class=\"t11 i3\">with ${v.person}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"iconbtn\" onclick=\"toast('Opening chat…')\">${svg('msg')}<\u002Fbutton>\n    <\u002Fdiv>\n    ${footer}\n  <\u002Fdiv>`;\n}\nfunction setOutcome(el,label){\n  const map={Done:'Completed',Cancelled:'Cancelled',Reschedule:'Proposed'};\n  toast('Visit updated');\n}\n\nconst VISITS={\n  tomorrow:[{title:'3 BHK Flat, Shree Residency',price:'₹85 Lakh · Mavdi, Rajkot',time:'11:00 AM',status:'Confirmed',person:'Nirav Shah (Owner)',who:'Nirav Shah'}],\n  week:[{title:'2 BHK Flat, Kalgi Apartments',price:'₹52 Lakh · Kalavad Road, Rajkot',time:'Wed · 4:30 PM',status:'Proposed',person:'RK Properties (Broker)',who:'RK'},\n        {title:'4 BHK Villa, Raiya Greens',price:'₹1.65 Cr · Raiya Road, Rajkot',time:'Thu · 10:00 AM',status:'Confirmed',person:'Bhavesh Builders (Builder)',who:'Bhavesh'}],\n  pastdue:[{title:'3 BHK Flat, Amrapali Heights',price:'₹78 Lakh · University Road, Rajkot',time:'Yesterday · 5:00 PM',status:'Confirmed',person:'Jignesh Mehta (Owner)',who:'Jignesh',group:'past'}],\n  completed:[{title:'2 BHK Flat, Satya Residency',price:'₹48 Lakh · 150ft Ring Road',time:'20 Jan · 12:00 PM',status:'Completed',person:'Paras Estates (Broker)',who:'Paras',group:'completed'}],\n  cancelled:[{title:'3 BHK Flat, Green Acres',price:'₹92 Lakh · Kalavad Road',time:'18 Jan · 3:00 PM',status:'Cancelled',person:'Hardik Shah (Owner)',who:'Hardik',group:'cancelled'}],\n};\nfunction visitsBody(){\n  const sec=(label,arr)=>arr.length?`<div class=\"sechead\">${label}<\u002Fdiv><div class=\"body-pad\" style=\"padding-top:0\">${arr.map(visitCard).join('')}<\u002Fdiv>`:'';\n  return sec('Tomorrow · Sat, 25 Jan',VISITS.tomorrow)+sec('This week',VISITS.week)+sec('Awaiting your feedback',VISITS.pastdue)+sec('Completed',VISITS.completed)+sec('Cancelled',VISITS.cancelled);\n}\n\n/* ---- S1 sheets ---- */\nfunction sheetShell(title,bodyHtml){\n  return `<div class=\"sheet\"><div class=\"grab\"><\u002Fdiv><div class=\"sheet-head\"><div class=\"h\">${title}<\u002Fdiv><button class=\"iconbtn\" onclick=\"closeOverlay()\">${svg('x',22)}<\u002Fbutton><\u002Fdiv><div class=\"sheet-body\">${bodyHtml}<\u002Fdiv><\u002Fdiv>`;\n}\nSheets.visitFilter=()=>{SheetTitles.visitFilter='Visit filter';\n  const opts=['All','Upcoming','Completed','Cancelled'];\n  openOverlay(sheetShell('Filter visits',opts.map((o,i)=>`<div class=\"selrow\" onclick=\"pickRadio(this);toast('Showing: ${o}');setTimeout(closeOverlay,150)\"><div class=\"radio ${i===0?'on':''}\"><\u002Fdiv><span>${o}<\u002Fspan><\u002Fdiv>`).join('')),'sheet');\n};\nfunction pickRadio(row){row.parentElement.querySelectorAll('.radio').forEach(r=>r.classList.remove('on'));row.querySelector('.radio').classList.add('on');}\n\nSheets.reschedule=()=>{SheetTitles.reschedule='Reschedule visit';\n  const days=['Sat 25','Sun 26','Mon 27','Tue 28','Wed 29','Thu 30','Fri 31'];\n  const times=['9:00 AM','11:00 AM','1:00 PM','3:00 PM','5:00 PM','7:00 PM'];\n  openOverlay(sheetShell('Reschedule visit',`\n    <div class=\"label\">Pick a date<\u002Fdiv>\n    <div class=\"row\" style=\"gap:8px;overflow-x:auto;padding-bottom:4px\">${days.map((d,i)=>`<div class=\"datechip ${i===0?'sel':''}\" onclick=\"pickChip(this)\"><div>${d.split(' ')[1]}<\u002Fdiv><div class=\"d\">${d.split(' ')[0]}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>\n    <div class=\"label\">Pick a time<\u002Fdiv>\n    <div class=\"row\" style=\"gap:8px;flex-wrap:wrap\">${times.map((t,i)=>`<div class=\"timechip ${i===1?'sel':''}\" onclick=\"pickChip(this)\">${t}<\u002Fdiv>`).join('')}<\u002Fdiv>\n    <div class=\"label\">Note<\u002Fdiv>\n    <textarea class=\"field\" rows=\"2\" placeholder=\"Add a note (optional)\"><\u002Ftextarea>\n    <button class=\"btn btn-primary\" style=\"margin-top:16px\" onclick=\"closeOverlay();toast('New time proposed — waiting for confirmation')\">Send new time<\u002Fbutton>\n  `),'sheet');\n};\nfunction pickChip(el){el.parentElement.querySelectorAll('.datechip,.timechip').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}\n\n/* ---- dialogs ---- */\nconst Dialogs={};\nfunction dialogShell(html){return `<div class=\"dialog\">${html}<\u002Fdiv>`;}\nDialogs.cancelVisit=()=>{SheetTitles.cancelVisit='Cancel visit dialog';\n  const reasons=['Changed my mind','Property not suitable','Schedule conflict','Other'];\n  openOverlay(dialogShell(`\n    <h3>Cancel this visit?<\u002Fh3>\n    <p>Nirav Shah will be notified.<\u002Fp>\n    <div style=\"margin:-6px 0 16px\">${reasons.map((r,i)=>`<div class=\"selrow\" onclick=\"pickRadio(this)\"><div class=\"radio ${i===0?'on':''}\"><\u002Fdiv><span class=\"t15\">${r}<\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv>\n    <div class=\"actions\"><button class=\"btn btn-outline\" onclick=\"closeOverlay()\">Keep<\u002Fbutton><button class=\"btn btn-error\" onclick=\"closeOverlay();toast('Visit cancelled')\">Cancel visit<\u002Fbutton><\u002Fdiv>\n  `),'dialog');\n};\nSheets.cancelVisit=Dialogs.cancelVisit;\nwindow.setOutcome=setOutcome;window.pickRadio=pickRadio;window.pickChip=pickChip;window.Dialogs=Dialogs;\n<\u002Fscript>\n\n<script>\n/* =====================================================================\n   S2 · LEADS PIPELINE\n===================================================================== */\nconst STAGES=[{k:'all',label:'All',n:24},{k:'new',label:'New',n:6,dot:true},{k:'contacted',label:'Contacted',n:8},{k:'visit',label:'Visit',n:4},{k:'nego',label:'Negotiation',n:3},{k:'closed',label:'Closed',n:3}];\nconst STAGECHIP={New:'b-new',Contacted:'b-contacted',Visit:'b-visit',Negotiation:'b-nego','Closed-won':'b-closed','Closed-lost':'b-declined'};\nconst LEADS=[\n  {name:'Meet Patel',verified:true,stage:'New',trust:'Phone verified ✓ · Member since Mar 2025 · Profile 80%',prop:'3 BHK Flat, Mavdi',price:'₹85 L',act:'Last activity: Requirement matched 1h ago',who:'MP'},\n  {name:'Krishna Joshi',verified:true,stage:'Visit',trust:'Phone verified ✓ · Member since Jan 2025 · Profile 100%',prop:'2 BHK Flat, Kalavad Road',price:'₹52 L',act:'Last activity: Visit confirmed for Sat 25 Jan',who:'KJ'},\n  {name:'Ravi Dobariya',verified:false,stage:'Negotiation',trust:'Phone verified ✓ · Member since Feb 2025 · Profile 60%',prop:'4 BHK Villa, Raiya Road',price:'₹1.65 Cr',act:'Last activity: Counter-offer ₹1.55 Cr · 3h ago',who:'RD'},\n  {name:'Ankit Vora',verified:true,stage:'Contacted',trust:'Phone verified ✓ · Member since Dec 2024 · Profile 90%',prop:'3 BHK Flat, University Road',price:'₹78 L',act:'Last activity: Called · yesterday',who:'AV'},\n];\nregisterScreen('leads','Leads Pipeline',()=>{\n  const st=estate();\n  const isBuilder=role()==='builder';\n  const header=appbar({title:'Leads',sub:isBuilder?'Builder · project enquiries':'Broker workspace',right:[{icon:'export',onclick:\"Sheets.exportLeads()\"},{icon:'filter',onclick:\"Sheets.leadFilter()\"}]});\n  if(st==='skeleton')return header+skList(4);\n  if(st==='empty')return header+emptyState('funnel','No leads yet','Leads from your listings and requirements appear here',{label:'Boost a Listing',onclick:\"toast('Opening boost…')\"});\n  if(role()==='owner')return header+`<div class=\"scrollwrap\">${ownerLeads()}<\u002Fdiv>`;\n  const chips=`<div class=\"chiprow\">${STAGES.map((s,i)=>`<button class=\"chip ${i===0?'active':''}\" onclick=\"filterStage(this,'${s.label}')\">${s.dot?'<span class=\"newdot\"><\u0 k soon or expand your city');}\n  else if(st==='skeleton'){body=reqSkeleton();}\n  else if(plan()==='p2999'){body=paidReq();}\n  else{body=unpaidReq();}\n  return header+`<div class=\"scrollwrap\">${mode}${body}<\u002Fdiv>`+bottomnav('reqBrowse');\n});\n\nfunction bottomnav(active){\n  const items=[{id:'visits',ic:'cal',l:'Visits'},{id:'leads',ic:'funnel',l:'Leads'},{id:'reqBrowse',ic:'search',l:'Requirements'},{id:'myProp',ic:'handshake',l:'Proposals'},{id:'myReq',ic:'list',l:'My Reqs'}];\n  return `<div class=\"bottomnav\">${items.map(i=>`<button class=\"navitem ${i.id===active?'active':''}\" onclick=\"go('${i.id}')\">${svg(i.ic,22)}<span>${i.l}<\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv>`;\n}\n\n/* ---- UNPAID ---- */\nfunction unpaidReq(){\n  const banner=`<div class=\"body-pad\" style=\"padding-bottom:0\"><div class=\"strip acc\" style=\"align-items:center;gap:10px;padding:12px\"><span>${svg('lock',22)}<\u002Fspan><div style=\"flex:1\"><div class=\"t15s\" style=\"color:var(--accent)\">Unlock all requirements<\u002Fdiv><div class=\"t11 i2\" style=\"color:var(--ink2)\">See full details and contact posters — ₹2,999/month<\u002Fdiv><\u002Fdiv><button class=\"btn btn-primary sm\" onclick=\"Sheets.paywall()\">Unlock<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n  const cards=[REQ_UNLOCKED[0],{...REQ_UNLOCKED[1],promoted:true},REQ_UNLOCKED[2],REQ_NEARBY[0]].map((r,i)=>lockedCard(r,i===1)).join('');\n  return banner+`<div class=\"body-pad\">${cards}<\u002Fdiv>`;\n}\nfunction lockedCard(r,promoted){\n  return `<div class=\"card\" style=\"position:relative\">\n    ${promoted?'<span class=\"badge b-promoted\" style=\"position:absolute;top:12px;right:12px\">Promoted<\u002Fspan>':''}\n    <div class=\"row\" style=\"gap:6px;margin-bottom:12px\">\n      <span class=\"badge b-active\">${r.intent}<\u002Fspan>\n      ${r.urgent?`<span class=\"badge b-urgent\">${svg('flame',12,2)} Urgent<\u002Fspan>`:''}\n    <\u002Fdiv>\n    <div class=\"lockover\" style=\"width:max-content;max-width:100%\">\n      <span class=\"blur6 t24\" style=\"display:inline-block\">₹••L – ₹••L<\u002Fspan>\n      <span class=\"lockic\" style=\"justify-content:flex-start;padding-left:0\"><span style=\"margin-left:8px\">${svg('lock',16)}<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"t15 i1\" style=\"margin-top:8px\">${r.detail}<\u002Fdiv>\n    <div class=\"lockover row\" style=\"margin-top:12px;gap:8px;width:max-content\">\n      <div class=\"avatar a24 blur6\"><\u002Fdiv><span class=\"blur6 t13s\" style=\"width:90px;height:14px;background:var(--s3);border-radius:6px;display:inline-block\"><\u002Fspan>\n      <span class=\"lockic\">${svg('lock',16)}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"t11 i3\" style=\"margin-top:10px\">Posted ${r.meta.split('· ')[1]||'2h ago'}<\u002Fdiv>\n    <button class=\"btn btn-primary\" style=\"margin-top:12px\" onclick=\"Sheets.paywall()\">${svg('lock',18)} Unlock — ₹2,999/mo<\u002Fbutton>\n  <\u002Fdiv>`;\n}\n\n/* ---- PAID ---- */\nfunction paidReq(){\n  const counter=`<div class=\"body-pad\" style=\"padding-bottom:0\"><div class=\"row\" style=\"background:var(--s2);border-radius:8px;padding:10px 12px\"><span class=\"t13s acc\" style=\"flex:1\"><span id=\"quotaTxt\">${quotaRemaining}<\u002Fspan> proposals remaining<\u002Fspan><button class=\"tlink\" onclick=\"Sheets.topup()\">Top up<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n  const main=REQ_UNLOCKED.map(unlockedCard).join('');\n  const near=`<div class=\"cascade\">${svg('pin',16)} Nearby: University Road<\u002Fdiv><div class=\"body-pad\" style=\"padding-top:0\">${REQ_NEARBY.map(unlockedCard).join('')}<\u002Fdiv>`;\n  const other=`<div class=\"cascade\">${svg('pin',16)} Other areas in Rajkot<\u002Fdiv><div class=\"body-pad\" style=\"padding-top:0\">${REQ_OTHER.map(unlockedCard).join('')}<\u002Fdiv>`;\n  return counter+`<div class=\"body-pad\">${main}<\u002Fdiv>${near}${other}`;\n}\nfunction unlockedCard(r){\n  const sent=SENT_REQS.has(r.id);\n  return `<div class=\"card\" styl
