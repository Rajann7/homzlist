K Mavdi'},{p:'₹58 L · 2 BHK Kalavad Rd'},{p:'₹1.6 Cr · 4 BHK Raiya'}];\n  const msgs={property:'Hi, I have a 3 BHK in Mavdi that matches your requirement — ₹82 Lakh, ready to move.',chat:'Hi, I have a few options that match your requirement. Can we discuss?'};\n  const picker = propOption==='property' ? `\n    <div class=\"row\" style=\"gap:8px;overflow-x:auto;padding:4px 0;margin-top:8px\">\n      ${listings.map((l,i)=>`<div class=\"card ${i===0?'sel':''}\" style=\"width:150px;flex:none;padding:8px;${i===0?'border-color:var(--accent);border-width:2px':''}\" onclick=\"pickListing(this)\">\n        ${thumb(134,6)}<div class=\"t11s\" style=\"margin-top:6px\">${l.p}<\u002Fdiv>${i===0?`<span class=\"acc\" style=\"position:absolute\">${svg('check',16,2.5)}<\u002Fspan>`:''}<\u002Fdiv>`).join('')}\n    <\u002Fdiv>\n    <button class=\"tlink\" onclick=\"toast('Send a suggestion instead')\">No matching listing? Send a suggestion instead<\u002Fbutton>` : '';\n  const footer = quotaExh ? `\n    <div class=\"strip err\" style=\"margin-top:12px\">0 proposals remaining<\u002Fdiv>\n    <button class=\"btn btn-primary\" style=\"margin-top:12px\" onclick=\"inlineTopup()\">Add 10 proposals — ₹499<\u002Fbutton>`\n    : dup ? `\n    <div class=\"strip warn\" style=\"margin-top:12px\">You've already sent a proposal for this requirement<\u002Fdiv>\n    <button class=\"btn btn-primary\" style=\"margin-top:12px\" disabled>Send Proposal<\u002Fbutton>`\n    : `\n    <div class=\"row\" style=\"margin-top:14px;gap:12px\"><span class=\"t11 i3\" style=\"flex:1\">${quotaRemaining} proposals remaining<\u002Fspan><\u002Fdiv>\n    <button class=\"btn btn-primary\" style=\"margin-top:8px\" onclick=\"sendProposal()\">Send Proposal<\u002Fbutton>`;\n  const html=sheetShell('Send Proposal',`\n    <div class=\"optcard row\" style=\"border:1px solid ${propOption==='property'?'var(--accent)':'var(--border)'};border-radius:12px;padding:14px;gap:12px;cursor:pointer\" onclick=\"setPropOption('property')\">\n      <span class=\"${propOption==='property'?'acc':'i2'}\">${svg('house2',24)}<\u002Fspan>\n      <div style=\"flex:1\"><div class=\"t15s\">I have a property<\u002Fdiv><div class=\"t11 i3\">Attach one of your listings<\u002Fdiv><\u002Fdiv>\n      <div class=\"radio ${propOption==='property'?'on':''}\"><\u002Fdiv>\n    <\u002Fdiv>\n    ${picker}\n    <div class=\"optcard row\" style=\"border:1px solid ${propOption==='chat'?'var(--accent)':'var(--border)'};border-radius:12px;padding:14px;gap:12px;margin-top:10px;cursor:pointer\" onclick=\"setPropOption('chat')\">\n      <span class=\"${propOption==='chat'?'acc':'i2'}\">${svg('chat2',24)}<\u002Fspan>\n      <div style=\"flex:1\"><div class=\"t15s\">Can we chat<\u002Fdiv><div class=\"t11 i3\">Discuss options first<\u002Fdiv><\u002Fdiv>\n      <div class=\"radio ${propOption==='chat'?'on':''}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"label\">Message<\u002Fdiv>\n    <textarea class=\"field\" rows=\"3\">${msgs[propOption]}<\u002Ftextarea>\n    ${footer}\n  `);\n  if(open)openOverlay(html,'sheet');\n  else{document.getElementById('overlayHost').innerHTML=html;const el=document.getElementById('overlayHost').firstElementChild;el.classList.add('show');}\n}\nfunction setPropOption(o){propOption=o;renderProposalSheet(false);}\nfunction pickListing(el){el.parentElement.querySelectorAll('.card').forEach(c=>{c.style.borderColor='var(--border)';c.style.borderWidth='1px';});el.style.borderColor='var(--accent)';el.style.borderWidth='2px';}\nfunction sendProposal(){\n  if(quotaRemaining>0)quotaRemaining--;\n  SENT_REQS.add(propReqId);\n  closeOverlay();\n  toast(`Proposal sent — ${quotaRemaining} remaining`);\n  if(currentScreen==='reqBrowse')setTimeout(()=>renderScreen('reqBrowse'),350);\n}\nfunction inlineTopup(){\n  const host=document.getElementById('overlayHost');\n  host.querySelector('.sheet-body').innerHTML=`\n    <div class=\"card\" style=\"text-align:center;box-shadow:none;background:var(--s2);border-color:transparent\">\n      <div class=\"t17\">+10 proposals<\u002Fdiv><div class=\"t24\" style=\"margin:6px 0\">₹499<\u002Fdiv><div class=\"t11 i3\">Added to your current plan<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn btn-primary\" style=\"margin-top:16px\" onclick=\"afterInlineTopup()\">Pay ₹499<\u002Fbutton>\n    <button class=\"btn btn-outline\" style=\"margin-top:8px\" onclick=\"renderProposalSheet(false)\">Back<\u002Fbutton>`;\n}\nfunction afterInlineTopup(){quotaRemaining=10;document.documentElement.setAttribute('data-state','normal');\n  document.querySelectorAll('[data-dev=\"state\"] .dev-b').forEach(b=>b.classList.toggle('on',b.dataset.val==='normal'));\n  renderProposalSheet(false);setTimeout(()=>{sendProposal();},400);\n}\nSheets.typeFilter=()=>{SheetTitles.typeFilter='Property type';\n  openOverlay(sheetShell('Property type',['Flat / Apartment','Villa / Bungalow','Plot / Land','Commercial','Any'].map((o,i)=>`<div class=\"selrow\" onclick=\"pickRadio(this);toast('${o}');setTimeout(closeOverlay,150)\"><div class=\"radio ${i===0?'on':''}\"><\u002Fdiv><span class=\"t15\">${o}<\u002Fspan><\u002Fdiv>`).join('')),'sheet');\n};\nSheets.reqFilter=()=>{SheetTitles.reqFilter='Requirements filter';\n  openOverlay(sheetShell('Filter requirements',`\n    <div class=\"label\">Intent<\u002Fdiv><div class=\"row\" style=\"gap:8px\">${['All','Buy','Rent'].map((o,i)=>`<button class=\"chip ${i===0?'active':''}\" onclick=\"filterStage(this,'${o}')\">${o}<\u002Fbutton>`).join('')}<\u002Fdiv>\n    <div class=\"label\">Budget range<\u002Fdiv><select class=\"field\"><option>Any<\u002Foption><option>Under ₹50 L<\u002Foption><option>₹50 L – ₹1 Cr<\u002Foption><option>Above ₹1 Cr<\u002Foption><\u002Fselect>\n    <div class=\"label\">Areas<\u002Fdiv><div class=\"row\" style=\"flex-wrap:wrap;gap:8px\">${['Mavdi','University Rd','Kalavad Rd','Raiya Rd','150ft Ring Rd'].map(a=>`<button class=\"chip\" onclick=\"this.classList.toggle('active')\">${a}<\u002Fbutton>`).join('')}<\u002Fdiv>\n    <button class=\"btn btn-primary\" style=\"margin-top:16px\" onclick=\"closeOverlay();toast('Filters applied')\">Apply<\u002Fbutton>\n  `),'sheet');\n};\nwindow.setPropOption=setPropOption;window.pickListing=pickListing;window.sendProposal=sendProposal;window.inlineTopup=inlineTopup;window.afterInlineTopup=afterInlineTopup;window.renderProposalSheet=renderProposalSheet;\n<\u002Fscript>\n<script>\n/* =====================================================================\n   S4 · MY REQUIREMENTS\n===================================================================== */\nregisterScreen('myReq','My Requirements',()=>{\n  const st=estate();\n  const header=appbar({title:'My requirements',right:[{icon:'plus',onclick:\"toast('Opening requirement form…')\"}]});\n  if(st==='skeleton')return header+skList(2);\n  if(st==='empty')return header+emptyState('search','No requirements posted','Tell us what you’re looking for and matching properties will find you',{label:'Post a Requirement',onclick:\"toast('Opening form…')\"});\n  const planStrip=`<div class=\"body-pad\" style=\"padding-bottom:0\"><div class=\"row\" style=\"background:var(--s2);border-radius:8px;padding:10px 12px;gap:6px\"><span class=\"t13 i2\" style=\"flex:1\">1 of 1 requirement used · 22 days left<\u002Fspan><button class=\"iconbtn\" style=\"width:28px;height:28px\" onclick=\"togglePlanTip(this)\">${svg('info',20)}<\u002Fbutton><div class=\"pop\" id=\"planTip\">Your ₹999 plan includes 1 requirement post for 30 days. Turning it off or deleting it still uses the quota.<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  let card;\n  if(st==='expired')card=reqExpiredCard();\n  else if(st==='fulfilled')card=reqFulfilledCard();\n  else card=reqActiveCard();\n  return header+`<div class=\"scrollwrap\">${planStrip}<div class=\"body-pad\">${card}<\u002Fdiv><\u002Fdiv>`+bottomnav('myReq');\n});\nfunction togglePlanTip(btn){const p=document.getElementById('planTip');p.classList.toggle('show');}\nlet reqActive=true;\nfunction reqActiveCard(){\n  const mini=[{p:'₹52 L',a:'Mavdi'},{p:'₹58 L',a:'University Rd'},{p:'₹49 L',a:'Nearby: Raiya Rd'}];\n  return `<div class=\"card\" style=\"padding:16px\" id=\"reqCard\">\n    <div class=\"row\"><span class=\"badge b-active\" id=\"reqChip\">Active · 22 days left<\u002Fspan><\u002Fdiv>\n    <div class=\"t20\" style=\"margin-top:12px\">₹40 Lakh – ₹60 Lakh<\u002Fdiv>\n    <div class=\"t13 i2\" style=\"margin-top:6px\">3 BHK · Flat · Buy<\u002Fdiv>\n    <div class=\"row\" style=\"gap:6px;margin-top:10px;flex-wrap:wrap\">${['Mavdi','University Road','+1'].map(a=>`<span class=\"chip\" style=\"height:26px;font-size:11px;padding:0 10px\">${a}<\u002Fspan>`).join('')}<\u002Fdiv>\n    <div class=\"row\" style=\"background:var(--s2);border-radius:8px;padding:12px;margin-top:14px\"><span class=\"t15s\" style=\"flex:1\">Requirement active<\u002Fspan><div class=\"toggle ${reqActive?'on':''}\" id=\"reqToggle\" onclick=\"reqActive?Dialogs.turnOff():turnReqOn()\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:14px;padding:8px 0;cursor:pointer\" onclick=\"go('proposalsRx')\"><span class=\"t15s\" style=\"flex:1\">12 proposals received<\u002Fspan><span class=\"badge b-verified\">4 new<\u002Fspan><span class=\"i3\" style=\"margin-left:8px\">${svg('chevR',20)}<\u002Fspan><\u002Fdiv>\n    <div class=\"hr\"><\u002Fdiv>\n    <div class=\"t13s i3 upper\">Matching properties<\u002Fdiv>\n    <div class=\"row\" style=\"gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px\">${mini.map((m,i)=>`<div class=\"card\" style=\"width:120px;flex:none;padding:8px;box-shadow:none\">${thumb(104,6)}<div class=\"t13s\" style=\"margin-top:6px\">${m.p}<\u002Fdiv><div class=\"t11 i3\">${m.a}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:16px;gap:8px\">\n      <button class=\"btn btn-outline\" onclick=\"toast('Opening form…')\">Edit<\u002Fbutton>\n      <button class=\"btn btn-outline\" onclick=\"Dialogs.markFulfilled()\">Mark Fulfilled<\u002Fbutton>\n      <button class=\"iconbtn\" style=\"border:1px solid var(--border);border-radius:8px;width:44px\" onclick=\"Sheets.reqMore()\">${svg('more',20)}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction turnReqOn(){reqActive=true;renderScreen('myReq');toast('Requirement turned on');}\nfunction reqExpiredCard(){\n  return `<div class=\"card\" style=\"padding:16px;opacity:.85\">\n    <div class=\"row\"><span class=\"badge b-expired\">Expired<\u002Fspan><\u002Fdiv>\n    <div class=\"t20\" style=\"margin-top:12px;opacity:.6\">₹40 Lakh – ₹60 Lakh<\u002Fdiv>\n    <div class=\"t13 i2\" style=\"margin-top:6px;opacity:.6\">3 BHK · Flat · Buy<\u002Fdiv>\n    <div class=\"strip warn\" style=\"margin-top:14px\">This requirement expired on 12 Jan. Renew your plan to reactivate it.<\u002Fdiv>\n    <div class=\"row\" style=\"background:var(--s2);border-radius:8px;padding:12px;margin-top:14px\"><span class=\"t15s\" style=\"flex:1;opacity:.6\">Requirement active<\u002Fspan><div class=\"toggle dis\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"t11 i3\" style=\"margin-top:8px\">Renew a plan to turn this back on — it will use a requirement slot.<\u002Fdiv>\n    <button class=\"btn btn-primary\" style=\"margin-top:14px\" onclick=\"toast('Opening plans…')\">View Plans<\u002Fbutton>\n  <\u002Fdiv>`;\n}\nfunction reqFulfilledCard(){\n  return `<div class=\"card\" style=\"padding:16px\">\n    <div class=\"row\"><span class=\"badge b-fulfilled\">${svg('check',12,3)} Fulfilled<\u002Fspan><\u002Fdiv>\n    <div class=\"t20\" style=\"margin-top:12px\">₹40 Lakh – ₹60 Lakh<\u002Fdiv>\n    <div class=\"t13 i2\" style=\"margin-top:6px\">3 BHK · Flat · Buy<\u002Fdiv>\n    <div class=\"t11 i3\" style=\"margin-top:14px\">Proposals are closed for this requirement<\u002Fdiv>\n    <button class=\"tlink\" style=\"margin-top:8px\" onclick=\"Dialogs.reopen()\">Reopen<\u002Fbutton>\n  <\u002Fdiv>`;\n}\nSheets.reqMore=()=>{SheetTitles.reqMore='Requirement actions';\n  openOverlay(sheetShell('Requirement',`\n    <div class=\"selrow\" onclick=\"closeOverlay();toast('Boosting requirement…')\"><span class=\"i2\">${svg('boost',20)}<\u002Fspan><span class=\"t15\">Boost requirement<\u002Fspan><\u002Fdiv>\n    <div class=\"selrow\" onclick=\"closeOverlay();toast('Share link copied')\"><span class=\"i2\">${svg('share',20)}<\u002Fspan><span class=\"t15\">Share<\u002Fspan><\u002Fdiv>\n    <div class=\"selrow\" onclick=\"Dialogs.deleteReq()\"><span class=\"err\">${svg('trash',20)}<\u002Fspan><span class=\"t15 err\">Delete<\u002Fspan><\u002Fdiv>\n  `),'sheet');\n};\nDialogs.turnOff=()=>{SheetTitles.turnOff='Turn off dialog';\n  openOverlay(dialogShell(`<h3>Turn off this requirement?<\u002Fh3><p>It will stop receiving proposals. This still counts against your plan quota — turning it back on won't restore it.<\u002Fp><div class=\"actions\"><button class=\"btn btn-outline\" onclick=\"closeOverlay()\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"reqActive=false;closeOverlay();renderScreen('myReq');toast('Requirement turned off')\">Turn Off<\u002Fbutton><\u002Fdiv>`),'dialog');\n};\nDialogs.markFulfilled=()=>{SheetTitles.markFulfilled='Mark fulfilled dialog';\n  openOverlay(dialogShell(`<h3>Mark as fulfilled?<\u002Fh3><p>New proposals will stop. You can reopen it later — it will use a slot again.<\u002Fp><div class=\"actions\"><button class=\"btn btn-outline\" onclick=\"closeOverlay()\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"closeOverlay();toast('Requirement marked fulfilled')\">Mark Fulfilled<\u002Fbutton><\u002Fdiv>`),'dialog');\n};\nDialogs.reopen=()=>{SheetTitles.reopen='Reopen dialog';\n  openOverlay(dialogShell(`<h3>Reopen this requirement?<\u002Fh3><p>It will use a requirement slot from your current plan.<\u002Fp><div class=\"actions\"><button class=\"btn btn-outline\" onclick=\"closeOverlay()\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"closeOverlay();toast('Requirement reopened')\">Reopen<\u002Fbutton><\u002Fdiv>`),'dialog');\n};\nDialogs.deleteReq=()=>{SheetTitles.deleteReq='Delete dialog';\n  openOverlay(dialogShell(`<h3>Delete this requirement?<\u002Fh3><p><strong style=\"color:var(--ink1)\">This can't be undone. Deleting still uses your plan quota — you won't get the slot back.<\u002Fstrong><\u002Fp><div class=\"actions\"><button class=\"btn btn-outline\" onclick=\"closeOverlay()\">Cancel<\u002Fbutton><button class=\"btn btn-error\" onclick=\"closeOverlay();toast('Requirement deleted')\">Delete<\u002Fbutton><\u002Fdiv>`),'dialog');\n};\nwindow.togglePlanTip=togglePlanTip;window.turnReqOn=turnReqOn;\n<\u002Fscript>\n<script>\n/* =====================================================================\n   S5 · PROPOSALS RECEIVED\n===================================================================== */\nregisterScreen('proposalsRx','Proposals Received',()=>{\n  const st=estate();\n  const header=appbar({title:'Proposals',sub:'3 BHK · ₹40–60 L · Mavdi'});\n  if(st==='skeleton')return header+skList(3);\n  if(st==='empty')return header+emptyState('inbox','No proposals yet','Brokers and owners will respond soon — boost your requirement to get more',{label:'Boost Requirement',onclick:\"toast('Boosting…')\"});\n  const chips=`<div class=\"chiprow\">${[['All',12],['New',4],['Accepted',2],['Declined',3],['Not relevant',1]].map((c,i)=>`<button class=\"chip ${i===0?'active':''}\" onclick=\"filterStage(this,'${c[0]}')\">${c[0]} <span class=\"cnt\">${c[1]}<\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv>`;\n  return header+`<div class=\"scrollwrap\">${chips}<div class=\"body-pad\" style=\"padding-top:4px\">${propRxNew()}${propRxChat()}${propRxAccepted()}<\u002Fdiv><\u002Fdiv>`;\n});\nfunction trustStrip(t){return `<div class=\"strip\" style=\"background:var(--s2);color:var(--ink3);margin-top:10px\">${t}<\u002Fdiv>`;}\nfunction numberRow(){return `<div class=\"strip acc\" style=\"flex-direction:column;gap:8px;margin-top:10px\">\n  <div class=\"row\" style=\"width:100%;gap:8px\"><span class=\"acc\">${svg('phone',20)}<\u002Fspan><span class=\"t15s\" style=\"flex:1;color:var(--ink1)\">+91 98250 12345<\u002Fspan>\n  <button class=\"iconbtn\" style=\"width:36px;height:36px\" onclick=\"toast('Number copied')\">${svg('copy',18)}<\u002Fbutton>\n  <button class=\"iconbtn\" style=\"width:36px;height:36px;color:var(--accent)\" onclick=\"toast('Calling…')\">${svg('phone',18)}<\u002Fbutton><\u002Fdiv>\n  <div class=\"t11 i3\" style=\"width:100%\">Numbers of people responding to your requirement are shown automatically.<\u002Fdiv><\u002Fdiv>`;}\nfunction propRxNew(){\n  return `<div class=\"card\" style=\"padding:16px\" id=\"pr1\">\n    <div class=\"row\" style=\"gap:10px\"><div class=\"avatar a48\">RK<\u002Fdiv><div style=\"flex:1\"><div class=\"row\" style=\"gap:4px\"><span class=\"t15s\">RK Properties<\u002Fspan><span class=\"acc\">${svg('check',15,2.2)}<\u002Fspan><span class=\"tag\" style=\"background:var(--s2);padding:2px 6px;border-radius:4px\">Broker<\u002Fspan><\u002Fdiv><div class=\"t11 i3\" style=\"margin-top:2px\">2h ago<\u002Fdiv><\u002Fdiv><span class=\"chip .newdot\" style=\"background:none;padding:0\"><span class=\"newdot\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n    ${trustStrip('Phone verified ✓ · RERA verified ✓ · Member since Jan 2025 · Responds in 2h')}\n    ${numberRow()}\n    <div class=\"t15\" style=\"margin-top:12px\">Hi, I have a 3 BHK in Shree Residency, Mavdi — ₹82 Lakh, semi-furnished, east facing. Ready to move.<\u002Fdiv>\n    <div class=\"row\" style=\"background:var(--s2);border-radius:8px;padding:12px;margin-top:12px;gap:10px;cursor:pointer\" onclick=\"toast('Opening property…')\">${thumb(56)}<div style=\"flex:1\"><div class=\"t13s\">3 BHK Flat, Shree Residency<\u002Fdiv><div class=\"t11 i3\" style=\"margin-top:2px\">₹82 Lakh · 1,450 sqft · Mavdi<\u002Fdiv><\u002Fdiv><span class=\"i3\">${svg('chevR',20)}<\u002Fspan><\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:14px;gap:8px;align-items:center\"><button class=\"btn btn-outline\" onclick=\"Dialogs.decline('pr1')\">Decline<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"acceptProp('pr1')\">Accept &amp; Chat<\u002Fbutton><\u002Fdiv>\n    <div style=\"text-align:right;margin-top:4px\"><button class=\"tlink err\" onclick=\"Dialogs.notRelevant()\">Not relevant<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction propRxChat(){\n  return `<div class=\"card\" style=\"padding:16px\" id=\"pr2\">\n    <div class=\"row\" style=\"gap:10px\"><div class=\"avatar a48\">HS<\u002Fdiv><div style=\"flex:1\"><div class=\"row\" style=\"gap:4px\"><span class=\"t15s\">Hardik Shah<\u002Fspan><span class=\"acc\">${svg('check',15,2.2)}<\u002Fspan><span class=\"tag\" style=\"background:var(--s2);padding:2px 6px;border-radius:4px\">Owner<\u002Fspan><\u002Fdiv><div class=\"t11 i3\" style=\"margin-top:2px\">5h ago<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    ${trustStrip('Phone verified ✓ · Member since Nov 2024 · Responds in 4h')}\n    ${numberRow()}\n    <div class=\"t15\" style=\"margin-top:12px\">Hi, I have a few options in Mavdi. Can we discuss your needs?<\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:14px;gap:8px;align-items:center\"><button class=\"btn btn-outline\" onclick=\"Dialogs.decline('pr2')\">Decline<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"acceptProp('pr2')\">Accept &amp; Chat<\u002Fbutton><\u002Fdiv>\n    <div style=\"text-align:right;margin-top:4px\"><button class=\"tlink err\" onclick=\"Dialogs.notRelevant()\">Not relevant<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction propRxAccepted(){\n  return `<div class=\"card\" style=\"padding:16px;opacity:.75\" id=\"pr3\">\n    <div class=\"row\" style=\"gap:10px\"><div class=\"avatar a48\">PE<\u002Fdiv><div style=\"flex:1\"><div class=\"row\" style=\"gap:4px\"><span class=\"t15s\">Paras Estates<\u002Fspan><span class=\"acc\">${svg('check',15,2.2)}<\u002Fspan><span class=\"tag\" style=\"background:var(--s2);padding:2px 6px;border-radius:4px\">Broker<\u002Fspan><\u002Fdiv><div class=\"t11 i3\" style=\"margin-top:2px\">Yesterday<\u002Fdiv><\u002Fdiv><span class=\"badge b-accepted\">Accepted<\u002Fspan><\u002Fdiv>\n    <div class=\"t15\" style=\"margin-top:12px\">Hi, I have a 3 BHK in Amrapali Heights — ₹79 Lakh, ready to move.<\u002Fdiv>\n    <button class=\"btn btn-outline\" style=\"margin-top:14px\" onclick=\"toast('Opening chat…')\">Open chat<\u002Fbutton>\n  <\u002Fdiv>`;\n}\nfunction acceptProp(id){\n  const card=document.getElementById(id);\n  if(card){card.querySelector('.btn.btn-primary').closest('.row').outerHTML=`<button class=\"btn btn-outline\" onclick=\"toast('Opening chat…')\">Open chat<\u002Fbutton>`;\n    const head=card.querySelector('.chip')||card;\n    card.querySelector('div.row .newdot')?.closest('.chip')?.remove();\n    card.querySelector('div.row')?.insertAdjacentHTML('beforeend','<span class=\"badge b-accepted\">Accepted<\u002Fspan>');\n    card.style.opacity='.85';}\n  toast('Chat started with '+(id==='pr1'?'RK Properties':'this sender'));\n}\nDialogs.decline=(id)=>{SheetTitles.decline='Decline dialog';\n  openOverlay(dialogShell(`<h3>Decline this proposal?<\u002Fh3><p>They'll be notified. You can still see this in your declined list.<\u002Fp><div class=\"actions\"><button class=\"btn btn-outline\" onclick=\"closeOverlay()\">Cancel<\u002Fbutton><button class=\"btn btn-error\" onclick=\"closeOverlay();toast('Proposal declined')\">Decline<\u002Fbutton><\u002Fdiv>`),'dialog');\n};\nDialogs.notRelevant=()=>{SheetTitles.notRelevant='Not relevant dialog';\n  openOverlay(dialogShell(`<h3>Mark as not relevant?<\u002Fh3><p>This helps us keep proposal quality high. Senders with repeated flags are reviewed.<\u002Fp><div class=\"actions\"><button class=\"btn btn-outline\" onclick=\"closeOverlay()\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"closeOverlay();toast('Marked not relevant')\">Mark<\u002Fbutton><\u002Fdiv>`),'dialog');\n};\nwindow.acceptProp=acceptProp;\n\n/* =====================================================================\n   S6 · MY PROPOSALS SENT\n===================================================================== */\nconst SENT=[\n  {ref:'3 BHK · ₹40–60 L · Mavdi',status:'Pending',poster:'Meet Patel · Owner',who:'MP',listing:'3 BHK Flat, Mavdi — ₹82 L',sent:'Sent 12 Jan · 2:30 PM'},\n  {ref:'2 BHK · ₹18–25k/mo · Kalavad Rd',status:'Accepted',poster:'Priya Sheth · Owner',who:'PS',listing:'2 BHK Flat, Kalavad Rd — ₹58 L',sent:'Sent 10 Jan · 11:10 AM'},\n  {ref:'4 BHK · ₹90 L–1.2 Cr · Raiya Rd',status:'Declined',poster:'Jayesh Kansara · Broker',who:'JK',listing:'4 BHK Villa, Raiya Rd — ₹1.6 Cr',sent:'Sent 8 Jan · 6:45 PM'},\n  {ref:'3 BHK · ₹55–70 L · University Rd',status:'Expired',poster:'Nikhil Ranpara · Owner',who:'NR',chat:true,sent:'Sent 20 Dec · 9:00 AM'},\n  {ref:'2 BHK · ₹35–45 L · 150ft Ring Rd',status:'Fulfilled',poster:'Sagar Vaghela · Owner',who:'SV',listing:'2 BHK Flat, 150ft — ₹42 L',sent:'Sent 18 Dec · 4:20 PM'},\n];\nconst SENTBADGE={Pending:'b-pending',Accepted:'b-accepted',Declined:'b-declined',Expired:'b-expired',Fulfilled:'b-fulfilled'};\nregisterScreen('myProp','My Proposals Sent',()=>{\n  const st=estate();\n  const header=appbar({title:'My proposals'});\n  if(st==='skeleton')return header+skList(4)+bottomnav('myProp');\n  if(st==='empty')return header+emptyState('handshake','No proposals sent','Browse requirements and offer your matching properties',{label:'Browse Requirements',onclick:\"go('reqBrowse')\"})+bottomnav('myProp');\n  const counter=`<div class=\"body-pad\" style=\"padding-bottom:0\"><div style=\"background:var(--s2);border-radius:8px;padding:12px\"><div class=\"row\"><span class=\"t13s acc\" style=\"flex:1\">6 of 10 proposals remaining<\u002Fspan><button class=\"tlink\" onclick=\"Sheets.topup()\">Top up<\u002Fbutton><\u002Fdiv><div class=\"progress\" style=\"margin-top:8px\"><i style=\"width:40%\"><\u002Fi><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  const chips=`<div class=\"chiprow\">${[['All',8],['Pending',3],['Accepted',2],['Declined',1],['Expired',2],['Fulfilled',0]].map((c,i)=>`<button class=\"chip ${i===0?'active':''}\" onclick=\"filterStage(this,'${c[0]}')\">${c[0]} <span class=\"cnt\">${c[1]}<\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv>`;\n  return header+`<div class=\"scrollwrap\">${counter}${chips}<div class=\"body-pad\" style=\"padding-top:0\">${SENT.map(sentRow).join('')}<\u002Fdiv><\u002Fdiv>`+bottomnav('myProp');\n});\nfunction sentRow(s){\n  const listingRow = s.chat\n    ? `<div class=\"row\" style=\"background:var(--s2);border-radius:8px;padding:8px 10px;margin-top:8px;gap:8px\"><span class=\"i3\">${svg('chat2',20)}<\u002Fspan><span class=\"t11 i3\">Chat request — no listing attached<\u002Fspan><\u002Fdiv>`\n    : `<div class=\"row\" style=\"background:var(--s2);border-radius:8px;padding:8px;margin-top:8px;gap:8px\">${thumb(40,6)}<span class=\"t11 i3\">${s.listing}<\u002Fspan><\u002Fdiv>`;\n  const footer={\n    Pending:`<div class=\"row\" style=\"gap:6px;margin-top:10px\"><span class=\"i3\">${svg('clock',16)}<\u002Fspan><span class=\"t11 i3\" style=\"flex:1\">Waiting for response<\u002Fspan><button class=\"tlink\" onclick=\"go('reqBrowse')\">View requirement<\u002Fbutton><\u002Fdiv>`,\n    Accepted:`<div class=\"row\" style=\"gap:6px;margin-top:10px\"><span class=\"acc\">${svg('check',16,2.2)}<\u002Fspan><span class=\"t11 acc\" style=\"flex:1\">Accepted — chat is open<\u002Fspan><button class=\"btn btn-outline auto sm\" onclick=\"toast('Opening chat…')\">Open chat<\u002Fbutton><\u002Fdiv>`,\n    Declined:`<div style=\"margin-top:10px\"><div class=\"t11 i3\">Declined on 14 Jan<\u002Fdiv><div class=\"t11 i3\">Your proposal count isn't refunded<\u002Fdiv><\u002Fdiv>`,\n    Expired:`<div style=\"margin-top:10px\"><div class=\"t11 i3\">No response in 30 days — expired<\u002Fdiv><div class=\"t11 i3\">Your proposal count isn't refunded<\u002Fdiv><\u002Fdiv>`,\n    Fulfilled:`<div class=\"t11 i3\" style=\"margin-top:10px\">Requirement was fulfilled by someone else<\u002Fdiv>`,\n  }[s.status];\n  return `<div class=\"card\" style=\"margin-bottom:12px\">\n    <div class=\"row\"><span class=\"t15s\" style=\"flex:1\">${s.ref}<\u002Fspan><span class=\"badge ${SENTBADGE[s.status]}\">${s.status}<\u002Fspan><\u002Fdiv>\n    <div class=\"row\" style=\"gap:6px;margin-top:8px\"><div class=\"avatar a20\">${s.who}<\u002Fdiv><span class=\"t11 i3\">${s.poster}<\u002Fspan><\u002Fdiv>\n    ${listingRow}\n    <div class=\"t11 i3\" style=\"margin-top:8px\">${s.sent}<\u002Fdiv>\n    ${footer}\n  <\u002Fdiv>`;\n}\n<\u002Fscript>\n<script>window.__boot();<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
